                <div style="width:24px;height:24px;background:${g.status==='critical'?'var(--danger)':'var(--warning)'};color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">${i+1}</div>
                <div>
                  <div style="font-weight:600;font-size:13px">${g.status === 'critical' ? 'Urgently review' : 'Consider increasing'} ${esc(g.type)} coverage</div>
                  <div style="font-size:12px;color:var(--text-3);margin-top:3px">Current: ${fmt(g.current)} → Recommended: ${fmt(g.recommended)} (${fmt(g.gap)} shortfall)</div>
                </div>
              </div>`).join('')}
          </div>
        </div>` : ''}`;
  } catch (e) { toast(e.message, 'error'); }
}

// ── Insurance ──────────────────────────────────────────────────────────────────
function renderCoverageBoard() {
  const clientAge = S.client.age || 30;
  const currentYear = new Date().getFullYear();
  const MIN_AGE = 18, MAX_AGE = 100;
  const cid = S.viewClientId || S.user?.id;

  document.getElementById('pageTitle').textContent = 'Coverage Board';
  document.getElementById('pageSub').textContent = `${S.client.name} · Full Coverage Timeline`;
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-secondary" onclick="renderInsurance()">← Back to Policies</button>`;

  const policies = S.policies.filter(p => p.status === 'Active' && p.start_date && p.end_date);

  const TYPE_ORDER = [
    'Death / Life',
    'Total & Permanent Disability (TPD)',
    'Terminal Illness',
    'Early Critical Illness (ECI)',
    'Late Stage Critical Illness (CI)',
    'Multi-Pay Critical Illness',
    'Cancer',
    'Hospitalization & Surgical (H&S)',
    'Disability Income',
    'Long-Term Care (LTC)',
    'Personal Accident',
    'Accidental Death & Dismemberment (AD&D)',
    'Savings / Endowment',
    'Retirement / Annuity',
    'Investment-Linked (ILP)',
    // Legacy aliases (old data still displays correctly)
    'Early Critical Illness','Late Stage Critical Illness','Standalone CI',
    'TPD','Accident','Hospitalization','Total Permanent Disability','Endowment','Savings Plan','IUL','Multi-Pay CI',
  ];
  const TYPE_COLORS = {
    'Death / Life': '#3b82f6',
    'Total & Permanent Disability (TPD)': '#0ea5e9',
    'Terminal Illness': '#64748b',
    'Early Critical Illness (ECI)': '#8b5cf6',
    'Late Stage Critical Illness (CI)': '#7c3aed',
    'Multi-Pay Critical Illness': '#a855f7',
    'Cancer': '#db2777',
    'Hospitalization & Surgical (H&S)': '#10b981',
    'Disability Income': '#14b8a6',
    'Long-Term Care (LTC)': '#06b6d4',
    'Personal Accident': '#f97316',
    'Accidental Death & Dismemberment (AD&D)': '#f59e0b',
    'Savings / Endowment': '#84cc16',
    'Retirement / Annuity': '#22c55e',
    'Investment-Linked (ILP)': '#a3e635',
    // Legacy aliases
    'Early Critical Illness': '#8b5cf6',
    'Late Stage Critical Illness': '#7c3aed',
    'Standalone CI': '#7c3aed',
    'TPD': '#0ea5e9',
    'Total Permanent Disability': '#0ea5e9',
    'Accident': '#f97316',
    'Hospitalization': '#10b981',
    'Endowment': '#84cc16',
    'Savings Plan': '#84cc16',
    'IUL': '#a3e635',
    'Multi-Pay CI': '#a855f7',
  };
  const FALLBACK_COLORS = ['#14b8a6','#f59e0b','#6366f1','#e11d48'];
  let fbIdx = 0;

  // Build per-type entry map
  const typeMap = {};
  policies.forEach(p => {
    const startAge = Math.round(clientAge + (new Date(p.start_date).getFullYear() - currentYear));
    const endAge = Math.round(clientAge + (new Date(p.end_date).getFullYear() - currentYear));
    const items = Array.isArray(p.coverage_items) && p.coverage_items.length > 0
      ? p.coverage_items
      : (p.coverage > 0 && p.type ? [{ type: p.type, coverage: p.coverage }] : []);
    items.forEach(ci => {
      if (!ci.type || !(parseFloat(ci.coverage) > 0)) return;
      if (!typeMap[ci.type]) typeMap[ci.type] = [];
      typeMap[ci.type].push({ policy: p, amount: parseFloat(ci.coverage), startAge, endAge });
    });
  });

  const typeNames = [...TYPE_ORDER.filter(t => typeMap[t]), ...Object.keys(typeMap).filter(t => !TYPE_ORDER.includes(t))];

  if (!typeNames.length) {
    document.getElementById('mainContent').innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-sub">No active policies with coverage data and dates.<br>Add start/end dates to your policies to see the Coverage Board.</div></div>`;
    return;
  }

  const agePct = age => Math.max(0, Math.min(100, ((age - MIN_AGE) / (MAX_AGE - MIN_AGE)) * 100));
  const nowPct = agePct(clientAge);

  function getMultiPayInfo(policy) {
    const flags = Array.isArray(policy.feature_flags) ? policy.feature_flags : [];
    const allText = [...flags, policy.product_type || '', policy.notes || ''].join(' ');
    const m = allText.match(/(\d+)\s*[x×]\s*[Mm]ulti|[Mm]ulti[\s-]?[Pp]ay.*?(\d+)\s*[x×]?|(\d+)\s*[x×]\s*[Pp]ay/i);
    if (m) return parseInt(m[1] || m[2] || m[3]);
    if (/multi.?pay/i.test(allText)) return 5;
    return null;
  }

  function findOverlaps(entries) {
    const segs = [];
    if (entries.length < 2) return segs;
    for (let i = 0; i < entries.length; i++) {
      for (let j = i + 1; j < entries.length; j++) {
        const a = entries[i], b = entries[j];
        const oS = Math.max(a.startAge, b.startAge);
        const oE = Math.min(a.endAge, b.endAge);
        if (oE > oS) {
          const ex = segs.find(s => s.startAge === oS && s.endAge === oE);
          if (ex) { if (!ex.entries.includes(b)) ex.entries.push(b); ex.totalAmount = ex.entries.reduce((s,e)=>s+e.amount,0); }
          else segs.push({ startAge: oS, endAge: oE, entries: [a, b], totalAmount: a.amount + b.amount });
        }
      }
    }
    return segs;
  }

  // Axis ticks
  const AXIS_AGES = [];
  for (let a = Math.ceil(MIN_AGE / 5) * 5; a <= MAX_AGE; a += 5) AXIS_AGES.push(a);
  const axisTicks = AXIS_AGES.map(a => {
    const isNow = Math.abs(a - clientAge) < 3;
    return `<div style="position:absolute;left:${agePct(a)}%;transform:translateX(-50%);font-size:9px;color:${isNow?'var(--danger)':'var(--text-3)'};font-weight:${isNow?'700':'400'}">${a}</div>`;
  }).join('');

  // Build sections
  let sectionsHTML = '';
  typeNames.forEach(typeName => {
    const entries = typeMap[typeName];
    const color = TYPE_COLORS[typeName] || (FALLBACK_COLORS[fbIdx++ % FALLBACK_COLORS.length]);
    const totalCoverage = entries.reduce((s, e) => s + e.amount, 0);
    const overlaps = findOverlaps(entries);
    const hasOverlap = overlaps.length > 0;
    const multiPayEntries = entries.filter(e => getMultiPayInfo(e.policy) !== null);
    const hasMultiPay = multiPayEntries.length > 0;

    const headerHTML = `<div class="cb-section-header">
      <div class="cb-dot" style="background:${color}"></div>
      <div class="cb-type-name">${esc(typeName)}</div>
      ${hasOverlap ? '<div class="cb-overlap-pill">⚡ OVERLAPPING</div>' : ''}
      ${hasMultiPay ? '<div class="cb-multipay-pill">✦ MULTI-PAY</div>' : ''}
      <div class="cb-type-total">${fmt(totalCoverage)}</div>
    </div>`;

    let rowsHTML = '';
    entries.forEach((entry, ei) => {
      const { policy, amount, startAge, endAge } = entry;
      const left = agePct(startAge);
      const width = Math.max(agePct(endAge) - agePct(startAge), 0.5);
      const mp = getMultiPayInfo(policy);
      const barLabel = (agePct(endAge) - agePct(startAge)) > 14 ? `${fmt(amount)} · ends ${endAge}` : (agePct(endAge) - agePct(startAge)) > 6 ? `${endAge}` : '';
      const isLifetime = !policy.end_date || policy.end_date === '';
      rowsHTML += `<div class="cb-row">
        <div class="cb-row-label" title="${esc(policy.product_name)}">${esc(policy.product_name)}</div>
        <div class="cb-track">
          <div class="cb-bar" style="left:${left}%;width:${width}%;background:${color};opacity:${Math.min(0.6 + ei*0.15,1)}" title="${esc(policy.product_name)} | ${esc(typeName)}: ${fmt(amount)} | Age ${startAge}→${endAge}">${barLabel}</div>
          <div class="cb-now-line" style="left:${nowPct}%"><div class="cb-now-label">▼ ${clientAge}</div></div>
        </div>
        <div class="cb-row-amount">${fmt(amount)}${mp ? `<br><span style="font-size:9px;color:#7c3aed;font-weight:700">up to ${fmt(amount*mp)}</span>` : ''}</div>
      </div>`;
    });

    let overlapHTML = '';
    if (hasOverlap) {
      overlaps.forEach(ov => {
        const left = agePct(ov.startAge);
        const width = Math.max(agePct(ov.endAge) - agePct(ov.startAge), 1);
        const names = ov.entries.map(e => e.policy.product_name).join(' + ');
        overlapHTML += `<div class="cb-overlap-row">
          <div class="cb-overlap-inner">
            <div style="font-size:10px;font-weight:700;color:#d97706;white-space:nowrap">⚡ Overlap</div>
            <div class="cb-overlap-track">
              <div class="cb-overlap-fill" style="left:${left}%;width:${width}%" title="${esc(names)}">
                Age ${ov.startAge}→${ov.endAge} &nbsp;·&nbsp; Combined ${fmt(ov.totalAmount)} &nbsp;·&nbsp; ${ov.entries.length} policies
              </div>
              <div class="cb-now-line" style="left:${nowPct}%"></div>
            </div>
            <div style="font-size:11px;font-weight:700;color:#d97706;text-align:right">${fmt(ov.totalAmount)}</div>
          </div>
        </div>`;
      });
    }

    let multiPayHTML = '';
    multiPayEntries.forEach(entry => {
      const mp = getMultiPayInfo(entry.policy);
      if (mp) {
        multiPayHTML += `<div class="cb-multipay-row">
          <div class="cb-multipay-inner">
            <div style="font-size:10px;font-weight:700">✦ Multi-Pay</div>
            <div>${esc(entry.policy.product_name)} &nbsp;·&nbsp; ${mp}× separate payouts of ${fmt(entry.amount)} each &nbsp;·&nbsp; Max total: <strong>${fmt(entry.amount * mp)}</strong></div>
          </div>
        </div>`;
      }
    });

    sectionsHTML += `<div class="cb-section">${headerHTML}${rowsHTML}${overlapHTML}${multiPayHTML}</div>`;
  });

  // Coverage Ladder
  function covAtAge(entries, age) {
    return entries.filter(e => e.startAge <= age && e.endAge > age).reduce((s,e)=>s+e.amount,0);
  }
  const rawLadderAges = [clientAge, 35, 40, 45, 50, 55, 60, 65];
  const ladderAges = [...new Set(rawLadderAges.filter(a => a >= clientAge && a <= MAX_AGE))].sort((a,b)=>a-b);
  const ladderHeaders = ladderAges.map(a => `<th class="${a===clientAge?'now-col':''}">Age ${a}${a===clientAge?' (Now)':''}</th>`).join('');
  const ladderRows = typeNames.map(typeName => {
    const entries = typeMap[typeName];
    const color = TYPE_COLORS[typeName] || '#6b7280';
    const cells = ladderAges.map(a => {
      const val = covAtAge(entries, a);
      return val > 0 ? `<td class="${a===clientAge?'now-col':''}">${fmt(val)}</td>` : `<td class="zero">—</td>`;
    }).join('');
    return `<tr><td><span class="cb-dot" style="background:${color};margin-right:6px"></span>${esc(typeName)}</td>${cells}</tr>`;
  }).join('');

  // Total row
  const totalCells = ladderAges.map(a => {
    const total = typeNames.reduce((s, t) => s + covAtAge(typeMap[t], a), 0);
    return total > 0 ? `<td class="${a===clientAge?'now-col':''}" style="font-weight:700;color:var(--text)">${fmt(total)}</td>` : `<td class="zero">—</td>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div style="margin-bottom:12px">
      <div class="card">
        <div class="card-body" style="padding:8px 0 4px">
          <div class="cb-axis-row">
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3)">Policy</div>
            <div style="position:relative;height:22px">
              ${axisTicks}
              <div style="position:absolute;left:${nowPct}%;top:0;bottom:0;width:2px;background:rgba(239,68,68,0.35)"></div>
            </div>
            <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);text-align:right">Amount</div>
          </div>
        </div>
      </div>
    </div>
    ${sectionsHTML}
    <div class="card" style="margin-top:8px">
      <div class="card-header">
        <div class="card-title">📊 Coverage Ladder</div>
        <div class="card-sub">Total active coverage by type at key ages</div>
      </div>
      <div class="card-body" style="overflow-x:auto;padding:0">
        <table class="cb-ladder">
          <thead><tr><th>Coverage Type</th>${ladderHeaders}</tr></thead>
          <tbody>
            ${ladderRows}
            <tr style="border-top:2px solid var(--border)"><td style="font-weight:700;color:var(--text)">TOTAL</td>${totalCells}</tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

  const cid = S.viewClientId || S.user?.id;
  document.getElementById('pageTitle').textContent = 'Insurance Policies';
  document.getElementById('pageSub').textContent = `${S.client.name} · ${S.policies.filter(p=>p.status==='Active').length} active policies`;
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-secondary btn-sm no-print" onclick="renderCoverageBoard()">📊 Coverage Board</button>
    <button class="btn btn-secondary btn-sm no-print" onclick="printClientReport('${cid}')">📄 Export PDF</button>
    <button class="btn btn-secondary btn-sm no-print" onclick="openPolicyUploadModal('${cid}')">📸 Upload Policy</button>
    <button class="btn btn-primary" onclick="openPolicyModal()">+ Add Policy</button>`;

  const activePolicies = S.policies.filter(p => p.status === 'Active');
  const totalCoverage = Object.values(getCoverageByType(activePolicies)).reduce((s, v) => s + v, 0);
  const totalPremium = S.policies.reduce((s, p) => s + (p.premium||0), 0);
  const byType = {};
  const expandedByType = getCoverageByType(S.policies);
  Object.entries(expandedByType).forEach(([type, curr]) => {
    if (!byType[type]) byType[type] = { curr: 0, rec: 0, policies: [] };
    byType[type].curr = curr;
  });
  S.policies.forEach(p => {
    // For recommended - still attach to the primary type
    const ptype = p.type || 'Other';
    if (!byType[ptype]) byType[ptype] = { curr: 0, rec: 0, policies: [] };
    byType[ptype].rec = Math.max(byType[ptype].rec, p.recommended||0);
    byType[ptype].policies.push(p);
  });
  const totalRec = Object.values(byType).reduce((s, v) => s + v.rec, 0);
  const gap = Math.max(0, totalRec - totalCoverage);
  const expiring = S.policies.filter(p => { const d = daysUntil(p.end_date); return d !== null && d >= 0 && d <= 90; });
  const clientAge = S.client.age || 30;

  document.getElementById('mainContent').innerHTML = `

      <div style="font-size:32px;margin-bottom:8px">📸</div>
      <div style="font-weight:600;color:#334155;font-size:15px">Drop policy screenshot here</div>
      <div style="color:#64748B;font-size:13px;margin-top:4px">or click to browse · Supports JPG, PNG, PDF · GPT-4o auto-extracts all policies</div>
      <input type="file" id="policyFileInput" accept="image/*,.pdf" style="display:none" onchange="handlePolicyFileSelect(event,'${cid}')">

      <div class="card"><div class="card-header"><div class="card-title">📅 Coverage Timeline</div></div><div class="card-body" style="overflow-x:auto"><div id="coverageTimeline" style="min-width:500px"></div></div></div>

  document.getElementById('policySummaryBody').innerHTML = S.policies.length ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px">

      </div>

        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Annual Premium</div>
        <div style="font-size:22px;font-weight:800;color:var(--success);margin-top:4px">${fmt(totalAnnualPremium)}<span style="font-size:12px;font-weight:500">/yr</span></div>
      </div>
      <div style="text-align:center;padding:12px;background:var(--surface-2);border-radius:var(--radius)">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Active Policies</div>
        <div style="font-size:22px;font-weight:800;color:var(--text);margin-top:4px">${activePolicies.length}</div>
      </div>
      <div style="text-align:center;padding:12px;background:var(--surface-2);border-radius:var(--radius)">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Expired / Lapsed</div>
        <div style="font-size:22px;font-weight:800;color:${expiredCount>0?'var(--danger)':'var(--text-3)'};margin-top:4px">${expiredCount}</div>
      </div>
    </div>` : '<div class="empty"><div class="empty-sub">No policies yet</div></div>';

  if (!S.policies.length) {
    document.getElementById('policyList').innerHTML = `<div class="empty"><div class="empty-icon">🛡️</div><div class="empty-title">No policies yet</div><div class="empty-sub">Add your first insurance policy</div><button class="btn btn-primary" onclick="openPolicyModal()">+ Add Policy</button></div>`;
    return;
  }
  const grouped = {};
  S.policies.forEach(p => { if (!grouped[p.type]) grouped[p.type] = []; grouped[p.type].push(p); });
  document.getElementById('policyList').innerHTML = Object.entries(grouped).map(([type, policies]) => {
    const total = policies.reduce((s, p) => s + (p.coverage||0), 0);
    const rec = Math.max(...policies.map(p => p.recommended||0));
    const gapAmt = Math.max(0, rec - total);
    const hasExpiring = policies.some(p => { const d = daysUntil(p.end_date); return d !== null && d >= 0 && d <= 90; });
    return `
      <div class="policy-group">
        <div class="policy-group-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
          <div><div class="policy-group-title">${esc(type)} ${hasExpiring ? '⚠️' : ''}</div><div style="font-size:12px;color:var(--text-3);margin-top:2px">${policies.length} ${policies.length===1?'policy':'policies'}</div></div>
          <div class="policy-group-meta">
            <div style="text-align:right"><div style="font-size:15px;font-weight:700">${fmt(total)}</div>${rec > 0 ? `<div style="font-size:11px;margin-top:2px;color:${gapAmt>0?'var(--warning)':'var(--success)'}">${gapAmt>0?`⚠ Gap: ${fmt(gapAmt)}`:'✓ Covered'}</div>` : ''}</div>
            <span style="color:var(--text-3);font-size:18px">›</span>
          </div>
        </div>
        <div class="policy-group-body">
          ${policies.map(p => {
            const exd = daysUntil(p.end_date);
            const expiringSoon = exd !== null && exd >= 0 && exd <= 90;
            return `
            <div class="policy-row" id="pr-${p.id}">
              <div class="policy-row-header">
                <div style="min-width:0;flex:1">
                  <div class="policy-row-name">${esc(p.product_name||p.type)}</div>
                  <div class="policy-row-meta">${esc(p.insurer)} · ${esc(p.product_type)}</div>
                  ${expiringSoon ? `<div style="font-size:11px;color:var(--danger);margin-top:2px;font-weight:500">⚠ Expires in ${exd} days (${fmtDate(p.end_date)})</div>` : ''}
                </div>
                <div class="policy-actions">
                  <span class="badge badge-${p.status==='Active'?'active':p.status==='Lapsed'?'lapsed':'gray'}">${esc(p.status)}</span>
                  <button class="btn btn-ghost btn-sm" onclick="openPolicyModal(${p.id})">✏️</button>
                  <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deletePolicy(${p.id})">🗑️</button>
                </div>
              </div>
              <div style="padding:12px 14px;background:var(--surface-2);border-radius:var(--radius);display:flex;flex-direction:column;gap:10px">
                ${(() => {
                  const items = Array.isArray(p.coverage_items) && p.coverage_items.length > 0 ? p.coverage_items : (p.coverage > 0 ? [{ type: p.type || 'Coverage', coverage: p.coverage }] : []);
                  const coverageHTML = items.length > 0
                    ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">Coverage Types</div><div style="display:flex;flex-wrap:wrap;gap:6px">${items.map(ci => `<div style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px"><span style="font-size:12px;color:var(--text-2)">${esc(ci.type)}</span><span style="font-size:13px;font-weight:700;color:var(--text-1)">${fmt(ci.coverage)}</span></div>`).join('')}</div><div style="margin-top:6px;font-size:12px;color:var(--text-3)">${items.length > 1 ? `Max single-event payout: <strong style="color:var(--text-1)">${fmt(p.coverage)}</strong> <span style="color:var(--text-3)">(${items.length} benefits — mutually exclusive per claim)</span>` : `Coverage: <strong style="color:var(--text-1)">${fmt(p.coverage)}</strong>`}</div></div>`
                    : '';
                  return coverageHTML;
                })()}
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px">
                  <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px">Annual Premium</div><div style="font-size:16px;font-weight:700">${fmt(p.premium)}</div><div style="font-size:11px;color:var(--text-3)">${fmt((p.premium||0)/12)}/mo · <strong>${p.payment_frequency||'annual'}</strong></div>${(p.cpf_medisave_amount||0)>0||((p.cash_amount||0)>0)?`<div style="margin-top:4px;font-size:11px;color:var(--text-3)">CPF Medisave: <strong>${fmt(p.cpf_medisave_amount||0)}</strong> · Cash: <strong>${fmt(p.cash_amount||0)}</strong></div>`:''}</div>
                  <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px">Period</div><div style="font-size:13px;font-weight:500">${fmtDate(p.start_date)}</div><div style="font-size:11px;color:var(--text-3)">→ ${fmtDate(p.end_date)}</div></div>
                  ${p.recommended > 0 ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px">Recommended</div><div style="font-size:16px;font-weight:700">${fmt(p.recommended)}</div></div>` : ''}
                </div>
              </div>
              ${p.recommended > 0 ? `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:4px"><span>Coverage vs recommended</span><span>${Math.min(100,Math.round((p.coverage||0)/(p.recommended)*100))}%</span></div><div class="progress"><div class="progress-bar" style="width:${Math.min(100,Math.round((p.coverage||0)/p.recommended*100))}%;background:${(p.coverage||0)>=p.recommended?'var(--success)':(p.coverage||0)>=p.recommended*0.6?'var(--warning)':'var(--danger)'}"></div></div></div>` : ''}
              ${p.notes ? `<div style="margin-top:10px;font-size:12px;color:var(--text-3);font-style:italic">${esc(p.notes)}</div>` : ''}
              ${coverageChecklistHTML(p)}
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
  // Load needs analysis section
  const _cid = S.viewClientId || S.user?.id;
  loadNeedsAnalysis(_cid);
}

// ── Needs Analysis Section ───────────────────────────────────────────────────
const NEEDS_COVERAGE_TYPES = ['Death / Life','Early CI','Late Stage CI','TPD','Hospital / IP','Disability Income','Personal Accident'];
const NEEDS_SOURCES = [
  { label: 'MAS Insurance', url: 'https://www.mas.gov.sg/regulation/insurance' },
  { label: 'CPF Retirement', url: 'https://www.cpf.gov.sg/member/retirement-income' },
  { label: 'MOH Cost & Financing', url: 'https://www.moh.gov.sg/cost-financing' },
  { label: 'LIA Singapore', url: 'https://www.lia.org.sg/media/' },
  { label: 'MoneySense', url: 'https://www.moneysense.gov.sg/' },
];

async function loadNeedsAnalysis(clientId) {
  try {
    const [needsData] = await Promise.all([
      api.get(`/clients/${clientId}/needs-analysis`)
    ]);
    const naMap = {};
    needsData.forEach(n => { naMap[n.coverage_type] = n; });

    // Auto-compute current coverage from policies
    const covByType = getCoverageByType(S.policies);
    const covMap = {
      'Death / Life': (covByType['Death / Life']||0) + (covByType['Term Life']||0) + (covByType['Whole Life']||0),
      'Early CI': (covByType['Early Critical Illness (ECI)']||0) + (covByType['Early Critical Illness']||0) + (covByType['Early CI']||0) + (covByType['Multi-Pay Critical Illness']||0),
      'Late Stage CI': (covByType['Late Stage Critical Illness (CI)']||0) + (covByType['Late Stage Critical Illness']||0) + (covByType['Standalone CI']||0),
      'TPD': (covByType['Total & Permanent Disability (TPD)']||0) + (covByType['TPD']||0) + (covByType['Total Permanent Disability']||0),
      'Hospital / IP': (covByType['Hospitalization & Surgical (H&S)']||0) + (covByType['Hospitalization']||0) + (covByType['Hospital / IP']||0) + (covByType['Medical']||0),
      'Disability Income': covByType['Disability Income']||0,
      'Personal Accident': (covByType['Personal Accident']||0) + (covByType['Accident']||0) + (covByType['Accidental Death & Dismemberment (AD&D)']||0),
    };

    const el = document.getElementById('needsAnalysisSection');
    if (!el) return;

    el.innerHTML = `
      <div class="alert alert-info" style="margin-bottom:16px"><div class="alert-icon">i️</div><div class="alert-body"><strong>Needs Analysis</strong>Set recommended coverage amounts, track current coverage, and document gaps with rationale. Saves automatically per coverage type.</div></div>
      <div style="display:flex;flex-direction:column;gap:12px" id="needs-rows">
        ${NEEDS_COVERAGE_TYPES.map(ct => {
          const existing = naMap[ct] || {};
          const current = covMap[ct] || (existing.current_amount || 0);
          const rec = existing.recommended_amount || 0;
          const gap = Math.max(0, rec - current);
          const priority = existing.priority || 'medium';
          const pColors = { critical: '#EF4444', high: '#F97316', medium: '#F59E0B', low: '#10B981' };
          return `
          <div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;background:var(--surface)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
              <div style="font-size:14px;font-weight:600">${esc(ct)}</div>
              <select id="na-priority-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" style="padding:4px 8px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:12px;color:${pColors[priority]}">
                <option value="critical" ${priority==='critical'?'selected':''} style="color:#EF4444">🔴 Critical</option>
                <option value="high" ${priority==='high'?'selected':''} style="color:#F97316">🟠 High</option>
                <option value="medium" ${priority==='medium'?'selected':''} style="color:#F59E0B">🟡 Medium</option>
                <option value="low" ${priority==='low'?'selected':''} style="color:#10B981">🟢 Low</option>
              </select>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">
              <div class="field" style="margin:0">
                <label>Recommended (S$)</label>
                <input type="number" id="na-rec-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" value="${rec||''}" placeholder="0" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:13px;width:100%" oninput="updateNeedsGap('${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}','${esc(ct)}')">
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">Current (from policies)</div>
                <div style="font-size:18px;font-weight:700;padding:8px 12px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border)">${fmt(current)}</div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">Gap</div>
                <div id="na-gap-display-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" style="font-size:18px;font-weight:700;padding:8px 12px;background:${gap>0?'var(--danger-light)':'var(--success-light)'};border-radius:var(--radius);border:1px solid ${gap>0?'rgba(239,68,68,0.3)':'rgba(16,185,129,0.3)'};color:${gap>0?'var(--danger)':'var(--success)'}">${gap>0?fmt(gap):'✓ Covered'}</div>
              </div>
            </div>
            <div class="field" style="margin-bottom:10px">
              <label>Rationale / Notes</label>
              <textarea id="na-rationale-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" rows="2" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;resize:vertical" placeholder="e.g. Client has 2 dependents, income replacement 10x recommended...">${esc(existing.rationale||'')}</textarea>
            </div>
            <div style="margin-bottom:12px">
              <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">📚 Reference Sources</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${NEEDS_SOURCES.map(s => `<a href="${s.url}" target="_blank" rel="noopener" style="font-size:11px;padding:3px 8px;border-radius:99px;background:var(--primary-light);color:var(--primary);text-decoration:none;border:1px solid rgba(14,165,233,0.3)">${esc(s.label)} ↗</a>`).join('')}
              </div>
            </div>
            <input type="hidden" id="na-current-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" value="${current}">
            <button class="btn btn-primary btn-sm" onclick="saveNeedsAnalysis('${clientId}','${esc(ct)}')">💾 Save ${esc(ct)}</button>
          </div>`;
        }).join('')}
      </div>`;
  } catch(e) { console.warn('Needs analysis load failed:', e); }
}

function updateNeedsGap(key, ct) {
  const recEl = document.getElementById(`na-rec-${key}`);
  const curEl = document.getElementById(`na-current-${key}`);
  const gapEl = document.getElementById(`na-gap-display-${key}`);
  if (!recEl || !curEl || !gapEl) return;
  const rec = parseFloat(recEl.value) || 0;
  const cur = parseFloat(curEl.value) || 0;
  const gap = Math.max(0, rec - cur);
  gapEl.textContent = gap > 0 ? 'S$' + gap.toLocaleString('en-SG') : '✓ Covered';
  gapEl.style.background = gap > 0 ? 'var(--danger-light)' : 'var(--success-light)';
  gapEl.style.color = gap > 0 ? 'var(--danger)' : 'var(--success)';
  gapEl.style.borderColor = gap > 0 ? 'rgba(239,68,68,0.3)' : 'rgba(16,185,129,0.3)';
}

async function saveNeedsAnalysis(clientId, ct) {
  const key = ct.replace(/ \//g,'').replace(/ /g,'-');
  const rec = parseFloat(document.getElementById(`na-rec-${key}`)?.value) || 0;
  const cur = parseFloat(document.getElementById(`na-current-${key}`)?.value) || 0;
  const gap = Math.max(0, rec - cur);
  const rationale = document.getElementById(`na-rationale-${key}`)?.value || '';
  const priority = document.getElementById(`na-priority-${key}`)?.value || 'medium';
  try {
    await api.post(`/clients/${clientId}/needs-analysis`, {
      coverage_type: ct, recommended_amount: rec, current_amount: cur,
      gap, rationale, priority, sources: NEEDS_SOURCES.map(s => s.url)
    });
    toast(`${ct} saved ✅`);
  } catch(e) { toast(e.message, 'error'); }
}

// ── Investments ────────────────────────────────────────────────────────────────
// DCA entries state: { [investmentId]: [entries] }
const _dcaCache = {};

async function loadDcaEntries(invId) {
  const cid = S.viewClientId || S.user?.id;
  try {
    const entries = await api.get(`/clients/${cid}/investments/${invId}/dca`);
    _dcaCache[invId] = entries;
  } catch(e) {
    _dcaCache[invId] = [];
  }
}

function toggleDcaHistory(invId) {
  const el = document.getElementById(`dca-history-${invId}`);
  const btn = document.getElementById(`dca-toggle-${invId}`);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  if (isHidden) {
    el.style.display = 'block';
    renderDcaHistory(invId);
    if (btn) btn.textContent = '📋 Hide History';
  } else {
    el.style.display = 'none';
    if (btn) btn.textContent = '📋 DCA History';
  }
}

function renderDcaHistory(invId) {
  const el = document.getElementById(`dca-history-${invId}`);
  if (!el) return;
  const entries = _dcaCache[invId] || [];
  
  if (!entries.length) {
    el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">No DCA entries yet. Click "+ Add DCA Entry" to start tracking.</div>`;
    return;
  }
  
  const sorted = [...entries].sort((a, b) => a.entry_date.localeCompare(b.entry_date));
  let runTotal = 0, runUnits = 0;
  
  const rows = sorted.map((e, idx) => {
    runTotal += (e.amount || 0);
    runUnits += (e.units || 0);
    const runAvg = runUnits > 0 ? runTotal / runUnits : 0;
    return `<tr>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border)">${fmtDate(e.entry_date)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;font-weight:600">${fmt(e.amount)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right">${e.units > 0 ? e.units.toFixed(4) : '—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right">${e.nav > 0 ? 'S$'+e.nav.toFixed(4) : '—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--text-3)">${runAvg > 0 ? 'S$'+runAvg.toFixed(4) : '—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;font-weight:600">${fmt(runTotal)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center">
        <button class="btn btn-ghost btn-sm" onclick="openDcaEntryModal(${invId}, ${e.id})" style="padding:3px 8px">✏️</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);padding:3px 8px" onclick="deleteDcaEntry(${invId}, ${e.id})">🗑️</button>
      </td>
    </tr>`;
  }).join('');
  
  el.innerHTML = `<div style="overflow-x:auto;margin-bottom:8px">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--surface-2)">
        <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Date</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Amount</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Units</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">NAV</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Avg Cost</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Running Total</th>
        <th style="padding:8px 10px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="background:var(--surface-2);font-weight:700">
        <td style="padding:8px 10px">Total (${entries.length} entries)</td>
        <td style="padding:8px 10px;text-align:right">${fmt(runTotal)}</td>
        <td style="padding:8px 10px;text-align:right">${runUnits > 0 ? runUnits.toFixed(4) : '—'}</td>
        <td></td>
        <td style="padding:8px 10px;text-align:right">${runUnits > 0 && runTotal > 0 ? 'S$'+(runTotal/runUnits).toFixed(4) : '—'}</td>
        <td></td><td></td>
      </tr></tfoot>
    </table>
  </div>`;
}

function openDcaEntryModal(invId, entryId) {
  const existing = entryId ? (_dcaCache[invId] || []).find(e => e.id === entryId) : null;
  const today = new Date().toISOString().split('T')[0];
  const html = `<div class="form-grid">
    <div class="field"><label>Entry Date *</label><input id="dca-date" type="date" value="${existing?.entry_date || today}"></div>
    <div class="field"><label>Amount Invested (S$)</label><input id="dca-amount" type="number" value="${existing?.amount || ''}" placeholder="500" step="0.01"></div>
    <div class="field"><label>Units Purchased</label><input id="dca-units" type="number" value="${existing?.units || ''}" placeholder="312.50" step="0.0001"></div>
    <div class="field"><label>NAV at Purchase (S$)</label><input id="dca-nav" type="number" value="${existing?.nav || ''}" placeholder="1.600" step="0.0001"></div>
    <div class="field" style="grid-column:1/-1"><label>Notes</label><input id="dca-notes" type="text" value="${esc(existing?.notes || '')}" placeholder="Jan 2024 monthly RSP"></div>
  </div>`;
  
  showModal(existing ? 'Edit DCA Entry' : 'Add DCA Entry', html, async () => {
    const body = {
      entry_date: document.getElementById('dca-date')?.value || today,
      amount: parseFloat(document.getElementById('dca-amount')?.value) || 0,
      units: parseFloat(document.getElementById('dca-units')?.value) || 0,
      nav: parseFloat(document.getElementById('dca-nav')?.value) || 0,
      notes: document.getElementById('dca-notes')?.value || '',
    };
    const cid = S.viewClientId || S.user?.id;
    try {
      if (existing) {
        await api.put(`/clients/${cid}/investments/${invId}/dca/${entryId}`, body);
        toast('Entry updated');
      } else {
        await api.post(`/clients/${cid}/investments/${invId}/dca`, body);
        toast('DCA entry added ✅');
      }
      await loadDcaEntries(invId);
      const updatedInv = await api.get(`/clients/${cid}/investments`);
      S.investments = updatedInv;
      renderDcaHistory(invId);
      closeModal();
    } catch(e) { toast(e.message, 'error'); return false; }
  });
}

async function deleteDcaEntry(invId, entryId) {
  if (!confirm('Delete this DCA entry?')) return;
  const cid = S.viewClientId || S.user?.id;
  try {
    await api.del(`/clients/${cid}/investments/${invId}/dca/${entryId}`);
    await loadDcaEntries(invId);
    const updatedInv = await api.get(`/clients/${cid}/investments`);
    S.investments = updatedInv;
    renderDcaHistory(invId);
    toast('Entry deleted');
  } catch(e) { toast(e.message, 'error'); }
}

// INVESTMENT ANALYTICS HELPERS
// ════════════════════════════════════════════════════════════════════

// CAGR: Compound Annual Growth Rate from invested → current over time
function calcInvCAGR(invested, valueNow, startDate) {
  if (!invested || !valueNow || !startDate || invested <= 0 || valueNow <= 0) return null;
  const years = Math.max(0.1, (Date.now() - new Date(startDate)) / (365.25 * 24 * 3600 * 1000));
  return ((Math.pow(valueNow / invested, 1 / years) - 1) * 100);
}

// Portfolio Health Score 0-100
// Factors: diversification (30), has DCA (20), in-gain (25), has goal (15), has dates (10)
function calcPortfolioHealth(invs) {
  if (!invs.length) return 0;
  let s = 0;
  const types = new Set(invs.map(i => i.type).filter(Boolean));
  s += Math.min(30, types.size * 10);                                           // diversification
  if (invs.some(i => i.premium_type !== 'single')) s += 20;                     // DCA discipline
  const tot = invs.reduce((a, i) => a + (i.invested || 0), 0);
  const val = invs.reduce((a, i) => a + (i.value_now || 0), 0);
  if (tot > 0) s += Math.max(0, Math.min(25, (val - tot) / tot * 80));          // in-gain bonus
  if (invs.some(i => i.target > 0)) s += 15;                                    // has goal
  if (invs.some(i => i.start_date)) s += 10;                                    // has start date
  return Math.round(Math.min(100, s));
}

// Rule of 72: years to double at given annual return %
function rule72(cagr) {
  if (!cagr || cagr <= 0) return null;
  return Math.round(72 / cagr * 10) / 10;
}

// Goal on-track check: is projected value >= target by goal_by date?
function goalOnTrack(inv) {
  if (!inv.target || !inv.goal_by || !inv.start_date) return null;
  const now = Date.now();
  const goalMs = new Date(inv.goal_by) - now;
  if (goalMs <= 0) return (inv.value_now || 0) >= inv.target ? 'achieved' : 'missed';
  const yearsLeft = goalMs / (365.25 * 24 * 3600 * 1000);
  const gr = (inv.growth_rate_assumption || 6) / 100;
  const monthly = inv.premium_type !== 'single' ? ((inv.contribution || 0) * (FREQ_PER_YEAR[inv.payment_frequency || 'monthly'] || 12) / 12) : 0;
  const projected = (inv.value_now || 0) * Math.pow(1 + gr, yearsLeft) + (monthly * 12 / gr) * (Math.pow(1 + gr, yearsLeft) - 1);
  const pct = projected / inv.target * 100;
  if (pct >= 95) return 'yes';
  if (pct >= 70) return 'close';
  return 'no';
}

    <!-- ══ Performers Strip ════════════════════════════════════════════ -->

        <div style="min-width:0">

          <div class="perf-name">${esc(worstPerformer.name)}</div>
          <div class="perf-cagr" style="color:${worstPerformer.cagr>=0?'var(--warning)':'var(--danger)'}">${fmtPct(worstPerformer.cagr)} CAGR/yr</div>

      <div class="perf-card" style="background:var(--surface-2);flex:1;min-width:180px">
        <span class="perf-icon">🏦</span>
        <div style="min-width:0">
          <div class="perf-lbl">STI Benchmark</div>

          <div class="perf-cagr" style="color:var(--warning)">${BENCHMARK}% CAGR/yr</div>

    <!-- ══ Charts ══════════════════════════════════════════════════════════ -->
    <div class="chart-grid">
      <div class="card">
        <div class="card-header">
          <div><div class="card-title">📈 Projected Growth</div><div class="card-sub">Compound projection with contributions</div></div>

              <option value="0.03">3%/yr</option><option value="0.05">5%/yr</option>
              <option value="0.06" selected>6%/yr</option><option value="0.08">8%/yr</option>
              <option value="0.10">10%/yr</option>

          </div>
        </div>

      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">🍩 Allocation</div><div class="card-sub">By investment type</div></div>
        <div class="card-body"><div class="chart-wrap"><canvas id="chartPortfolio"></canvas></div></div>
      </div>
    </div>

    <!-- ══ CAGR Comparison (shows when 2+ holdings have CAGR) ══════════ -->
    ${cagrByInv.length >= 2 ? `<div class="card" style="margin-bottom:20px">
      <div class="card-header">
        <div><div class="card-title">📊 Return vs Benchmark</div><div class="card-sub">CAGR per holding — orange line = STI 8% benchmark</div></div>
      </div>
      <div class="card-body"><div class="chart-wrap"><canvas id="chartCAGR"></canvas></div></div>
    </div>` : ''}

    <!-- ══ Inflation Comparison ══════════════════════════════════════ -->
    ${avgCAGR !== null ? `<div class="card" style="margin-bottom:20px">
      <div class="card-header"><div class="card-title">💹 Return vs Inflation</div><div class="card-sub">Portfolio return vs 3% SG CPI and 8% market benchmark</div></div>
      <div class="card-body">
        <div style="display:flex;flex-direction:column;gap:14px">
          ${[{lbl:'Your Avg CAGR',val:avgCAGR,color:avgCAGR>=BENCHMARK?'var(--success)':avgCAGR>=3?'var(--primary)':'var(--danger)'},{lbl:'STI Benchmark',val:BENCHMARK,color:'#F59E0B'},{lbl:'SG CPI Inflation',val:3,color:'#94A3B8'}].map(r => `
          <div class="inflation-row">

              <div class="inflation-bar-fill" style="width:${Math.min(100,(r.val/15)*100).toFixed(0)}%;background:${r.color}"></div>
            </div>

          </div>`).join('')}
        </div>
      </div>
    </div>` : ''}

    <div id="retirementTimeline"></div>
    <div id="investmentList"></div>
  `;

  // Retirement timeline — only show for annuity/ILP type investments
  const retirementInvs = invs.filter(i =>
    i.investment_subtype === 'Annuity' || i.investment_subtype === 'ILP' ||
    i.payout_monthly > 0 || i.type === 'Accumulation'
  );
  if (retirementInvs.length > 0) {
    const timelineEl = document.getElementById('retirementTimeline');
    if (timelineEl) timelineEl.innerHTML = renderRetirementTimeline(retirementInvs);
  }

  renderGrowthChart();

  // Allocation donut
  const byType = {};
  invs.forEach(i => { byType[i.type || 'Other'] = (byType[i.type || 'Other'] || 0) + (i.value_now || 0); });
  if (Object.keys(byType).length) {
    mkChart('chartPortfolio', {
      type: 'doughnut',
      data: { labels: Object.keys(byType), datasets: [{ data: Object.values(byType), backgroundColor: COLORS, borderWidth: 3, borderColor: '#fff', hoverOffset: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.parsed)} (${(c.parsed / (totalValue || 1) * 100).toFixed(1)}%)` } } } }
    });
  }

  // CAGR bar chart vs benchmark
  if (cagrByInv.length >= 2) {
    requestAnimationFrame(() => {
      mkChart('chartCAGR', {
        type: 'bar',
        data: {
          labels: cagrByInv.map(x => x.name.length > 20 ? x.name.slice(0, 18) + '…' : x.name),
          datasets: [
            {
              label: 'CAGR %/yr',
              data: cagrByInv.map(x => parseFloat(x.cagr.toFixed(2))),
              backgroundColor: cagrByInv.map(x => x.cagr >= BENCHMARK ? 'rgba(16,185,129,0.85)' : x.cagr >= 0 ? 'rgba(14,165,233,0.85)' : 'rgba(239,68,68,0.85)'),
              borderRadius: 8, borderSkipped: false
            },
            {
              label: 'STI Benchmark (8%)',
              data: cagrByInv.map(() => BENCHMARK),
              type: 'line',
              borderColor: '#F59E0B',
              borderWidth: 2,
              borderDash: [6, 3],
              pointRadius: 0,
              fill: false,
              tension: 0

          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
            y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => v + '%' } }

        }

  }

  if (!invs.length) {

    return;
  }

  document.getElementById('investmentList').innerHTML = invs.map(inv => renderInvestmentCard(inv)).join('');

  invs.filter(i => i.premium_type !== 'single').forEach(i => {
    loadDcaEntries(i.id);
  });
}

function renderInvestmentCard(inv) {
  const isSingle = inv.premium_type === 'single';
  const g = (inv.value_now || 0) - (inv.invested || 0);
  const gPct = inv.invested ? g / inv.invested * 100 : 0;

  // ── New KPI badges (non-breaking: fall back gracefully if data missing) ──
  const invCagr = (window._cagrByInv || {})[inv.id];
  const cagrClass = invCagr == null ? '' : invCagr >= 8 ? 'great' : invCagr >= 4 ? 'good' : invCagr >= 0 ? 'warn' : 'bad';
  const cagrBadge = invCagr != null
    ? `<span class="cagr-badge ${cagrClass}">↗ ${invCagr.toFixed(2)}% CAGR/yr</span>` : '';
  const isBest  = window._invBestId  === inv.id && invCagr != null;
  const isWorst = window._invWorstId === inv.id && invCagr != null && window._invBestId !== window._invWorstId;
  const performerBadge = isBest  ? `<span style="background:rgba(16,185,129,0.12);color:#059669;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700">🏆 Best</span>`
                       : isWorst ? `<span style="background:rgba(239,68,68,0.08);color:#DC2626;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700">📉 Lowest</span>` : '';
  const trackStatus = goalOnTrack(inv);
  const trackBadge = trackStatus && trackStatus !== 'achieved'
    ? `<span class="on-track-badge ${trackStatus === 'yes' ? 'yes' : trackStatus === 'close' ? 'close' : 'no'}">${trackStatus === 'yes' ? '✓ On Track' : trackStatus === 'close' ? '⚠ Close' : '✕ Off Track'}</span>` : '';
  const achievedBadge = trackStatus === 'achieved' ? `<span class="on-track-badge yes">🏁 Goal Achieved!</span>` : '';
  // ── End new badges ──

  if (isSingle) {
    const startDate = inv.start_date ? new Date(inv.start_date) : null;
    const termYears = inv.term_years || 0;
    const maturityDate = startDate && termYears > 0 ? new Date(startDate.getFullYear() + termYears, startDate.getMonth(), startDate.getDate()) : null;
    const now = new Date();
    const yearsElapsed = startDate ? Math.max(0, (now - startDate) / (1000 * 60 * 60 * 24 * 365.25)) : 0;
    const progressPct = termYears > 0 ? Math.min(100, (yearsElapsed / termYears) * 100) : 0;
    const yearsLeft = maturityDate ? Math.max(0, (maturityDate - now) / (1000 * 60 * 60 * 24 * 365.25)) : null;
    
    const guaranteedIRR = inv.invested > 0 && inv.guaranteed_return > 0 && termYears > 0
      ? ((Math.pow(inv.guaranteed_return / inv.invested, 1 / termYears) - 1) * 100).toFixed(2)
      : null;
    const projectedIRR = inv.invested > 0 && inv.projected_return > 0 && termYears > 0
      ? ((Math.pow(inv.projected_return / inv.invested, 1 / termYears) - 1) * 100).toFixed(2)
      : null;
    
    const maturityStr = maturityDate ? `${maturityDate.toLocaleDateString('en-SG', { month: 'short', year: 'numeric' })}` : '—';
    const yearsLeftStr = yearsLeft !== null ? (yearsLeft < 1 ? `${Math.round(yearsLeft * 12)}mo` : `${yearsLeft.toFixed(1)}yr`) : '—';
    const maturityYear = maturityDate ? maturityDate.getFullYear() : null;

    return `<div class="card" style="margin-bottom:16px">
      <div style="padding:20px 20px 16px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
              <span style="background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700">💎 SINGLE PREMIUM</span>
              <span style="background:var(--surface-2);color:var(--text-2);padding:3px 8px;border-radius:99px;font-size:11px">${esc(inv.type || '—')}</span>
              ${cagrBadge}${performerBadge}${trackBadge}${achievedBadge}
            </div>
            <div style="font-size:16px;font-weight:700;color:var(--text)">${esc(inv.name)}</div>
            <div style="font-size:12px;color:var(--text-3);margin-top:2px">${esc(inv.fund_name || inv.investment_subtype || '')}${termYears > 0 ? ` · ${termYears}-year term` : ''}${startDate ? ` · Started ${startDate.toLocaleDateString('en-SG', {month:'short',year:'numeric'})}` : ''}${maturityDate ? ` · Matures ${maturityStr}` : ''}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="openInvestmentModal(${inv.id})">✏️</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteInvestment(${inv.id})">🗑️</button>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px">
          <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:3px">Premium Paid</div><div style="font-size:18px;font-weight:700">${fmt(inv.invested)}</div></div>
          <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:3px">Current Value</div><div style="font-size:18px;font-weight:700;color:${g>=0?'var(--success)':'var(--danger)'}">${fmt(inv.value_now)}</div><div style="font-size:11px;color:${g>=0?'var(--success)':'var(--danger)'}">${g>=0?'+':''}${fmt(g)} (${fmtPct(gPct)})</div></div>
          ${inv.guaranteed_return > 0 ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:3px">Guaranteed Maturity</div><div style="font-size:18px;font-weight:700;color:var(--success)">${fmt(inv.guaranteed_return)}</div>${guaranteedIRR ? `<div style="font-size:11px;color:var(--text-3)">${guaranteedIRR}% IRR</div>` : ''}</div>` : ''}
          ${inv.projected_return > 0 ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:3px">Projected Maturity</div><div style="font-size:18px;font-weight:700;color:var(--primary)">${fmt(inv.projected_return)}</div>${projectedIRR ? `<div style="font-size:11px;color:var(--text-3)">${projectedIRR}% IRR</div>` : ''}</div>` : ''}
          ${yearsLeft !== null ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:3px">Time to Maturity</div><div style="font-size:18px;font-weight:700">${yearsLeftStr}</div>${maturityYear ? `<div style="font-size:11px;color:var(--text-3)">in ${maturityYear}</div>` : ''}</div>` : ''}
        </div>
        
        ${termYears > 0 ? `<div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:6px">
            <span>Term progress</span>
            <span style="font-weight:600">${progressPct.toFixed(0)}% · ${yearsElapsed.toFixed(1)}yr of ${termYears}yr</span>
          </div>
          <div class="progress" style="height:8px"><div class="progress-bar" style="width:${progressPct}%;background:var(--primary)"></div></div>
        </div>` : ''}
        
        ${inv.units_held > 0 ? `<div style="font-size:12px;color:var(--text-3);margin-bottom:12px">Units: <strong>${inv.units_held.toLocaleString('en-SG', {maximumFractionDigits:4})}</strong> · NAV: <strong>${inv.nav_price > 0 ? 'S$'+inv.nav_price.toFixed(4) : '—'}</strong></div>` : ''}
      </div>
      
      <div class="calc-box" style="margin:0 20px 20px">
        <div class="calc-title">📊 Projection Calculator</div>
        <div class="calc-grid">
          <div class="field" style="margin:0"><label>Principal (S$)</label><input type="number" id="cp-${inv.id}" value="${inv.value_now||0}" style="padding:8px 12px"></div>
          <div class="field" style="margin:0"><label>Rate (%/yr)</label><input type="number" id="cr-${inv.id}" value="${inv.growth_rate_assumption||4}" step="0.1" style="padding:8px 12px"></div>
          <div class="field" style="margin:0"><label>Years</label><input type="number" id="cy-${inv.id}" value="${termYears||10}" min="1" style="padding:8px 12px"></div>
          <div class="field" style="margin:0"><label>Top-up (S$/yr)</label><input type="number" id="cc-${inv.id}" value="0" style="padding:8px 12px"></div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="calcInterest(${inv.id},'simple')">Simple</button>
          <button class="btn btn-primary btn-sm" onclick="calcInterest(${inv.id},'compound')">Compound</button>
          <button class="btn btn-warning btn-sm" onclick="loadInvestmentProjection(${inv.id})">📊 FV Table</button>
        </div>
        <div class="calc-result hidden" id="cres-${inv.id}">
          <div class="calc-result-grid">
            <div><div class="calc-stat-label">Type</div><div class="calc-stat-value" id="ct-${inv.id}"></div></div>
            <div><div class="calc-stat-label">Total Contributed</div><div class="calc-stat-value" id="cti-${inv.id}"></div></div>
            <div><div class="calc-stat-label">Interest Earned</div><div class="calc-stat-value" style="color:var(--success)" id="ci-${inv.id}"></div></div>
            <div><div class="calc-stat-label">Final Value</div><div class="calc-stat-value" style="color:var(--primary)" id="cf-${inv.id}"></div></div>
          </div>
        </div>
        <div id="proj-table-${inv.id}" style="margin-top:12px"></div>
      </div>
    </div>`;
  } else {
    const freq = inv.payment_frequency || 'monthly';
    const freqLabel = FREQ_LABELS[freq] || freq;
    const freqPerYear = FREQ_PER_YEAR[freq] || 12;
    const monthlyEquiv = (inv.contribution || 0) * freqPerYear / 12;
    const avgCost = inv.units_held > 0 && inv.invested > 0 ? inv.invested / inv.units_held : null;
    const startDate = inv.start_date ? new Date(inv.start_date) : null;
    const monthsRunning = startDate ? Math.round((new Date() - startDate) / (1000 * 60 * 60 * 24 * 30.44)) : null;
    const targetPct = inv.target > 0 ? Math.min(100, (inv.value_now || 0) / inv.target * 100) : 0;
    const goalBy = inv.goal_by ? new Date(inv.goal_by) : null;
    const yearsToGoal = goalBy ? Math.max(0, (goalBy - new Date()) / (1000 * 60 * 60 * 24 * 365.25)) : null;
    
    return `<div class="card" style="margin-bottom:16px">
      <div style="padding:20px 20px 16px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px">

            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
              <span style="background:var(--success-light);color:var(--success);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700">📅 DCA</span>
              <span style="background:var(--surface-2);color:var(--text-2);padding:3px 8px;border-radius:99px;font-size:11px">${esc(inv.type || '—')}</span>
              <span style="background:var(--purple-light);color:var(--purple);padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600">${freqLabel}</span>
              ${cagrBadge}${performerBadge}${trackBadge}${achievedBadge}
            </div>
            <div style="font-size:16px;font-weight:700;color:var(--text)">${esc(inv.name)}</div>
            <div style="font-size:12px;color:var(--text-3);margin-top:2px">${esc(inv.fund_name || inv.investment_subtype || '')}${inv.contribution > 0 ? ` · ${fmt(inv.contribution)}/${freqLabel.toLowerCase()}` : ''}${startDate ? ` · since ${startDate.toLocaleDateString('en-SG', {month:'short',year:'numeric'})}` : ''}${monthsRunning !== null ? ` (${monthsRunning}mo running)` : ''}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="openInvestmentModal(${inv.id})">✏️</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteInvestment(${inv.id})">🗑️</button>
          </div>
        </div>
        
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px">

function renderGrowthChart() {
  const rate = parseFloat(document.getElementById('growthRateSelect')?.value || '0.06');
  const totalYears = parseInt(document.getElementById('growthYearsSelect')?.value || '15');
  const yr = new Date().getFullYear();
  const labels = Array.from({ length: totalYears + 1 }, (_, i) => yr + i);
  
  mkChart('chartGrowth', {
    type: 'line',
    data: { labels, datasets: S.investments.map((inv, idx) => ({
      label: inv.name,
      borderColor: COLORS[idx % COLORS.length],
      backgroundColor: COLORS[idx % COLORS.length] + '18',
      fill: false, tension: 0.4, borderWidth: 2.5, pointRadius: 3,
      data: labels.map((_, y) => {
        const r = rate;
        const p = inv.value_now || 0;
        if (inv.premium_type === 'single') {
          return Math.round(p * Math.pow(1 + r, y));
        } else {
          const freq = inv.payment_frequency || 'monthly';
          const perYear = FREQ_PER_YEAR[freq] || 12;
          const monthlyEquiv = (inv.contribution || 0) * perYear / 12;
          const monthlyR = r / 12;
          const months = y * 12;
          if (monthlyR === 0) return Math.round(p + monthlyEquiv * months);
          const pFinal = p * Math.pow(1 + monthlyR, months);
          const cFinal = monthlyEquiv * (Math.pow(1 + monthlyR, months) - 1) / monthlyR;
          return Math.round(pFinal + cFinal);
        }
      })
    })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } }
    }
  });
}

function calcInterest(id, type) {
  const p = parseFloat(document.getElementById(`cp-${id}`)?.value)||0;
  const r = (parseFloat(document.getElementById(`cr-${id}`)?.value)||0)/100;
  const y = parseFloat(document.getElementById(`cy-${id}`)?.value)||0;
  const c = parseFloat(document.getElementById(`cc-${id}`)?.value)||0;
  const contributed = p + c * y;
  let final, interest;
  if (type === 'simple') {
    interest = p*r*y + c*y*r*(y/2);
    final = contributed + interest;
  } else {
    const pFinal = p * Math.pow(1+r, y);
    const cFinal = r > 0 ? c * (Math.pow(1+r, y) - 1) / r : c * y;
    final = pFinal + cFinal;
    interest = final - contributed;
  }
  const res = document.getElementById(`cres-${id}`);
  if (!res) return;
  res.classList.remove('hidden');
  document.getElementById(`ct-${id}`).textContent = type === 'simple' ? 'Simple Interest' : 'Compound (Annual)';
  document.getElementById(`cti-${id}`).textContent = fmt(contributed);
  document.getElementById(`ci-${id}`).textContent = fmt(interest);
  document.getElementById(`cf-${id}`).textContent = fmt(final);
}

function calcDcaCompound(id, freq) {
  const p = parseFloat(document.getElementById(`cp-${id}`)?.value)||0;
  const r = (parseFloat(document.getElementById(`cr-${id}`)?.value)||0)/100;
  const y = parseFloat(document.getElementById(`cy-${id}`)?.value)||0;
  const c = parseFloat(document.getElementById(`cc-${id}`)?.value)||0;
  const perYear = FREQ_PER_YEAR[freq] || 12;
  const monthlyEquiv = c * perYear / 12;
  const monthlyR = r / 12;
  const months = y * 12;
  
  let final;
  if (monthlyR === 0) {
    final = p + monthlyEquiv * months;
  } else {
    const pFinal = p * Math.pow(1 + monthlyR, months);
    const cFinal = monthlyEquiv * (Math.pow(1 + monthlyR, months) - 1) / monthlyR;
    final = pFinal + cFinal;
  }
  const totalContributed = p + c * perYear * y;
  const interest = final - totalContributed;
  
  const res = document.getElementById(`cres-${id}`);
  if (!res) return;
  res.classList.remove('hidden');
  document.getElementById(`cti-${id}`).textContent = fmt(totalContributed);
  document.getElementById(`ci-${id}`).textContent = fmt(interest);
  document.getElementById(`cf-${id}`).textContent = fmt(final);
  document.getElementById(`ct-${id}`).textContent = fmt(monthlyEquiv) + '/mo equiv';
}

async function loadInvestmentProjection(invId) {
  const el = document.getElementById(`proj-table-${invId}`);
  if (!el) return;
  el.innerHTML = '<div style="color:var(--text-3);font-size:12px">⏳ Loading projection...</div>';
  try {
    const cid = S.viewClientId || S.user?.id;
    const data = await api.get(`/clients/${cid}/investments/${invId}/projection?rates=3,4,5,6,7,8&years=5,10,15,20,25,30`);
    const { rates, years, projection, rate_labels, investment, endowment_data } = data;
    const labelColors = { conservative: '#64748B', realistic: '#0EA5E9', optimistic: '#10B981', fixed: '#8B5CF6' };

    let html = `<div style="font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px">📊 FV Comparison Table (FV = PV×(1+r)^n + PMT×((1+r)^n-1)/r)</div>`;
    html += `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">`;
    html += `<thead><tr><th style="padding:6px 10px;text-align:left;background:var(--surface-2);border-bottom:2px solid var(--border);white-space:nowrap">Rate / Years</th>`;
    years.forEach(y => { html += `<th style="padding:6px 10px;text-align:right;background:var(--surface-2);border-bottom:2px solid var(--border)">${y}yr</th>`; });
    html += `</tr></thead><tbody>`;
    rates.forEach(rate => {
      const label = rate_labels[rate] || 'moderate';
      const color = labelColors[label] || '#0EA5E9';
      html += `<tr>`;
      html += `<td style="padding:6px 10px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border)"><span style="color:${color};font-size:11px;font-weight:700">${rate}% <span style="background:${color}20;padding:1px 5px;border-radius:99px;font-size:10px">${label}</span></span></td>`;
      years.forEach(y => {
        const val = projection[rate]?.[y] || 0;
        html += `<td style="padding:6px 10px;text-align:right;font-weight:500;border-bottom:1px solid var(--border)">S$${val.toLocaleString('en-SG')}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;

    if (endowment_data && endowment_data.maturity_date) {
      html += `<div style="margin-top:10px;padding:10px 14px;background:var(--warning-light);border-radius:var(--radius);border:1px solid rgba(245,158,11,0.3);font-size:12px">
        <strong>📋 Endowment Details</strong> · Maturity: ${endowment_data.maturity_date}
        · Guaranteed: S$${(endowment_data.guaranteed_return||0).toLocaleString()}
        · Projected: S$${(endowment_data.projected_return||0).toLocaleString()}
      </div>`;
    }

    el.innerHTML = html;
  } catch(e) { el.innerHTML = `<div style="color:var(--danger);font-size:12px">Failed to load projection: ${e.message}</div>`; }
}

// Get coverage options for a given product type
function getCoverageOptions(productType) {
  return COVERAGE_DEFS[productType] || [];
}

// Render the coverage checklist HTML for a policy row (view mode)
function coverageChecklistHTML(policy) {
  const opts = getCoverageOptions(policy.product_type);
  if (!opts.length) return '';
  // Feature flags live in localStorage; never touch coverage_items (which holds {type,coverage} amounts)
  const flags = _getFlags(policy.id);
  const checkedSet = new Set(flags);
  const total = opts.length;
  const checkedCount = opts.filter(o => checkedSet.has(o.id)).length;
  const badgeColor = checkedCount === 0 ? 'var(--text-3)' : checkedCount === total ? 'var(--success)' : 'var(--primary)';

  return `
    <div class="coverage-checklist">
      <div class="coverage-checklist-header" onclick="toggleChecklist('cl-${policy.id}')">
        <div class="coverage-checklist-title">
          🛡️ Coverage Breakdown
          <span class="coverage-checklist-badge" style="background:${checkedColor(checkedCount,total)};color:#fff">${checkedCount}/${total} covered</span>
        </div>
        <span style="color:var(--text-3);font-size:12px">▾</span>
      </div>
      <div id="cl-${policy.id}" class="coverage-checklist-body hidden">
        ${opts.map(opt => `
          <label class="coverage-item" onclick="saveCoverageItem(${policy.id}, '${opt.id}', this)">
            <input type="checkbox" ${checkedSet.has(opt.id) ? 'checked' : ''} onclick="event.stopPropagation();saveCoverageItem(${policy.id}, '${opt.id}', this.closest('.coverage-item'))">
            <span class="coverage-item-label ${checkedSet.has(opt.id) ? 'checked' : ''}">${esc(opt.label)}</span>
            <span class="coverage-item-tag" style="background:${tagColor(opt.tag)}">${opt.tag}</span>
          </label>`).join('')}
      </div>
    </div>`;
}

function checkedColor(n, total) {
  if (n === 0) return '#94A3B8';
  if (n === total) return '#10B981';
  return '#0EA5E9';
}

function tagColor(tag) {
  if (tag === 'core') return 'rgba(239,68,68,0.12)';
  if (tag === 'add-on') return 'rgba(245,158,11,0.12)';
  return 'rgba(139,92,246,0.12)';
}

function toggleChecklist(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden');
}

// Feature-flag checklist stored in localStorage (never touches coverage_items amounts)
function _featureKey(policyId) { return `pf_${policyId}`; }
function _getFlags(policyId) {
  try { return JSON.parse(localStorage.getItem(_featureKey(policyId)) || '[]'); } catch { return []; }
}
function _setFlags(policyId, flags) {
  localStorage.setItem(_featureKey(policyId), JSON.stringify(flags));
}

function saveCoverageItem(policyId, itemId, labelEl) {
  const checkbox = labelEl.querySelector('input[type=checkbox]');
  const textEl = labelEl.querySelector('.coverage-item-label');
  const isChecked = checkbox.checked;

  // Update UI instantly
  if (textEl) { if (isChecked) textEl.classList.add('checked'); else textEl.classList.remove('checked'); }

  // Persist feature flags to localStorage only — never overwrite coverage_items amounts
  let flags = _getFlags(policyId);
  if (isChecked) { if (!flags.includes(itemId)) flags.push(itemId); }
  else { flags = flags.filter(i => i !== itemId); }
  _setFlags(policyId, flags);

  // Update badge
  const policy = S.policies.find(p => p.id === policyId);
  const opts = policy ? getCoverageOptions(policy.product_type) : [];
  const checkedSet = new Set(flags);
  const n = opts.filter(o => checkedSet.has(o.id)).length;
  const badge = labelEl.closest('.coverage-checklist')?.querySelector('.coverage-checklist-badge');
  if (badge) { badge.textContent = `${n}/${opts.length} covered`; badge.style.background = checkedColor(n, opts.length); }
}

function bindCoverageChecklist() {
  document.querySelectorAll('.cov-chk').forEach(chk => {
    chk.addEventListener('change', () => {
      const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
      if (amt) {
        amt.disabled = !chk.checked;
        amt.style.background = chk.checked ? 'var(--surface-2)' : 'var(--surface-3)';
        if (!chk.checked) amt.value = '';
      }
      updateCoverageTotal();
    });
  });
  document.querySelectorAll('.cov-amt').forEach(amt => {
    amt.addEventListener('input', updateCoverageTotal);
  });
}

function updateCoverageTotal() {
  let total = 0;
  document.querySelectorAll('.cov-chk:checked').forEach(chk => {
    const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
    total += parseFloat(amt?.value) || 0;
  });
  const el = document.getElementById('coverage-total');
  if (el) el.textContent = 'S$ ' + total.toLocaleString();
}

function getCoverageItems() {
  const items = [];
  document.querySelectorAll('.cov-chk:checked').forEach(chk => {
    const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
    items.push({ type: chk.dataset.type, coverage: parseFloat(amt?.value) || 0 });
  });
  return items;
}

function bindProductAutofill() {
  const input = document.getElementById('mf-product_name');
  if (!input) return;
  const handler = () => {
    const name = input.value.trim();
    const product = SG_PRODUCT_LIBRARY.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (!product) return;
    // Auto-fill insurer
    const insurerEl = document.getElementById('mf-insurer');
    if (insurerEl) insurerEl.value = product.insurer;
    // Auto-fill product type
    const typeEl = document.getElementById('mf-product_type');
    if (typeEl) typeEl.value = product.category;
    // Auto-fill coverage checkboxes
    const covTypes = product.coverageItems.map(ci => ci.type);
    document.querySelectorAll('.cov-chk').forEach(chk => {
      const matched = covTypes.includes(chk.dataset.type);
      chk.checked = matched;
      const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
      if (amt) {
        amt.disabled = !matched;
        amt.style.background = matched ? 'var(--surface-2)' : 'var(--surface-3)';
        if (!matched) amt.value = '';
      }
    });
    updateCoverageTotal();
    // Show confirmation
    const conf = document.getElementById('product-autofill-conf');
    if (conf) { conf.style.display = 'flex'; conf.textContent = `✓ Auto-filled from ${product.insurer} product library`; }
  };
  input.addEventListener('input', handler);
  input.addEventListener('change', handler);
}

function handlePolicyDrop(event, clientId) {
  event.preventDefault();
  const zone = document.getElementById('policyUploadZone');
  zone.style.borderColor = '#CBD5E1'; zone.style.background = '#F8FAFC';
  const file = event.dataTransfer.files[0];
  if (file) processPolicyFile(file, clientId);
}

function handlePolicyFileSelect(event, clientId) {
  const file = event.target.files[0];
  if (file) processPolicyFile(file, clientId);
  event.target.value = '';
}

async function processPolicyFile(file, clientId) {
  const zone = document.getElementById('policyUploadZone');
  zone.innerHTML = `<div style="font-size:28px;margin-bottom:8px">⏳</div><div style="font-weight:600;color:#0EA5E9">Analysing with GPT-4o...</div><div style="color:#64748B;font-size:13px;margin-top:4px">Extracting policy details from your screenshot</div>`;

  try {
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';
    const result = await api.post('/prospect/parse', { image_base64: base64, media_type: mediaType });
    const policies = result.policies || [];

    if (!policies.length || policies[0]?.error) {
      zone.innerHTML = `<div style="font-size:28px;margin-bottom:8px">❌</div><div style="font-weight:600;color:#EF4444">Could not extract policies</div><div style="color:#64748B;font-size:13px;margin-top:4px">${esc(policies[0]?.reason || 'Try a clearer screenshot')}</div><button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="resetUploadZone('${clientId}')">Try Again</button>`;
      return;
    }

    showPolicyParseResults(policies, clientId, file.name);
  } catch(e) {
    zone.innerHTML = `<div style="font-size:28px;margin-bottom:8px">❌</div><div style="font-weight:600;color:#EF4444">Upload failed</div><div style="color:#64748B;font-size:13px;margin-top:4px">${esc(e.message)}</div><button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="resetUploadZone('${clientId}')">Try Again</button>`;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function resetUploadZone(clientId) {
  const zone = document.getElementById('policyUploadZone');
  if (!zone) return;
  zone.innerHTML = `
    <div style="font-size:32px;margin-bottom:8px">📸</div>
    <div style="font-weight:600;color:#334155;font-size:15px">Drop policy screenshot here</div>
    <div style="color:#64748B;font-size:13px;margin-top:4px">or click to browse · Supports JPG, PNG, PDF · GPT-4o auto-extracts all policies</div>
    <input type="file" id="policyFileInput" accept="image/*,.pdf" style="display:none" onchange="handlePolicyFileSelect(event,'${clientId}')">
  `;
  zone.onclick = () => document.getElementById('policyFileInput').click();
}

function showPolicyParseResults(policies, clientId, fileName) {
  const validPolicies = policies.filter(p => !p.error);
  const totalCoverage = validPolicies.reduce((s, p) => s + (p.sum_assured||0), 0);
  const totalPremium  = validPolicies.reduce((s, p) => s + (p.annual_premium||0), 0);

  const policyRows = validPolicies.map((p, i) => `
    <tr style="border-bottom:1px solid #F1F5F9">
      <td style="padding:10px 8px">
        <input type="checkbox" id="pol-check-${i}" checked style="margin-right:6px">
        <strong>${esc(p.product_name||'Unknown')}</strong>
      </td>
      <td style="padding:10px 8px;color:#64748B">${esc(p.insurer||'?')}</td>
      <td style="padding:10px 8px">${esc(p.sub_type||p.category||'?')}</td>
      <td style="padding:10px 8px;text-align:right">${p.sum_assured ? 'S$'+p.sum_assured.toLocaleString() : '—'}</td>
      <td style="padding:10px 8px;text-align:right">${p.annual_premium ? 'S$'+p.annual_premium.toLocaleString()+'/yr' : '—'}</td>
    </tr>
  `).join('');

  showModal(
    `📸 Extracted ${validPolicies.length} Polic${validPolicies.length===1?'y':'ies'} from ${esc(fileName)}`,
    `<div style="margin-bottom:16px">
      <div style="display:flex;gap:16px;margin-bottom:16px">
        <div style="flex:1;background:#F0FDF4;border-radius:8px;padding:12px;text-align:center"><div style="font-size:11px;color:#16A34A;font-weight:600;text-transform:uppercase">Total Coverage</div><div style="font-size:20px;font-weight:700;color:#15803D">S$${totalCoverage.toLocaleString()}</div></div>
        <div style="flex:1;background:#FFF7ED;border-radius:8px;padding:12px;text-align:center"><div style="font-size:11px;color:#EA580C;font-weight:600;text-transform:uppercase">Annual Premium</div><div style="font-size:20px;font-weight:700;color:#C2410C">S$${totalPremium.toLocaleString()}</div></div>
      </div>
      <div style="font-size:13px;color:#64748B;margin-bottom:10px">Select policies to add:</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#F8FAFC;font-size:11px;text-transform:uppercase;color:#94A3B8">
          <th style="padding:8px;text-align:left">Policy</th><th style="padding:8px;text-align:left">Insurer</th><th style="padding:8px;text-align:left">Type</th><th style="padding:8px;text-align:right">Coverage</th><th style="padding:8px;text-align:right">Premium</th>
        </tr></thead>
        <tbody>${policyRows}</tbody>
      </table>
    </div>`,
    async () => {
      const selected = validPolicies.filter((_, i) => document.getElementById(`pol-check-${i}`)?.checked);
      if (!selected.length) { toast('No policies selected', 'error'); return; }
      let added = 0;
      for (const p of selected) {
        try {
          await api.post(`/clients/${clientId}/policies`, {
            type: mapPolicyCategory(p.category, p.sub_type),
            product_name: p.product_name || 'Unknown',
            insurer: p.insurer || '',
            product_type: p.sub_type || '',
            coverage: p.sum_assured || 0,
            premium: p.annual_premium || 0,
            start_date: p.start_date || '',
            end_date: p.end_date || '',
            status: p.status || 'Active',
            notes: buildPolicyNoteStr(p),
            recommended: 0
          });
          added++;
        } catch(e) { console.error('Failed to add policy:', e); }
      }
      toast(`✅ ${added} polic${added===1?'y':'ies'} added to FinView`);
      closeModal();
      await loadClientData(clientId);
      renderInsurance(clientId, S.role === 'admin');
    },
    `Add ${validPolicies.length} Polic${validPolicies.length===1?'y':'ies'} to FinView`
  );
}

function mapPolicyCategory(category, subType) {
  const c = (category||'').toLowerCase(), s = (subType||'').toLowerCase();
  if (c.includes('ilp') || c.includes('investment')) return 'Investment';
  if (s.includes('hospital') || c.includes('hospital')) return 'Medical';
  if (c.includes('savings') || c.includes('annuity')) return 'Savings';
  return 'Life';
}

function buildPolicyNoteStr(p) {
  const parts = [];
  if (p.payment_term_years) parts.push(`Pay ${p.payment_term_years}yr`);
  if (p.policy_term_years)  parts.push(`Term ${p.policy_term_years}yr`);
  if (p.multiplier_times)   parts.push(`Multi-CI ${p.multiplier_times}x to ${p.multiplier_end_age||'?'}`);
  if (p.surrender_value)    parts.push(`SV S$${p.surrender_value.toLocaleString()}`);
  if (p.riders?.length)     parts.push(`Riders: ${p.riders.map(r=>r.name).join(', ')}`);
  return parts.join(' | ');
}

function openPolicyUploadModal(clientId) {

  setTimeout(() => {

}
