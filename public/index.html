}

// ── Modal ──────────────────────────────────────────────────────────────────────
let _modalCb = null;
function showModal(title, html, onSubmit, submitLabel = 'Save') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalSubmit').textContent = submitLabel;
  document.getElementById('modal').classList.remove('hidden');
  _modalCb = onSubmit;
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); _modalCb = null; }
document.getElementById('modalClose').onclick = document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalSubmit').onclick = async () => { if (_modalCb) { const r = await _modalCb(); if (r === false) return; } };
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function getFormData() {
  const data = {};
  document.getElementById('modalBody').querySelectorAll('[id^="mf-"]').forEach(el => { data[el.id.replace('mf-','')] = el.value; });
  return data;
}

// ── Policy Modal ───────────────────────────────────────────────────────────────
const POLICY_TYPES = ['Death / Life','Early Critical Illness','Late Stage Critical Illness','TPD','Terminal Illness','Gender Specific','Endowment','Savings Plan','IUL','Hospitalization','Accident','Disability Income'];
const INSURERS = ['Prudential','Great Eastern','AIA','Singlife','NTUC Income','Manulife','Sun Life','Other'];
const PROD_TYPES = ['Term Life','Whole Life','ILP','IUL','Early CI','Standalone CI','Multi-Pay CI','Endowment','Savings Plan','Medical','Disability Income','TPD','Rider'];

function coverageChecklistHTML(existingItems = []) {
  const itemMap = {};
  existingItems.forEach(i => { itemMap[i.type] = i.coverage; });
  return `
    <div class="field" style="grid-column:1/-1">
      <label>Coverage Types &amp; Amounts</label>
      <div id="coverage-checklist" style="border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)">
        ${POLICY_TYPES.map(t => {
          const checked = itemMap.hasOwnProperty(t);
          const val = checked ? itemMap[t] : '';
          return `<div class="coverage-check-row" style="display:grid;grid-template-columns:20px 1fr 140px;align-items:center;gap:10px">
            <input type="checkbox" class="cov-chk" data-type="${esc(t)}" id="chk-${esc(t)}" ${checked ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer;accent-color:var(--primary)">
            <label for="chk-${esc(t)}" style="font-size:13px;cursor:pointer;margin:0;color:var(--text-1)">${esc(t)}</label>
            <input type="number" class="cov-amt" data-type="${esc(t)}" placeholder="S$ amount" value="${val}" ${checked ? '' : 'disabled'} style="padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;width:100%;background:${checked ? 'var(--surface-2)' : 'var(--surface-3)'};color:var(--text-1);transition:background 0.2s">
          </div>`;
        }).join('')}
      </div>
      <div style="margin-top:6px;font-size:11px;color:var(--text-3)">Total: <strong id="coverage-total">S$ ${existingItems.reduce((s,i)=>s+(parseFloat(i.coverage)||0),0).toLocaleString()}</strong></div>
    </div>`;
}

function bindCoverageChecklist() {
  document.querySelectorAll('.cov-chk').forEach(chk => {
    chk.addEventListener('change', () => {
      const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
      if (amt) {
        amt.disabled = !chk.checked;
        amt.style.background = chk.checked ? 'var(--surface-2)' : 'var(--surface-3)';
        if (!chk.checked) amt.value = '';
      }
      updateCoverageTotal();
    });
  });
  document.querySelectorAll('.cov-amt').forEach(amt => {
    amt.addEventListener('input', updateCoverageTotal);
  });
}

function updateCoverageTotal() {
  let total = 0;
  document.querySelectorAll('.cov-chk:checked').forEach(chk => {
    const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
    total += parseFloat(amt?.value) || 0;
  });
  const el = document.getElementById('coverage-total');
  if (el) el.textContent = 'S$ ' + total.toLocaleString();
}

function getCoverageItems() {
  const items = [];
  document.querySelectorAll('.cov-chk:checked').forEach(chk => {
    const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
    items.push({ type: chk.dataset.type, coverage: parseFloat(amt?.value) || 0 });
  });
  return items;
}

function policyFormHTML(p = {}) {
  const existingItems = Array.isArray(p.coverage_items) ? p.coverage_items : [];
  return `<div class="form-grid">
    <div class="field"><label>Insurer</label><select id="mf-insurer">${INSURERS.map(i => `<option ${(p.insurer||'Prudential')===i?'selected':''}>${i}</option>`).join('')}</select></div>
    <div class="field"><label>Product Type</label><select id="mf-product_type">${PROD_TYPES.map(t => `<option ${(p.product_type||'Term Life')===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Product Name</label><input id="mf-product_name" type="text" value="${esc(p.product_name||'')}" placeholder="e.g. PRUActive Protect"></div>
    <div class="field"><label>Policy Number</label><input id="mf-policy_number" type="text" value="${esc(p.policy_number||'')}" placeholder="e.g. 12345678"></div>
    <div class="field"><label>Status</label><select id="mf-status"><option ${(p.status||'Active')==='Active'?'selected':''}>Active</option><option ${p.status==='Lapsed'?'selected':''}>Lapsed</option><option ${p.status==='Cancelled'?'selected':''}>Cancelled</option><option ${p.status==='Pending'?'selected':''}>Pending</option></select></div>
    <div class="field"><label>Annual Premium (S$)</label><input id="mf-premium" type="number" value="${p.premium||''}" placeholder="3600"></div>
    <div class="field"><label>Recommended Total Coverage</label><input id="mf-recommended" type="number" value="${p.recommended||''}" placeholder="0"></div>
    <div class="field"><label>Start Date</label><input id="mf-start_date" type="date" value="${p.start_date||''}"></div>
    <div class="field"><label>End Date</label><input id="mf-end_date" type="date" value="${p.end_date||''}"></div>
    ${coverageChecklistHTML(existingItems)}
    <div class="field" style="grid-column:1/-1"><label>Notes</label><textarea id="mf-notes" rows="2" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;resize:vertical">${esc(p.notes||'')}</textarea></div>
  </div>`;
}

async function openPolicyModal(id) {
  const existing = id ? S.policies.find(p => p.id === id) : null;
  showModal(existing ? 'Edit Policy' : 'Add Policy', policyFormHTML(existing||{}), async () => {
    const d = getFormData();
    const coverageItems = getCoverageItems();
    if (coverageItems.length === 0) { toast('Select at least one coverage type', 'error'); return false; }
    const body = { product_name: d.product_name, policy_number: d.policy_number, insurer: d.insurer, product_type: d.product_type, coverage_items: coverageItems, premium: parseFloat(d.premium)||0, recommended: parseFloat(d.recommended)||0, status: d.status, start_date: d.start_date, end_date: d.end_date, notes: d.notes };
    const cid = S.viewClientId || S.user?.id;
    try {
      if (existing) { const u = await api.put(`/clients/${cid}/policies/${id}`, body); S.policies = S.policies.map(p => p.id===id?u:p); toast('Policy updated'); }
      else { const n = await api.post(`/clients/${cid}/policies`, body); S.policies.push(n); toast('Policy added ✅'); }
      closeModal(); renderInsurance(cid);
    } catch (e) { toast(e.message, 'error'); }
  });
  // Bind checklist interactivity after modal renders
  requestAnimationFrame(() => bindCoverageChecklist());
}

async function deletePolicy(id) {
  if (!confirm('Delete this policy?')) return;
  const cid = S.viewClientId || S.user?.id;
  try { await api.del(`/clients/${cid}/policies/${id}`); S.policies = S.policies.filter(p => p.id!==id); toast('Policy deleted'); renderInsurance(cid); }
  catch (e) { toast(e.message, 'error'); }
}

const INV_TYPES = ['ILP','IUL','SRS','CPF-SA','CPF-OA','Stocks','ETF','Bonds','REITs','Fixed Deposit','Crypto','Other'];

function invFormHTML(i = {}) {
  return `<div class="form-grid">
    <div class="field"><label>Investment Name *</label><input id="mf-name" type="text" value="${esc(i.name||'')}" placeholder="PRULink Growth Fund" required></div>
    <div class="field"><label>Type</label><select id="mf-type">${INV_TYPES.map(t => `<option ${(i.type||'ILP')===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Amount Invested (S$)</label><input id="mf-invested" type="number" value="${i.invested||''}" placeholder="20000"></div>
    <div class="field"><label>Current Value (S$)</label><input id="mf-value_now" type="number" value="${i.value_now||''}" placeholder="24000"></div>
    <div class="field"><label>Target Goal (S$)</label><input id="mf-target" type="number" value="${i.target||''}" placeholder="100000"></div>
    <div class="field"><label>Goal Date</label><input id="mf-goal_by" type="date" value="${i.goal_by||''}"></div>
    <div class="field"><label>Monthly Contribution (S$)</label><input id="mf-contribution" type="number" value="${i.contribution||0}" placeholder="500"></div>
  </div>`;
}

async function openInvestmentModal(id) {
  const existing = id ? S.investments.find(i => i.id===id) : null;
  showModal(existing ? 'Edit Investment' : 'Add Investment', invFormHTML(existing||{}), async () => {
    const d = getFormData();
    const body = { name: d.name, type: d.type, invested: parseFloat(d.invested)||0, value_now: parseFloat(d.value_now)||0, target: parseFloat(d.target)||0, goal_by: d.goal_by, contribution: parseFloat(d.contribution)||0 };
    const cid = S.viewClientId || S.user?.id;
    try {
      if (existing) { const u = await api.put(`/clients/${cid}/investments/${id}`, body); S.investments = S.investments.map(i => i.id===id?u:i); toast('Investment updated'); }
      else { const n = await api.post(`/clients/${cid}/investments`, body); S.investments.push(n); toast('Investment added ✅'); }
      closeModal(); renderInvestments(cid);
    } catch (e) { toast(e.message, 'error'); }
  });
}

async function deleteInvestment(id) {
  if (!confirm('Delete this investment?')) return;
  const cid = S.viewClientId || S.user?.id;
  try { await api.del(`/clients/${cid}/investments/${id}`); S.investments = S.investments.filter(i => i.id!==id); toast('Investment deleted'); renderInvestments(cid); }
  catch (e) { toast(e.message, 'error'); }
}
