<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinView Dashboard</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0EA5E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinView">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<!-- StringTune removed permanently -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F1F5F9;--surface:#FFFFFF;--surface-2:#F8FAFC;--border:#E2E8F0;--border-2:#CBD5E1;
  --sidebar-bg:#0F172A;--sidebar-hover:rgba(255,255,255,0.07);--sidebar-active:rgba(14,165,233,0.18);
  --sidebar-text:rgba(255,255,255,0.55);--sidebar-text-active:#FFFFFF;
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --primary:#0EA5E9;--primary-dark:#0284C7;--primary-light:rgba(14,165,233,0.1);
  --success:#10B981;--success-light:rgba(16,185,129,0.1);
  --warning:#F59E0B;--warning-light:rgba(245,158,11,0.1);
  --danger:#EF4444;--danger-light:rgba(239,68,68,0.1);
  --purple:#8B5CF6;--purple-light:rgba(139,92,246,0.1);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 1px 3px rgba(0,0,0,0.05),0 4px 12px rgba(0,0,0,0.06);
  --shadow-md:0 4px 6px rgba(0,0,0,0.04),0 10px 30px rgba(0,0,0,0.08);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.14);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --sidebar-width:240px;--transition:150ms cubic-bezier(0.16,1,0.3,1);
  /* Premium glassmorphism variables */
  --glass-bg:rgba(255,255,255,0.72);
  --glass-border:rgba(255,255,255,0.5);
  --glass-shadow:0 8px 32px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
  --glass-shadow-hover:0 16px 48px rgba(14,165,233,0.12), 0 2px 4px rgba(0,0,0,0.06);
  --primary-glow:rgba(14,165,233,0.15);
  --secondary:#6366F1;
  --secondary-glow:rgba(99,102,241,0.15);
}
html,body{height:100%;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;font-size:14px;color:var(--text);background-color:#EEF2FF;background-image:radial-gradient(ellipse at 15% 15%, rgba(14,165,233,0.10) 0%, transparent 55%),radial-gradient(ellipse at 85% 10%, rgba(99,102,241,0.09) 0%, transparent 55%),radial-gradient(ellipse at 50% 85%, rgba(16,185,129,0.06) 0%, transparent 50%);background-attachment:fixed;-webkit-font-smoothing:antialiased}

/* ── Login ── */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A 0%,#1E293B 60%,#0F172A 100%)}
.login-page::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(14,165,233,0.18),transparent);pointer-events:none}
.login-card{background:var(--surface);border-radius:var(--radius-xl);padding:44px 40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);position:relative}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.login-logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),#6366F1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.login-logo-name{font-size:18px;font-weight:700;color:var(--text)}
.login-logo-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:14px;color:var(--text-2);margin-bottom:28px}
.login-error{background:var(--danger-light);border:1px solid rgba(239,68,68,0.25);color:var(--danger);font-size:13px;padding:10px 14px;border-radius:var(--radius);margin-bottom:16px}
.invite-banner{background:var(--primary-light);border:1px solid rgba(14,165,233,0.3);color:#0C4A6E;font-size:13px;padding:12px 14px;border-radius:var(--radius);margin-bottom:20px;text-align:center}
.invite-banner strong{display:block;margin-bottom:4px;font-size:15px}

/* ── Forms ── */
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.field input,.field select,.field textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:inherit;color:var(--text);background:var(--surface);transition:border-color var(--transition),box-shadow var(--transition);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,0.12)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all var(--transition);white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#0EA5E9,#6366F1);border:none;box-shadow:0 4px 16px rgba(14,165,233,0.35);font-weight:600;letter-spacing:-0.01em;color:#fff}.btn-primary:hover{box-shadow:0 6px 24px rgba(14,165,233,0.45);transform:translateY(-1px);background:linear-gradient(135deg,#0284C7,#4F46E5)}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}.btn-secondary:hover{background:var(--surface-2);border-color:var(--border-2)}
.btn-ghost{background:transparent;color:var(--text-2);border:none;padding:7px 10px}.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid rgba(239,68,68,0.2)}.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success-light);color:var(--success);border:1px solid rgba(16,185,129,0.2)}.btn-success:hover{background:var(--success);color:#fff}
.btn-warning{background:var(--warning-light);color:var(--warning);border:1px solid rgba(245,158,11,0.2)}.btn-warning:hover{background:var(--warning);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}.btn-full{width:100%}.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-icon{width:32px;height:32px;padding:0;border-radius:var(--radius)}

/* ── Layout ── */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-width);background:linear-gradient(180deg,#0F172A 0%,#1E1B4B 100%);box-shadow:4px 0 24px rgba(0,0,0,0.18);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:50}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.06)}
.sidebar-logo{display:flex;align-items:center;gap:10px}
.sidebar-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),#6366F1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sidebar-logo-text{font-size:14px;font-weight:700;color:#fff}
.sidebar-logo-sub{font-size:11px;color:var(--sidebar-text)}
.sidebar-client{padding:12px;margin:10px 8px;background:rgba(255,255,255,0.05);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.08)}
.sidebar-client-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-client-role{font-size:11px;color:var(--sidebar-text)}
.sidebar-nav{flex:1;padding:8px;overflow-y:auto}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:rgba(255,255,255,0.28);padding:12px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--sidebar-text);cursor:pointer;transition:all var(--transition);margin-bottom:1px;font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(14,165,233,0.25),rgba(99,102,241,0.25));color:#fff;font-weight:600}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center}
.sidebar-footer{padding:10px 8px;border-top:1px solid rgba(255,255,255,0.06)}

/* ── Main ── */
.main{margin-left:var(--sidebar-width);flex:1;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;gap:12px;flex-wrap:nowrap}
.topbar-left{display:flex;flex-direction:column;min-width:0}
.page-title{font-size:17px;font-weight:700;color:var(--text);white-space:nowrap}
.page-sub{font-size:12px;color:var(--text-3);margin-top:1px}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.content{padding:28px;flex:1}

/* ── Print ── */
@media print {
  .sidebar,.topbar,.topbar-actions,.btn,.modal-overlay,.toast-container{display:none!important}
  .main{margin-left:0!important}
  .content{padding:0!important}
  body{background:#fff!important}
  .card{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid;margin-bottom:16px}
  .print-header{display:block!important}
  .no-print{display:none!important}
}
.print-header{display:none;padding:16px 0 24px;border-bottom:2px solid var(--border);margin-bottom:24px}
.print-header h1{font-size:20px;font-weight:700}
.print-header p{font-size:12px;color:var(--text-2);margin-top:4px}

/* ── Metric cards ── */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.metric{background:var(--surface);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);position:relative;overflow:hidden}
.metric-accent{position:absolute;top:0;left:0;right:0;height:3px}
.metric-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-3);margin-bottom:8px}
.metric-value{font-size:22px;font-weight:700;color:var(--text);line-height:1}
.metric-change{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;margin-top:6px;padding:2px 7px;border-radius:99px}
.metric-change.up{background:var(--success-light);color:var(--success)}
.metric-change.down{background:var(--danger-light);color:var(--danger)}
.metric-change.neutral{background:var(--surface-2);color:var(--text-3)}
.metric-change.warn{background:var(--warning-light);color:var(--warning)}

/* ── Cards ── */
.card{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);border-radius:16px;overflow:hidden;transition:box-shadow 0.25s ease,transform 0.2s ease}
.card:hover{box-shadow:var(--glass-shadow-hover);transform:translateY(-2px)}
/* UX animations — transform only, NO opacity changes */
@keyframes fv-card-rise { from { transform:translateY(8px); } to { transform:translateY(0); } }
.card { animation: fv-card-rise 0.3s cubic-bezier(0.16,1,0.3,1); }
.admin-stat-card { animation: fv-card-rise 0.28s cubic-bezier(0.16,1,0.3,1); }
/* Stat card pop animation */
.admin-stat-card{transition:box-shadow 0.2s,transform 0.2s cubic-bezier(0.16,1,0.3,1)}
.admin-stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px) scale(1.02)}
/* Button states */
.btn-primary:active{opacity:0.85}
/* Number value flash on update */
.stat-value-updated{animation:fv-flash 0.5s ease}
@keyframes fv-flash{0%{color:var(--primary)}100%{color:var(--text)}}
/* Sidebar nav item hover */
.nav-item{transition:background 0.15s,padding-left 0.15s}
.nav-item:hover{padding-left:18px}
/* Page fade-in */
.page-view{animation:page-in 0.3s cubic-bezier(0.16,1,0.3,1) both}
@keyframes page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Premium UI Enhancements ── */
/* Pulse status dots */
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}
@keyframes pulse-amber{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.5)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.status-dot.active{background:#10B981;animation:pulse-green 2s infinite}
.status-dot.expiring{background:#F59E0B;animation:pulse-amber 2s infinite}
.status-dot.lapsed{background:#EF4444}
/* Metric value animation */
@keyframes metricIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.metric-value{font-variant-numeric:tabular-nums;animation:metricIn 0.5s ease forwards}
/* Skeleton loader */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{background:linear-gradient(90deg,#F1F5F9 25%,#E2E8F0 50%,#F1F5F9 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
/* Modal slide-up */
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-box{animation:modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1)}
/* Premium progress bar */
.progress-bar{background:linear-gradient(90deg,#0EA5E9,#6366F1) !important}
/* Admin stat card gradient top */
.admin-stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0EA5E9,#6366F1);border-radius:12px 12px 0 0}
.admin-stat-card{position:relative;overflow:hidden}
/* Mobile bottom tab bar */
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0!important}
  .bottom-tabs{display:flex!important}
  .content{padding-bottom:80px!important}
}
.bottom-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);z-index:50;padding:8px 0 env(safe-area-inset-bottom)}
.bottom-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:none;cursor:pointer;font-size:10px;font-weight:500;color:var(--text-3);font-family:inherit}
.bottom-tab.active{color:var(--primary)}
.bottom-tab-icon{font-size:20px}
/* Dark mode */
@media(prefers-color-scheme:dark){
  :root{--bg:#0F172A;--surface:#1E293B;--surface-2:#263348;--border:rgba(255,255,255,0.08);--text:#F1F5F9;--text-2:#94A3B8;--text-3:#64748B}
  body{background-color:#0F172A;background-image:radial-gradient(ellipse at 15% 15%,rgba(14,165,233,0.08) 0%,transparent 55%),radial-gradient(ellipse at 85% 10%,rgba(99,102,241,0.08) 0%,transparent 55%)}
  .card{background:rgba(30,41,59,0.85);border-color:rgba(255,255,255,0.08)}
  .login-card,.modal-box{background:#1E293B}
}

.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:14px;font-weight:600;color:var(--text)}
.card-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.card-body{padding:20px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:24px}
.chart-wrap{height:240px;position:relative}

/* ── Alerts ── */
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--radius);margin-bottom:10px;font-size:13px}
.alert-warning{background:var(--warning-light);border:1px solid rgba(245,158,11,0.25);color:#92400E}
.alert-danger{background:var(--danger-light);border:1px solid rgba(239,68,68,0.25);color:#991B1B}
.alert-success{background:var(--success-light);border:1px solid rgba(16,185,129,0.25);color:#065F46}
.alert-info{background:var(--primary-light);border:1px solid rgba(14,165,233,0.25);color:#0C4A6E}
.alert-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.alert-body strong{display:block;margin-bottom:2px;font-weight:600}

/* ── Coverage gauge ── */
.coverage-row{display:grid;grid-template-columns:160px 1fr 44px;align-items:center;gap:12px;margin-bottom:10px}
.coverage-label{font-size:12px;color:var(--text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coverage-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.coverage-fill{height:100%;border-radius:99px;transition:width 0.6s ease}
.coverage-pct{font-size:12px;font-weight:600;text-align:right}

/* ── Gap cards ── */
.gap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px}
.gap-card{border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;background:var(--surface)}
.gap-card.level1{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.03)}
.gap-card.level2{border-color:rgba(249,115,22,0.5);background:rgba(249,115,22,0.03)}
.gap-card.level3{border-color:rgba(245,158,11,0.5);background:rgba(245,158,11,0.03)}
.gap-card.level4{border-color:rgba(14,165,233,0.5);background:rgba(14,165,233,0.03)}
.gap-card.level5{border-color:rgba(16,185,129,0.5);background:rgba(16,185,129,0.03)}
.gap-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-bottom:8px}
.gap-status.level1{background:rgba(239,68,68,0.12);color:#DC2626}
.gap-status.level2{background:rgba(249,115,22,0.12);color:#EA580C}
.gap-status.level3{background:rgba(245,158,11,0.12);color:#D97706}
.gap-status.level4{background:rgba(14,165,233,0.12);color:#0284C7}
.gap-status.level5{background:rgba(16,185,129,0.12);color:#059669}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-active{background:var(--success-light);color:var(--success)}
.badge-lapsed{background:var(--danger-light);color:var(--danger)}
.badge-pending{background:var(--warning-light);color:var(--warning)}
.badge-gray{background:var(--surface-2);color:var(--text-3)}
.badge-admin{background:linear-gradient(135deg,var(--primary),#6366F1);color:#fff}

/* ── Policy accordion ── */
.policy-group{border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
.policy-group-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;background:var(--surface);user-select:none;gap:8px}
.policy-group-header:hover{background:var(--surface-2)}
.policy-group-title{font-size:14px;font-weight:600;color:var(--text)}
.policy-group-meta{display:flex;align-items:center;gap:16px;flex-shrink:0}
.policy-group-body{border-top:1px solid var(--border)}
.policy-group-body.hidden{display:none}
.policy-row{padding:16px 18px;border-bottom:1px solid var(--border)}
.policy-row:last-child{border-bottom:none}
.policy-row-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.policy-row-name{font-size:14px;font-weight:600;color:var(--text)}
.policy-row-meta{font-size:12px;color:var(--text-3);margin-top:3px}
.policy-number{font-size:11px;color:var(--primary);font-weight:500;margin-top:2px}
.policy-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* ── Timeline ── */
.timeline-row{margin-bottom:20px}
.timeline-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.timeline-label{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.timeline-dates{font-size:11px;color:var(--text-3);flex-shrink:0}
.timeline-track{height:28px;background:var(--surface-2);border-radius:var(--radius);overflow:hidden;position:relative;border:1px solid var(--border)}
.timeline-fill{position:absolute;top:0;bottom:0;border-radius:var(--radius);display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.95);overflow:hidden;white-space:nowrap;min-width:4px}
.timeline-now{position:absolute;top:0;bottom:0;width:2px;background:rgba(239,68,68,0.7)}
.timeline-ages{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-top:4px}

/* ── Investment calc ── */
.calc-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-top:12px}
.calc-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:12px}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.calc-result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:10px}
.calc-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.calc-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:3px}
.calc-stat-value{font-size:15px;font-weight:700;color:var(--text)}

/* ── Progress ── */
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress-bar{height:100%;border-radius:99px;transition:width 0.5s ease}

/* ── Table ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);padding:10px 14px;border-bottom:2px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-2)}

/* ── Admin client table ── */
.client-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--transition)}
.client-row:last-child{border-bottom:none}
.client-row:hover{background:var(--surface-2)}
.client-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#6366F1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.client-info{flex:1;min-width:0}
.client-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-meta{font-size:12px;color:var(--text-3);margin-top:2px}
.client-stats{display:flex;gap:20px;flex-shrink:0}
.client-stat{text-align:right}
.client-stat-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px}
.client-stat-value{font-size:13px;font-weight:600;color:var(--text);margin-top:1px}

/* ── Stat overview (admin) ── */
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.admin-stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);text-align:center}
.admin-stat-icon{font-size:28px;margin-bottom:8px}
.admin-stat-value{font-size:26px;font-weight:700;color:var(--text)}
.admin-stat-label{font-size:12px;color:var(--text-3);margin-top:4px}

/* ── Expiry alert list ── */
.expiry-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.expiry-row:last-child{border-bottom:none}
.expiry-days{width:54px;text-align:center;flex-shrink:0}
.expiry-days-num{font-size:20px;font-weight:800;line-height:1}
.expiry-days-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3)}

/* ── Invite box ── */
.invite-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-top:16px}
.invite-link-wrap{display:flex;gap:8px;align-items:center;margin-top:10px}
.invite-link-input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:12px;font-family:monospace;background:var(--surface);color:var(--text-2);overflow:hidden;text-overflow:ellipsis}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--surface);border-radius:var(--radius-xl);width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-3);line-height:1;padding:4px;border-radius:var(--radius)}
.modal-close:hover{color:var(--text);background:var(--surface-2)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ── Empty ── */
.empty{text-align:center;padding:48px 24px;color:var(--text-3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.empty-sub{font-size:13px;margin-bottom:16px}

/* ── Search ── */
.search-wrap{position:relative}
.search-wrap input{padding-left:34px;background:var(--surface-2)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none}

/* ── Toast ── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:slideUp 0.25s ease;max-width:320px}
.toast.success{background:#065F46;border:1px solid var(--success)}
.toast.error{background:#7F1D1D;border:1px solid var(--danger)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Misc ── */
.divider{height:1px;background:var(--border);margin:20px 0}
.section-title{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.hidden{display:none!important}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;background:var(--surface-2);color:var(--text-2)}

/* ── Tabs ── */
.tab-bar{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:var(--radius-lg);margin-bottom:20px;width:fit-content}
.tab-btn{padding:6px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;border:none;background:transparent;color:var(--text-2);cursor:pointer;transition:all var(--transition)}
.tab-btn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-sm)}

/* ── Coverage Checklist ── */
.coverage-checklist{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.coverage-checklist-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surface-2);cursor:pointer;user-select:none;gap:8px}
.coverage-checklist-header:hover{background:var(--border)}
.coverage-checklist-title{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.coverage-checklist-badge{background:var(--primary-light);color:var(--primary);font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.coverage-checklist-body{padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px}
.coverage-checklist-body.hidden{display:none}
.coverage-item{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 6px;border-radius:6px;transition:background var(--transition)}
.coverage-item:hover{background:var(--surface-2)}
.coverage-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.coverage-item-label{font-size:12px;color:var(--text-2);line-height:1.3}
.coverage-item-label.checked{color:var(--text);font-weight:500}
.coverage-item-tag{font-size:10px;color:var(--text-3);margin-left:auto;flex-shrink:0;background:var(--surface-2);padding:1px 5px;border-radius:99px}

/* ── Sidebar Collapsible ── */
.sidebar{transition:width 200ms cubic-bezier(0.16,1,0.3,1)}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .sidebar-logo-text,.sidebar.collapsed .sidebar-logo-sub{display:none}
.sidebar.collapsed .sidebar-client{display:none}
.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-badge{display:none!important}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;gap:0}
.sidebar.collapsed .nav-item>span:not(.nav-icon){display:none}
.sidebar.collapsed~.main{margin-left:64px}
.main{transition:margin-left 200ms cubic-bezier(0.16,1,0.3,1)}
.sidebar-header{position:relative}
.sidebar-toggle-btn{position:absolute;right:-12px;top:18px;width:24px;height:24px;background:var(--surface);border:1.5px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;z-index:60;box-shadow:var(--shadow-sm);color:var(--text-2);font-weight:700}
.sidebar-toggle-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Settings Drawer ── */
#settingsDrawer{overflow:hidden;max-height:300px;transition:max-height 0.25s ease}
#settingsDrawer.collapsed{max-height:0}
.nav-label-toggle{cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.nav-label-toggle:hover{color:rgba(255,255,255,0.7)!important}

/* ── Quick Action Bar ── */
.quick-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 28px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.quick-bar-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.6px;white-space:nowrap}

/* ── Alerts tabs ── */
.alerts-tab-content{display:none}
.alerts-tab-content.active{display:block}

/* ── Command Center widgets ── */
.cc-widget-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.cc-widget{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all var(--transition)}
.cc-widget:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.cc-widget-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-3);margin-bottom:8px}
.cc-widget-value{font-size:22px;font-weight:800;color:var(--text)}
.cc-widget-sub{font-size:11px;color:var(--text-3);margin-top:4px}
/* ── Policy Card (v10 redesign) ── */
.policy-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s,transform 0.2s cubic-bezier(0.16,1,0.3,1)}
.policy-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.policy-card-accent{height:4px;width:100%}
.policy-card-content{padding:18px 20px}
.policy-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.policy-card-name{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.policy-card-meta{font-size:12px;color:var(--text-3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.policy-insurer-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.policy-num{font-family:monospace;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--text-2)}
.policy-expiry-warn{font-size:11px;color:var(--danger);font-weight:500;margin-top:4px}
.policy-card-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.policy-status-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.policy-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.policy-stat{background:var(--surface-2);padding:12px 14px}
.policy-stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px}
.policy-stat-value{font-size:16px;font-weight:700;color:var(--text);line-height:1.2}
.policy-stat-unit{font-size:11px;font-weight:400;color:var(--text-3)}
.policy-stat-sub{font-size:11px;color:var(--text-3);margin-top:3px}
.policy-coverage-chips{margin-bottom:12px}
.policy-coverage-chips-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:8px}
.policy-chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.policy-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;transition:border-color 0.15s}
.policy-chip:hover{border-color:var(--primary)}
.policy-chip-type{font-size:12px;color:var(--text-2)}
.policy-chip-amount{font-size:13px;font-weight:700;color:var(--text)}
.policy-coverage-bar-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
.policy-coverage-bar-track{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.policy-coverage-bar-fill{height:100%;border-radius:99px;transition:width 0.6s ease}
.policy-coverage-bar-pct{font-size:11px;font-weight:600;color:var(--text-3);white-space:nowrap}
.policy-notes{font-size:12px;color:var(--text-3);font-style:italic;margin-bottom:10px;padding:8px 12px;background:var(--surface-2);border-radius:var(--radius);border-left:3px solid var(--border-2)}
/* Feature flags checklist */
.fl-section{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:2px}
.fl-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface-2);cursor:pointer;user-select:none;transition:background var(--transition)}
.fl-header:hover{background:var(--border)}
.fl-header-left{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-2)}
.fl-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;color:#fff}
.fl-save-status{font-size:10px;font-weight:500;padding:2px 8px;border-radius:99px;margin-left:auto;margin-right:8px;transition:all 0.2s}
.fl-save-saving{background:rgba(245,158,11,0.15);color:var(--warning)}
.fl-save-ok{background:rgba(16,185,129,0.15);color:var(--success)}
.fl-save-err{background:rgba(239,68,68,0.15);color:var(--danger)}
.fl-body{padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:5px 14px}
.fl-body.hidden{display:none}
.fl-item{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 7px;border-radius:6px;transition:background var(--transition)}
.fl-item:hover{background:var(--surface-2)}
.fl-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.fl-item-label{font-size:12px;color:var(--text-2);line-height:1.3;transition:color 0.15s,font-weight 0.15s}
.fl-item-label.checked{color:var(--text);font-weight:500}
.fl-item-tag{font-size:10px;margin-left:auto;flex-shrink:0;padding:1px 5px;border-radius:99px}
.fl-item-tag.core{background:rgba(239,68,68,0.1);color:#DC2626}
.fl-item-tag.add-on{background:rgba(245,158,11,0.1);color:#D97706}
.fl-item-tag.optional{background:rgba(139,92,246,0.1);color:#7C3AED}
/* Chart improvements */
.chart-wrap{height:260px;position:relative}
.chart-wrap-tall{height:300px;position:relative}
</style>
</head>
<body>
<!-- Disclaimer -->
<div style="display:none" id="app-disclaimer">For illustration purposes only. Not financial advice. Always conduct your own review.</div>


<!-- ══ LOGIN ═══════════════════════════════════════════════════════ -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">💎</div>
      <div><div class="login-logo-name">FinView</div><div class="login-logo-sub">by Prudential · Dylan Ho</div></div>
    </div>
    <div id="inviteBanner" class="invite-banner hidden"></div>
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to your financial dashboard</div>
    <div id="loginError" class="login-error hidden"></div>
    <div class="field"><label>Username</label><input type="text" id="loginUser" placeholder="Enter username" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-full" id="loginBtn" style="margin-top:8px;padding:12px">Sign In →</button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════════ -->
<div id="appRoot" class="app hidden">
  <aside class="sidebar" id="mainSidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">💎</div>
        <div><div class="sidebar-logo-text">FinView</div><div class="sidebar-logo-sub">Financial Dashboard</div></div>
      </div>
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" title="Collapse sidebar">←</button>
    </div>
    <div id="sidebarClientBox" class="sidebar-client">
      <div class="sidebar-client-name" id="sidebarName">-</div>
      <div class="sidebar-client-role" id="sidebarRole">Client</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()" style="width:100%;color:rgba(255,255,255,0.45)">
        <span class="nav-icon">🚪</span> Sign Out
      </button>
      <div style="padding:4px 10px;font-size:10px;color:rgba(255,255,255,0.2);text-align:center">FinView v11 · Jun 2026</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div class="quick-bar hidden" id="quickBar"></div>
    <div class="content" id="mainContent"></div>
  </main>
</div>

<!-- ══ MODAL ══════════════════════════════════════════════════════ -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Modal</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSubmit">Save</button>
    </div>
  </div>
</div>

<!-- Command Palette (⌘K) -->
<div id="cmdPalette" class="modal-overlay hidden" onclick="if(event.target===this)closeCmdPalette()">
  <div style="background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 64px rgba(0,0,0,0.2);overflow:hidden;animation:modalIn 0.2s ease">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)">
      <span style="font-size:18px">🔍</span>
      <input id="cmdInput" type="text" placeholder="Search clients, navigate, actions..." 
        style="flex:1;border:none;outline:none;font-size:15px;background:transparent;font-family:inherit;color:var(--text)"
        oninput="filterCmds()" onkeydown="cmdKeyNav(event)">
      <kbd style="font-size:11px;color:var(--text-3);background:var(--surface-2);padding:3px 7px;border-radius:5px;border:1px solid var(--border)">ESC</kbd>
    </div>
    <div id="cmdResults" style="max-height:360px;overflow-y:auto;padding:8px"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const S = { token: null, role: null, user: null, client: null, policies: [], investments: [], snapshots: [], page: null, viewClientId: null };
const CHARTS = {};
const COLORS = ['#0EA5E9','#10B981','#F59E0B','#8B5CF6','#EF4444','#06B6D4','#EC4899','#14B8A6','#F97316','#6366F1'];

// ── Helpers ────────────────────────────────────────────────────────────────────
const fmt = v => 'S$' + (parseFloat(v)||0).toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtPct = v => (parseFloat(v)||0).toFixed(1) + '%';

  ];

    window._allClients.slice(0,20).forEach(c => {
      base.push({ label:`👤 ${c.name}`, sub:`${c.occupation||'Client'} · ${c.email||''}`, action: () => { renderAdminViewClient(c.id); closeCmdPalette(); } });
    });
  }
  return base.filter(c => !c.adminOnly || S.role === 'admin');
}
function filterCmds() {
  const q = (document.getElementById('cmdInput')?.value||'').toLowerCase();
  const cmds = getCmds().filter(c => !q || c.label.toLowerCase().includes(q) || c.sub.toLowerCase().includes(q));
  _cmdIdx = 0;
  const el = document.getElementById('cmdResults');
  if (!el) return;
  if (!cmds.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-3)">No results</div>'; return; }
  el.innerHTML = cmds.slice(0,8).map((c,i) => `
    <div class="cmd-item" data-idx="${i}" onclick="runCmd(${i})" 
      style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;cursor:pointer;background:${i===_cmdIdx?'var(--primary-light)':'transparent'};transition:background 0.1s">
      <span style="font-size:16px">${c.label.split(' ')[0]}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${c.label.substring(c.label.indexOf(' ')+1)}</div>
        <div style="font-size:11px;color:var(--text-3)">${c.sub}</div>
      </div>
      <kbd style="font-size:10px;color:var(--text-3)">↵</kbd>
    </div>`).join('');
  window._filteredCmds = cmds;
}
function runCmd(idx) {
  const cmds = window._filteredCmds || getCmds();
  if (cmds[idx]) { closeCmdPalette(); cmds[idx].action(); }
}
function cmdKeyNav(e) {
  const cmds = window._filteredCmds || [];
  if (e.key==='ArrowDown') { _cmdIdx=Math.min(_cmdIdx+1,cmds.length-1); filterCmds(); }
  else if (e.key==='ArrowUp') { _cmdIdx=Math.max(_cmdIdx-1,0); filterCmds(); }
  else if (e.key==='Enter') runCmd(_cmdIdx);
  else if (e.key==='Escape') closeCmdPalette();
}
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); openCmdPalette(); }
});

// Expand coverage_items [{type,coverage}] into a per-type total map.
// Falls back to p.type + p.coverage for legacy policies with no items.
function getCoverageByType(policies) {
  const map = {};
  (policies || []).filter(p => p.status === 'Active').forEach(p => {
    const items = Array.isArray(p.coverage_items) ? p.coverage_items : [];
    if (items.length > 0) {
      items.forEach(ci => {
        if (ci && ci.type && (ci.coverage || 0) > 0) {
          map[ci.type] = (map[ci.type] || 0) + (parseFloat(ci.coverage) || 0);
        }
      });
    } else if (p.coverage > 0 && p.type) {
      // Legacy: no items, use single type
      map[p.type] = (map[p.type] || 0) + (p.coverage || 0);
    }
  });
  return map;
}

// Ensure coverage_items is always a parsed array (handles string from old API)
function parsePolicyCoverageItems(policies) {
  policies.forEach(p => {
    if (typeof p.coverage_items === 'string') {
      try { p.coverage_items = JSON.parse(p.coverage_items); } catch { p.coverage_items = []; }
    }
    if (!Array.isArray(p.coverage_items)) p.coverage_items = [];
    if (typeof p.feature_flags === 'string') {
      try { p.feature_flags = JSON.parse(p.feature_flags); } catch { p.feature_flags = []; }
    }
    if (!Array.isArray(p.feature_flags)) p.feature_flags = [];
  });
  return policies || [];
}

// ── API ────────────────────────────────────────────────────────────────────────
const api = {
  _req: async (method, path, body) => {
    const res = await fetch('/api' + path, {
      method, headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  },
  get: (p) => api._req('GET', p),
  post: (p, b) => api._req('POST', p, b),
  put: (p, b) => api._req('PUT', p, b),
  del: (p) => api._req('DELETE', p)
};

document.getElementById('loginBtn').onclick = doLogin;

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await api.post('/auth/login', { username, password });
    S.token = res.token; S.role = res.role; S.user = res.client;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    document.getElementById('sidebarName').textContent = res.client.name;
    document.getElementById('sidebarRole').textContent = res.role === 'admin' ? '🔑 Admin' : res.role === 'prospect' ? '💎 Prospect' : '👤 Client';
    // Clean URL if came from invite link
    if (window.location.search) window.history.replaceState({}, '', window.location.pathname);
    if (res.role === 'admin') initAdminApp();
    else if (res.role === 'prospect') initProspectApp(res.client.id, res.client);
    else initClientApp(res.client.id);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign In →';
  }
}

function logout() {
  S.token = null; S.role = null; S.user = null; S.client = null;
  S.policies = []; S.investments = []; S.snapshots = [];
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = 'Sign In →';
}

function switchAlertsTab(tab) {
  document.querySelectorAll('.alerts-tab-content').forEach(el => el.classList.remove('active'));
  ['all','expiry','gaps'].forEach(t => { const b = document.getElementById(`atab-${t}`); if(b) b.classList.remove('active'); });
  const el = document.getElementById(`alerts-${tab}`); if (el) el.classList.add('active');
  const btn = document.getElementById(`atab-${tab}`); if (btn) btn.classList.add('active');
}

async function loadExpiry(days) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tab = document.getElementById(`tab-${days}`);
  if (tab) tab.classList.add('active');
  try {
    const alerts = await api.get(`/admin/expiry-alerts?days=${days}`);
    const el = document.getElementById('expiryContent');
    if (!alerts.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">All clear!</div><div class="empty-sub">No policies expiring in the next ${days} days.</div></div>`;
      return;
    }
    el.innerHTML = `
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><div class="card-title">🔔 ${alerts.length} ${alerts.length===1?'Policy':'Policies'} Expiring in ${days} Days</div></div>
        <div>${alerts.map(p => {
          const d = daysUntil(p.end_date);
          const urgency = d <= 7 ? 'level1' : d <= 14 ? 'level2' : d <= 30 ? 'level3' : d <= 60 ? 'level4' : 'level5';
          const bgColor = urgency==='level1'?'rgba(239,68,68,0.08)':urgency==='level2'?'rgba(249,115,22,0.08)':urgency==='level3'?'rgba(245,158,11,0.08)':urgency==='level4'?'rgba(14,165,233,0.05)':'var(--surface)';
          const textColor = urgency==='level1'?'#DC2626':urgency==='level2'?'#EA580C':urgency==='level3'?'#D97706':urgency==='level4'?'#0284C7':'#059669';
          const statusDotClass = d <= 14 ? 'expiring' : d <= 30 ? 'expiring' : 'active';
          return `<div class="expiry-row" style="background:${d<=14?'rgba(239,68,68,0.02)':''}">
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
              <span class="status-dot ${statusDotClass}"></span>
              <div class="expiry-days">
                <div class="expiry-days-num" style="color:${textColor}">${d}</div>
                <div class="expiry-days-label">days</div>
              </div>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:600">${esc(p.client_name)}</div>
              <div style="font-size:12px;color:var(--text-3);margin-top:2px">${esc(p.product_name||p.type)} · ${esc(p.insurer)}</div>
              <div style="font-size:11px;color:var(--text-3);margin-top:2px">Expires ${fmtDate(p.end_date)} · Coverage ${fmt(p.coverage)}</div>
            </div>
            <div style="flex-shrink:0;text-align:right">
              <span class="badge badge-${urgency==='level1'?'lapsed':urgency==='level2'?'lapsed':urgency==='level3'?'pending':urgency==='level4'?'pending':'active'}">${d <= 7 ? 'Level 1 - Critical' : d <= 14 ? 'Level 2 - Urgent' : d <= 30 ? 'Level 3 - Soon' : d <= 60 ? 'Level 4 - Due' : 'Level 5 - Upcoming'}</span>
              <div style="font-size:12px;color:var(--text-3);margin-top:4px">${fmt(p.premium)}/yr</div>
            </div>
            <button class="btn btn-secondary btn-sm no-print" onclick="openClientView('${esc(p.client_id)}','${esc(p.client_name)}')" style="flex-shrink:0">View →</button>
          </div>`;
        }).join('')}</div>
      </div>`;
  } catch (e) { toast(e.message, 'error'); }
}

async function downloadBackup() {
  const statusEl = document.getElementById('backupStatus');
  statusEl.textContent = '⏳ Generating backup...';
  try {
    const token = localStorage.getItem('fv_token');
    const resp = await fetch('/api/admin/backup', { headers: { Authorization: `Bearer ${token}` } });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finview-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    statusEl.innerHTML = `<span style="color:var(--success)">✅ Backup downloaded - ${data.counts.clients} clients, ${data.counts.policies} policies, ${data.counts.investments} investments, ${data.counts.snapshots} snapshots.</span>`;
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--danger)">❌ ${e.message}</span>`;
  }
}

async function exportToNotionCRM() {
  const statusEl = document.getElementById('notionExportStatus');
  if (!statusEl) return;
  statusEl.innerHTML = '<span>⏳ Exporting to Notion CRM... this may take a moment.</span>';
  try {
    const result = await api.post('/admin/notion-crm-export', {});
    statusEl.innerHTML = `<span style="color:var(--success)">✅ Notion CRM export complete! ${result.success} clients synced, ${result.failed} failed.${result.errors?.length ? ' Errors: ' + result.errors.map(e => e.client + ': ' + e.error).join('; ') : ''}</span>`;
  } catch(e) {
    statusEl.innerHTML = `<span style="color:var(--danger)">❌ Export failed: ${e.message}</span>`;
  }
}

async function uploadRestore() {
  const statusEl = document.getElementById('restoreStatus');
  const file = document.getElementById('restoreFile').files[0];
  if (!file) { statusEl.innerHTML = `<span style="color:var(--danger)">❌ Please select a backup file first.</span>`; return; }
  statusEl.textContent = '⏳ Restoring data...';
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.version || !Array.isArray(data.clients)) throw new Error('Invalid backup format - not a FinView backup file.');
    const result = await api.post('/admin/restore', { clients: data.clients, policies: data.policies, investments: data.investments, snapshots: data.snapshots });
    const { imported } = result;
    statusEl.innerHTML = `<span style="color:var(--success)">✅ Restore complete! Imported: ${imported.clients} clients, ${imported.policies} policies, ${imported.investments} investments, ${imported.snapshots} snapshots. Skipped: ${imported.skipped} (already existed).</span>`;
    setTimeout(() => navTo('adminClients'), 1500);
  } catch (e) {
    statusEl.innerHTML = `<span style="color:var(--danger)">❌ ${e.message}</span>`;
  }
}

// ── Health Score + Risk Profile ───────────────────────────────────────────────
function calcHealthScore(policies, investments, client) {
  const income = client.annual_income || 50000;
  const age = client.age || 30;
  const deps = client.dependents || 0;
  const yearsToRetire = Math.max(0, 65 - age);
  const recLife = deps > 0 ? income * Math.max(8, yearsToRetire) : income * Math.max(5, yearsToRetire * 0.7);
  const recCI = income * 4;
  const recHosp = 150000;
  const byType = {};
  (policies||[]).filter(p=>p.status==='Active').forEach(p => {
    const items = Array.isArray(p.coverage_items) ? p.coverage_items : [];
    items.forEach(ci => { if(ci.type && ci.coverage) byType[ci.type] = (byType[ci.type]||0) + parseFloat(ci.coverage); });
    if (!items.length && p.coverage) byType[p.type||'Other'] = (byType[p.type||'Other']||0) + p.coverage;
  });
  const lifeTypes = ['Death / Life','Term Life','Whole Life'];
  const ciTypes = ['Early Critical Illness','Late Stage Critical Illness','Standalone CI'];
  const hospTypes = ['Hospitalization','Medical'];
  const lifeCov = lifeTypes.reduce((s,t) => s + (byType[t]||0), 0);
  const ciCov = ciTypes.reduce((s,t) => s + (byType[t]||0), 0);
  const hospCov = hospTypes.reduce((s,t) => s + (byType[t]||0), 0);
  const invValue = (investments||[]).reduce((s,i) => s + (i.value_now||0), 0);
  let score = 0;
  if (lifeCov >= recLife * 0.8) score += 25;
  else if (lifeCov > 0) score += Math.round(25 * lifeCov / recLife);
  if (ciCov >= recCI * 0.8) score += 25;
  else if (ciCov > 0) score += Math.round(25 * ciCov / recCI);
  if (hospCov > 0) score += 20;
  if (invValue > 0) score += 20;
  if ((policies||[]).length > 0) score += 10;
  score = Math.min(100, score);
  const grade = score >= 80 ? 'A' : score >= 60 ? 'B' : score >= 40 ? 'C' : 'D';
  const color = score >= 80 ? '#10B981' : score >= 60 ? '#F59E0B' : score >= 40 ? '#0EA5E9' : '#EF4444';
  return { score, grade, color, lifeCov, ciCov, hospCov, invValue, recLife, recCI };
}

function getRiskProfile(client) {
  const age = client.age || 30;
  const income = client.annual_income || 50000;
  const deps = client.dependents || 0;
  if (age >= 50 || income > 150000) return {label:'Preservation Phase', emoji:'🔴', color:'#EF4444', desc:'Optimize for legacy & stability'};
  if (age >= 35 && income >= 80000) return {label:'Accumulation Phase', emoji:'🟡', color:'#F59E0B', desc:'Balance coverage and wealth building'};
  return {label:'Growth Phase', emoji:'🟢', color:'#10B981', desc:'Maximize protection coverage'};
}

function openQuickAnalysis() {
  const hs = calcHealthScore(S.policies, S.investments, S.client);
  const rp = getRiskProfile(S.client);
  const gaps = [];
  if (hs.lifeCov < hs.recLife * 0.8) gaps.push(`Increase life coverage by ${fmt(hs.recLife - hs.lifeCov)} to reach recommended ${fmt(hs.recLife)}`);
  if (hs.ciCov < hs.recCI * 0.8) gaps.push(`Add critical illness coverage - recommended ${fmt(hs.recCI)}, currently ${fmt(hs.ciCov)}`);
  if (hs.hospCov === 0) gaps.push('Set up hospitalisation / Integrated Shield Plan coverage');
  if (S.investments.length === 0) gaps.push('Start an investment portfolio to build long-term wealth');
  if (gaps.length === 0) gaps.push('Portfolio is well-structured - schedule next annual review');
  showModal('⚡ Quick Financial Analysis', `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:#F8FAFC;border-radius:10px">
      <div style="width:64px;height:64px;border-radius:50%;border:4px solid ${hs.color};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <div style="text-align:center"><div style="font-size:20px;font-weight:800;color:${hs.color}">${hs.grade}</div><div style="font-size:10px;color:#94A3B8">${hs.score}/100</div></div>
      </div>
      <div>
        <div style="font-size:15px;font-weight:700">${S.client.name}</div>
        <div style="font-size:12px;color:#64748B;margin-top:2px">${rp.emoji} ${rp.label} - ${rp.desc}</div>
        <div style="height:6px;background:#E2E8F0;border-radius:99px;margin-top:8px;width:200px"><div style="height:100%;width:${hs.score}%;background:${hs.color};border-radius:99px"></div></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:#0F172A">📋 Top Recommendations</div>
    ${gaps.slice(0,3).map((g,i) => `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #E2E8F0">
      <div style="width:22px;height:22px;background:${hs.color};color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${i+1}</div>
      <div style="font-size:13px;color:#374151">${g}</div>
    </div>`).join('')}
  `, null, 'Close');
  document.getElementById('modalSubmit').style.display = 'none';
  document.getElementById('modalCancel').textContent = 'Close';
}

// ── PDF Report ─────────────────────────────────────────────────────────────────
async function printClientReport(clientId) {
  // Ensure we're on the overview page for a clean print
  navClientPage('overview');
  await new Promise(r => setTimeout(r, 400));
  window.print();
}

async function autoSnapshot(clientId) {
  try {
    await api.post(`/clients/${clientId}/snapshots/auto`, {});
    const snaps = await api.get(`/clients/${clientId}/snapshots`);
    S.snapshots = snaps;
    toast('Snapshot saved ✅');
  } catch (e) { toast(e.message, 'error'); }
}
