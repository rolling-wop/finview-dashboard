async function openPolicyModal(id) {
  const existing = id ? S.policies.find(p => p.id === id) : null;
  showModal(existing ? 'Edit Policy' : 'Add Policy', policyFormHTML(existing||{}), async () => {
    const d = getFormData();
    const coverageItems = getCoverageItems();
    const body = { product_name: d.product_name, policy_number: d.policy_number, insurer: d.insurer, product_type: d.product_type, coverage_items: coverageItems, premium: parseFloat(d.premium)||0, recommended: parseFloat(d.recommended)||0, status: d.status, start_date: d.start_date, end_date: d.end_date, notes: d.notes, payment_frequency: document.getElementById('mf-payment_frequency')?.value || 'annual', cpf_medisave_amount: parseFloat(document.getElementById('mf-cpf_medisave_amount')?.value)||0, cash_amount: parseFloat(document.getElementById('mf-cash_amount')?.value)||0 };
    const cid = S.viewClientId || S.user?.id;
    try {
      if (existing) { const u = await api.put(`/clients/${cid}/policies/${id}`, body); S.policies = parsePolicyCoverageItems(S.policies.map(p => p.id===id?u:p)); toast('Policy updated'); }
      else { const n = await api.post(`/clients/${cid}/policies`, body); S.policies = parsePolicyCoverageItems([...S.policies, n]); toast('Policy added ✅'); }
      closeModal(); renderInsurance(cid);
    } catch (e) { toast(e.message, 'error'); }
  });
  // Bind checklist + product autofill after modal renders
  requestAnimationFrame(() => { bindCoverageChecklist(); bindProductAutofill(); });
}

async function deletePolicy(id) {
  if (!confirm('Delete this policy?')) return;
  const cid = S.viewClientId || S.user?.id;
  try { await api.del(`/clients/${cid}/policies/${id}`); S.policies = S.policies.filter(p => p.id!==id); toast('Policy deleted'); renderInsurance(cid); }
  catch (e) { toast(e.message, 'error'); }
}

// INVESTOR PROFILE - Equal Weight Risk Scoring (20% each factor)
// Data: MAS 2024 · CPF Board 2025 · SingStat HES 2024 · MOH 2024
// ══════════════════════════════════════════════════════════════════════
function classifyInvestor(client, policies, investments) {
  const age=client.age||30, inc=client.annual_income||50000, deps=client.dependents||0;
  const occ=(client.occupation||"").toLowerCase();
  const invValue=investments.reduce((s,i)=>s+(i.value_now||0),0);
  const totalPremium=policies.filter(p=>p.status==='Active').reduce((s,p)=>s+(p.premium||0),0);
  const ytr=Math.max(0,65-age);

  // Factor 1: Time horizon (years to retire / 5, capped 1-5)
  const time_sc=Math.min(5,Math.max(1,Math.floor(ytr/5)));
  // Factor 2: Income stability (stable profession = 4, else 3)
  const stable=/engineer|doctor|lawyer|accountant|civil|teacher|manager|analyst|director|vp/.test(occ);
  const inc_sc=stable?4:3;
  // Factor 3: Dependents (more deps = more conservative)
  const dep_sc=Math.max(1,4-deps);
  // Factor 4: Investment maturity
  const inv_sc=Math.min(5,1+(invValue>50000?1:0)+(invValue>150000?1:0)+(investments.length>2?1:0));
  // Factor 5: Coverage adequacy (from health score)
  const hs=calcHealthScore(policies,investments,client);
  const cov_sc=hs.score>=80?5:hs.score>=60?4:hs.score>=40?3:hs.score>=20?2:1;

  // EQUAL WEIGHT: each factor = 20%
  const risk_score=(time_sc+inc_sc+dep_sc+inv_sc+cov_sc)/5;
  const risk_level=Math.max(1,Math.min(5,Math.round(risk_score)));
  const rl_names={1:'Very Conservative',2:'Conservative',3:'Moderate',4:'Growth',5:'Aggressive'};
  const rl_colors={1:'#10B981',2:'#0EA5E9',3:'#F59E0B',4:'#8B5CF6',5:'#EF4444'};

  // Life stage classification (SingStat age brackets)
  const ls=age<28?{l:1,n:'Early Career',c:'#10B981',tip:'⚡ Maximum compounding window - start now'}
         :age<35?{l:2,n:'Young Professional',c:'#0EA5E9',tip:'📈 Aggressive growth phase'}
         :age<45?{l:3,n:'Family Builder',c:'#F59E0B',tip:'⚖️ Balance growth and protection'}
         :age<55?{l:4,n:'Wealth Accumulator',c:'#8B5CF6',tip:'🎯 Peak earning years - maximise contributions'}
                :{l:5,n:'Pre-Retiree / Legacy',c:'#EF4444',tip:'🏖️ Shift to income focus'};

  // Income tier (MAS income bands)
  const it=inc<48000?{l:1,n:'Entry (<$4K/mo)',c:'#94A3B8',tip:'Start $12-18K/yr · scale up over time'}
          :inc<72000?{l:2,n:'Mid ($4-6K/mo)',c:'#10B981',tip:'$18-24K/yr is your sweet spot'}
          :inc<108000?{l:3,n:'Senior ($6-9K/mo)',c:'#F59E0B',tip:'$24-36K/yr + max SRS $15,300'}
          :inc<150000?{l:4,n:'High ($9-12.5K/mo)',c:'#8B5CF6',tip:'$36K+/yr + SRS + consider hybrid strategy'}
                    :{l:5,n:'HNW ($12.5K+/mo)',c:'#F59E0B',tip:'SP lump sum + RP hybrid recommended'};

  const protLbls={1:'Critical Gaps',2:'Underinsured',3:'Partially Covered',4:'Well Protected',5:'Fully Optimised'};
  const protColors={1:'#EF4444',2:'#EA580C',3:'#F59E0B',4:'#0EA5E9',5:'#10B981'};
  const invLbls=[null,'Not Started','Getting Started (<$50K)','Building ($50-150K)','Growing ($150-500K)','Established ($500K+)'];
  const invColors=[null,'#EF4444','#EA580C','#F59E0B','#0EA5E9','#10B981'];

  // Scenario matching (8 investor types)
  const SCENARIOS=[
    {e:'👨‍💼',n:'Young Professional',c:age<=35&&deps===0,t:'$500-800/mo by age 50',a:'PVW II · $12-18K/yr × 10yr · Global Tech + SG Growth'},
    {e:'👨‍👩‍👧',n:'Family Protector',c:deps>0&&age<45,t:'$1.5-2.5K/mo by age 50',a:'PVW II · $24K/yr × 10yr · SG Managed + US Dividend'},
    {e:'💎',n:'HNW Lump Sum',c:invValue>150000||inc>150000,t:'Deploy lump sum → $2-5K/mo',a:'PVA SP · $200-500K · SG Managed + Multi-Asset'},
    {e:'🏖️',n:'Retirement Planner',c:age>=45&&ytr<=20,t:'$2-4K/mo by age 65',a:'PVA II · $36K/yr × 5yr · Conservative'},
    {e:'⛵',n:'Semi-Retirement',c:age>=30&&age<50&&inc>=80000,t:'$2K/mo by age 55',a:'PVW II · $30K/yr × 10yr · Balanced'},
    {e:'🏢',n:'Business Owner',c:inc>120000,t:'$3K/mo + tax relief',a:'PVW II via SRS · $15,300/yr × 10yr'},
    {e:'🔗',n:'Hybrid Strategist',c:invValue>100000&&inc>=80000,t:'Self-funding by Year 8',a:'PVA SP $200K + PVW II $24K/yr'},
    {e:'🛡️',n:'Conservative Saver',c:true,t:'$700-1K/mo low risk',a:'PVA II · $18K/yr × 10yr · Multi-Asset'},
  ];
  const matched=SCENARIOS.filter(s=>s.c);
  const primary=matched[0]||SCENARIOS[7], secondary=matched.slice(1,3);

  // Goal readiness (reverse-engineered from SG data)
  const goals=[
    {g:'🏖️ Retire at 65 · $3K/mo',n:47412},
    {g:'🔓 Financial Freedom · $5K/mo',n:71986},
    {g:'⛵ Semi-Retire at 55 · $2K/mo',n:30393},
    {g:'💰 CPF Top-Up · $1.5K/mo',n:53353},
    {g:'🎓 University Fund · $2K/mo',n:70716},
  ].map(g=>{
    const pct=Math.min(100,Math.round(totalPremium/g.n*100));
    const lvl=totalPremium>=g.n?5:totalPremium>=g.n*.7?4:totalPremium>=g.n*.4?3:totalPremium>0?2:1;
    return{...g,pct,lvl};
  });

  return{risk_score:Math.round(risk_score*100)/100,risk_level,risk_label:rl_names[risk_level],risk_color:rl_colors[risk_level],
    rc:{time_sc,inc_sc,dep_sc,inv_sc,cov_sc},ls,it,
    protLevel:cov_sc,protLabel:protLbls[cov_sc],protColor:protColors[cov_sc],
    invLevel:inv_sc,invLabel:invLbls[inv_sc],invColor:invColors[inv_sc],
    healthScore:hs.score,primary,secondary,goals,totalPremium};
}

async function renderClientProfile(clientId, isAdmin) {
  const c = S.client;
  document.getElementById('pageTitle').textContent = `${c.name} - Holistic Plan`;
  document.getElementById('pageSub').textContent = 'Life Stage · Retirement · Income · Education · Legacy';
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-secondary btn-sm no-print" onclick="printClientReport('${clientId}')">📄 Export PDF</button>`;

  const mc = document.getElementById('mainContent');
  mc.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3)"><div style="font-size:28px;margin-bottom:8px">⏳</div>Building holistic plan...</div>`;

  // Fetch all data in parallel
  let extProfile = null, incomeStreams = [], investments = S.investments || [], policies = S.policies || [], goals = [];
  try {
    const [epRes, isRes, gRes] = await Promise.all([
      api.get(`/clients/${clientId}/profile-extended`).catch(() => ({ profile: null })),
      api.get(`/clients/${clientId}/income-streams`).catch(() => []),
      api.get(`/clients/${clientId}/goals`).catch(() => [])
    ]);
    extProfile = epRes?.profile || null;
    incomeStreams = Array.isArray(isRes) ? isRes : [];
    goals = Array.isArray(gRes) ? gRes : [];
  } catch(e) {}

  const ep = extProfile || {};
  const age = parseInt(c.age) || 30;
  const retireAge = parseInt(ep.retirement_age) || 62;
  const targetMonthly = parseFloat(ep.target_monthly_income) || 3000;
  const lifeExp = parseInt(ep.life_expectancy) || 85;
  const yearsToRetire = Math.max(0, retireAge - age);

  // ── Life Stage ──────────────────────────────────────────────────────────────
  function getLifeStage(a) {
    if (a < 30) return { name: 'Foundation', color: '#0EA5E9', emoji: '🌱', desc: 'Building the base' };
    if (a < 45) return { name: 'Growth', color: '#8B5CF6', emoji: '🚀', desc: 'Accumulating wealth' };
    if (a < 55) return { name: 'Transition', color: '#F59E0B', emoji: '⚡', desc: 'Peak earning years' };
    if (a < 62) return { name: 'Pre-Retirement', color: '#F97316', emoji: '🎯', desc: 'Final sprint' };
    return { name: 'Retirement', color: '#10B981', emoji: '🏖️', desc: 'Enjoying the fruits' };
  }
  const ls = getLifeStage(age);

  // ── Financial Health Grade ──────────────────────────────────────────────────
  function calcGrade(policies, investments, ep, incomeStreams) {
    let score = 0;
    const totalCoverage = policies.reduce((s, p) => s + (parseFloat(p.coverage) || 0), 0);
    const annualIncome = parseFloat(c.annual_income) || 1;
    // Protection: coverage >= 10x income
    const protScore = Math.min(100, (totalCoverage / (annualIncome * 10)) * 100);
    // Emergency fund
    const emergScore = Math.min(100, ((parseFloat(ep.emergency_fund_months) || 0) / 6) * 100);
    // Savings rate (estimate from investments contribution)
    const monthlyContrib = investments.reduce((s, i) => s + (parseFloat(i.contribution) || 0), 0);
    const monthlyIncome = annualIncome / 12;
    const savingsScore = Math.min(100, (monthlyContrib / Math.max(1, monthlyIncome)) * 500);
    // Investments vs 10x annual
    const totalPortfolio = investments.reduce((s, i) => s + (parseFloat(i.value_now) || 0), 0);
    const invScore = Math.min(100, (totalPortfolio / Math.max(1, annualIncome * 10)) * 100);
    // Retirement
    const proj = calcRetirementProjection(c, ep, investments, incomeStreams);
    const retireScore = proj.score;
    // Education
    const children = JSON.parse(ep.children || '[]');
    let eduScore = 100;
    if (children.length > 0) {
      const eduGoals = goals.filter(g => g.category === 'education');
      eduScore = eduGoals.length > 0 ? Math.min(100, (eduGoals.reduce((s, g) => s + parseFloat(g.current_amount || 0), 0) / Math.max(1, eduGoals.reduce((s, g) => s + parseFloat(g.target_amount || 0), 0))) * 100) : 30;
    }
    // Legacy
    const legacyItems = [(ep.has_will ? 1 : 0), (ep.cpf_nomination_done ? 1 : 0), (ep.policy_nomination_done ? 1 : 0)];
    const legacyScore = (legacyItems.reduce((s, v) => s + v, 0) / 3) * 100;

    const avg = (protScore + emergScore + savingsScore + invScore + retireScore + eduScore + legacyScore) / 7;
    const grade = avg >= 90 ? 'A+' : avg >= 75 ? 'A' : avg >= 60 ? 'B' : avg >= 40 ? 'C' : 'D';
    const gradeColor = avg >= 90 ? '#10B981' : avg >= 75 ? '#0EA5E9' : avg >= 60 ? '#F59E0B' : avg >= 40 ? '#F97316' : '#EF4444';
    return { grade, gradeColor, avg: Math.round(avg), protScore: Math.round(protScore), emergScore: Math.round(emergScore), savingsScore: Math.round(savingsScore), invScore: Math.round(invScore), retireScore, eduScore: Math.round(eduScore), legacyScore: Math.round(legacyScore) };
  }

  function calcRetirementProjection(client, extP, invs, streams) {
    const rAge = parseInt(extP?.retirement_age) || 62;
    const tMonthly = parseFloat(extP?.target_monthly_income) || 3000;
    const cAge = parseInt(client.age) || 30;
    const yToRetire = Math.max(0, rAge - cAge);
    const cpfLifeMonthly = 800;

// ── Income Stream Helpers ──────────────────────────────────────────────────────
function openIncomeStreamModal(clientId, existing) {
  const modal = document.getElementById('incomeStreamModal');
  if (!modal) return;
  document.getElementById('isModalTitle').textContent = existing ? 'Edit Income Stream' : 'Add Income Stream';
  document.getElementById('isModalId').value = existing ? existing.id : '';
  document.getElementById('is-label').value = existing ? (existing.label || '') : '';
  document.getElementById('is-type').value = existing ? (existing.type || 'rental') : 'rental';
  document.getElementById('is-amount').value = existing ? (existing.amount || '') : '';
  document.getElementById('is-frequency').value = existing ? (existing.frequency || 'monthly') : 'monthly';
  document.getElementById('is-start').value = existing ? (existing.start_date || '') : '';
  document.getElementById('is-end').value = existing ? (existing.end_date || '') : '';
  document.getElementById('is-retirement').checked = existing ? !!parseInt(existing.is_retirement_income) : false;
  document.getElementById('is-notes').value = existing ? (existing.notes || '') : '';
  modal.style.display = 'flex';
}

async function saveIncomeStream(clientId) {
  const id = document.getElementById('isModalId').value;
  const body = {
    label: document.getElementById('is-label').value,
    type: document.getElementById('is-type').value,
    amount: parseFloat(document.getElementById('is-amount').value) || 0,
    frequency: document.getElementById('is-frequency').value,
    start_date: document.getElementById('is-start').value,
    end_date: document.getElementById('is-end').value,
    is_retirement_income: document.getElementById('is-retirement').checked ? 1 : 0,
    notes: document.getElementById('is-notes').value,
  };
  if (!body.label) { toast('Label is required', 'error'); return; }
  try {
    if (id) {
      await api.put(`/clients/${clientId}/income-streams/${id}`, body);
    } else {
      await api.post(`/clients/${clientId}/income-streams`, body);
    }
    document.getElementById('incomeStreamModal').style.display = 'none';
    toast('Income stream saved ✅');
    renderClientProfile(clientId, true);
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function deleteIncomeStream(clientId, sid) {
  if (!confirm('Delete this income stream?')) return;
  await api.del(`/clients/${clientId}/income-streams/${sid}`);
  toast('Deleted');
  renderClientProfile(clientId, true);
}

function addChildRow() {
  const list = document.getElementById('children-list');
  const row = document.createElement('div');
  row.className = 'child-row';
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:6px';
  row.innerHTML = `<input class="input" placeholder="Name" style="flex:2" onchange="updateChildrenField()"><input class="input" placeholder="Age" type="number" style="flex:1;max-width:80px" onchange="updateChildrenField()"><button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove();updateChildrenField()">✕</button>`;
  list.appendChild(row);
}

function updateChildrenField() {
  const rows = document.querySelectorAll('.child-row');
  const children = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const name = inputs[0]?.value || '';
    const age = parseInt(inputs[1]?.value) || 0;
    if (name) children.push({ name, age });
  });
  const hid = document.getElementById('children-hidden');
  if (hid) hid.value = JSON.stringify(children);
}

async function saveExtendedProfile(e, clientId) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const body = {};
  fd.forEach((v, k) => { body[k] = v; });
  // Coerce numbers
  ['spouse_age','parent1_age','parent2_age','retirement_age','life_expectancy','risk_tolerance'].forEach(f => { if (body[f]) body[f] = parseInt(body[f]); });
  ['spouse_income','target_monthly_income','emergency_fund_months','property_value','rental_income'].forEach(f => { if (body[f]) body[f] = parseFloat(body[f]); });
  ['parents_dependent','property_owned','has_will','cpf_nomination_done','policy_nomination_done'].forEach(f => { body[f] = parseInt(body[f]) || 0; });
  try {
    await api.post(`/clients/${clientId}/profile-extended`, body);
    toast('Extended profile saved ✅');
    renderClientProfile(clientId, true);
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function saveProfileEdits(clientId) {
  const btn = document.getElementById('saveProfileBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  const body = {
    name: S.client.name,
    age: parseInt(document.getElementById('pe-age').value) || 0,
    gender: document.getElementById('pe-gender').value,
    occupation: document.getElementById('pe-occupation').value,
    annual_income: parseFloat(document.getElementById('pe-income').value) || 0,
    dependents: parseInt(document.getElementById('pe-dependents').value) || 0,
  };
  try {
    await api.put(`/admin/clients/${clientId}`, body);
    S.client = { ...S.client, ...body };
    document.getElementById('profileEditForm').classList.add('hidden');
    if (btn) { btn.disabled = false; btn.textContent = '💾 Save Changes'; }
    toast('Profile saved ✅');
    document.getElementById('pageSub').textContent = `${body.occupation || ''} · Age ${body.age || '-'} · Income ${fmt(body.annual_income || 0)}/yr`;
    const editBtn = document.getElementById('editProfileBtn');
    if (editBtn) editBtn.textContent = '✏️ Edit Details';
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '💾 Save Changes'; }
    toast(e.message, 'error');
  }
}

// ── DEAL PIPELINE ────────────────────────────────────────────────────────────
const DEAL_STAGES = ['Prospect','Contacted','Proposal Sent','Negotiation','Closed Won','Closed Lost'];
const STAGE_COLORS = {'Prospect':'#94A3B8','Contacted':'#0EA5E9','Proposal Sent':'#F59E0B','Negotiation':'#8B5CF6','Closed Won':'#10B981','Closed Lost':'#EF4444'};

async function renderAdminPipeline() {
  hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Deal Pipeline';
  document.getElementById('pageSub').textContent = 'Track prospects from first contact to closed';
  document.getElementById('topbarActions').innerHTML = '';
  document.getElementById('mainContent').innerHTML = '<div id="pipeline-board" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch;min-height:300px"></div>';
  try {
    const data = await api.get('/pipeline');
    const board = document.getElementById('pipeline-board');
    DEAL_STAGES.forEach(stage => {
      const clients = data.pipeline[stage] || [];
      const color = STAGE_COLORS[stage];
      const col = document.createElement('div');
      col.style.cssText = 'min-width:220px;flex-shrink:0';
      const cards = clients.map(c => `
        <div onclick="openClientView('${c.id}','${esc(c.name)}')" style="background:white;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:1px solid #E2E8F0" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.1)'" onmouseout="this.style.boxShadow='none'">
          <div style="font-size:13px;font-weight:600;color:#0F172A;margin-bottom:3px">${esc(c.name)}</div>
          <div style="font-size:11px;color:#64748B">${fmt(c.annual_income||0)}/yr · Age ${c.age||'-'}</div>
          ${c.next_action ? `<div style="font-size:10px;color:#0EA5E9;margin-top:4px;font-weight:500">→ ${esc(c.next_action)}</div>` : ''}
          ${c.last_contact ? `<div style="font-size:10px;color:#94A3B8;margin-top:2px">Last: ${esc(c.last_contact)}</div>` : ''}
          <div onclick="event.stopPropagation()" style="margin-top:8px">
            <select onchange="updateDealStage('${c.id}',this.value)" style="font-size:11px;padding:3px 6px;border:1px solid #E2E8F0;border-radius:5px;width:100%;cursor:pointer">
              ${DEAL_STAGES.map(s => `<option ${s===stage?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>`).join('');
      col.innerHTML = `<div style="background:${color}18;border:1px solid ${color}40;border-radius:10px;overflow:hidden">
        <div style="padding:10px 14px;background:${color}20;border-bottom:1px solid ${color}30;display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:12px;font-weight:700;color:${color}">${stage}</div>
          <span style="background:${color};color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px">${clients.length}</span>
        </div>
        <div style="padding:8px">${clients.length ? cards : '<div style="text-align:center;padding:20px 8px;font-size:12px;color:#94A3B8">Empty</div>'}</div>
      </div>`;
      board.appendChild(col);
    });
  } catch(e) { toast(e.message, 'error'); }
}

async function updateDealStage(clientId, stage) {
  try {
    await api._req('PATCH', `/clients/${clientId}/notes`, { deal_stage: stage });
    toast('Moved to ' + stage);
    navTo('adminPipeline');
  } catch(e) { toast(e.message, 'error'); }
}

// ── ADMIN PROSPECTS ──────────────────────────────────────────────────────────
async function renderAdminProspects() {
  hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Prospects';
  document.getElementById('pageSub').textContent = 'Pipeline management & conversion tracking';
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-primary" onclick="openProspectModal()">➕ Add Prospect</button>`;
  document.getElementById('mainContent').innerHTML = '<div class="skeleton" style="height:200px"></div>';
  try {
    const clients = await api.get('/admin/clients');
    const prospects = clients.filter(c => c.role === 'prospect');
    const thirtyDaysAgo = new Date(Date.now() - 30*24*3600*1000);
    const converted = clients.filter(c => c.role === 'client' && c.converted_at && new Date(c.converted_at) > thirtyDaysAgo);
    const convRate = prospects.length > 0 ? Math.round(converted.length / (prospects.length + converted.length) * 100) : 0;
    const badge = document.getElementById('prospectsCount');
    if (badge && prospects.length) { badge.textContent = prospects.length; badge.classList.remove('hidden'); }
    const stages = ['New','Contacted','Meeting Set','Proposal Sent','Cold'];
    const stageCounts = {};
    stages.forEach(s => stageCounts[s] = 0);
    prospects.forEach(p => {
      const st = p.deal_stage || 'New';
      if (stageCounts[st] !== undefined) stageCounts[st]++;
      else if (st === 'Prospect') stageCounts['New']++;
    });
    document.getElementById('mainContent').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px">
        <div class="metric"><div class="metric-accent" style="background:var(--primary)"></div><div class="metric-label">Total Prospects</div><div class="metric-value">${prospects.length}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--success)"></div><div class="metric-label">Converted (30d)</div><div class="metric-value">${converted.length}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--purple)"></div><div class="metric-label">Conversion Rate</div><div class="metric-value">${convRate}%</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">
        ${stages.map(st => `<div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:8px">${st}</div><div style="font-size:24px;font-weight:800;color:var(--text)">${stageCounts[st]}</div></div>`).join('')}
      </div>
      <div class="card"><div class="card-header"><div class="card-title">💼 All Prospects</div></div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Stage</th><th>Added</th><th>Actions</th></tr></thead>
          <tbody>${prospects.length === 0 ? '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-3)">No prospects yet</td></tr>' :
            prospects.map(p => {
              const sb = p.deal_stage==='Closed Won'?'badge-success':p.deal_stage==='Cold'?'badge-gray':'badge-info';
              return `<tr><td><div style="font-weight:600">${esc(p.name)}</div><div style="font-size:11px;color:var(--text-3)">${esc(p.occupation||'')}</div></td><td><div style="font-size:12px">${esc(p.email||'')}</div><div style="font-size:12px;color:var(--text-3)">${esc(p.phone||'')}</div></td><td><span class="badge ${sb}" style="font-size:10px">${p.deal_stage||'New'}</span></td><td style="font-size:12px;color:var(--text-3)">${p.created_at ? new Date(p.created_at).toLocaleDateString('en-SG') : '-'}</td><td><div style="display:flex;gap:6px">${p.phone ? `<a href="https://wa.me/65${(p.phone||'').replace(/\D/g,'')}" target="_blank" class="btn btn-ghost btn-sm">💬</a>` : ''}<button class="btn btn-success btn-sm" onclick="convertProspect('${p.id}','${esc(p.name)}')"✅</button><button class="btn btn-ghost btn-sm" onclick="showInviteLink('${p.id}','${esc(p.name)}')">🔗</button></div></td></tr>`;
            }).join('')}</tbody></table></div></div>`;
  } catch(e) { document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
}

async function convertProspect(id, name) {
  if (!confirm(`Convert ${name} to client?`)) return;
  try {
    await api.put(`/admin/clients/${id}`, { role: 'client' });
    toast(`${name} converted ✅`);
    renderAdminProspects();
  } catch(e) { toast(e.message, 'error'); }
}

function openProspectModal() {
  showModal('Add Prospect', `<div class="form-grid">
      <div class="field"><label>Full Name *</label><input id="pm-name" type="text" placeholder="Jane Tan"></div>
      <div class="field"><label>Username *</label><input id="pm-username" type="text" placeholder="jane.tan"></div>
      <div class="field"><label>Password *</label><input id="pm-password" type="password" placeholder="Min 8 chars"></div>
      <div class="field"><label>Email</label><input id="pm-email" type="email" placeholder="jane@email.com"></div>
      <div class="field"><label>Phone (SG)</label><input id="pm-phone" type="tel" placeholder="91234567"></div>
      <div class="field"><label>Age</label><input id="pm-age" type="number" placeholder="30" min="18" max="80"></div>
      <div class="field"><label>Occupation</label><input id="pm-occupation" type="text" placeholder="Software Engineer"></div>
      <div class="field"><label>Annual Income</label><input id="pm-income" type="number" placeholder="60000"></div>
    </div>`, async () => {
    const body = { name: document.getElementById('pm-name')?.value, username: document.getElementById('pm-username')?.value, password: document.getElementById('pm-password')?.value, email: document.getElementById('pm-email')?.value, phone: document.getElementById('pm-phone')?.value, age: parseInt(document.getElementById('pm-age')?.value)||0, occupation: document.getElementById('pm-occupation')?.value, annual_income: parseFloat(document.getElementById('pm-income')?.value)||0, role: 'prospect' };
    if (!body.name || !body.username || !body.password) { toast('Name, username and password required','error'); return false; }
    try { await api.post('/admin/clients', body); toast(`Prospect ${body.name} added ✅`); closeModal(); renderAdminProspects(); } catch(e) { toast(e.message,'error'); return false; }

// ── COMMISSIONS TRACKER ──────────────────────────────────────────────────────
async function renderCommissions() {
  document.getElementById('pageTitle').textContent = 'Commissions';
  document.getElementById('pageSub').textContent = 'Track your earnings';
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-primary" onclick="openCommissionModal()">+ Add Commission</button>`;
  
  try {
    const [commissions, summary, clients] = await Promise.all([
      api.get('/admin/commissions'),
      api.get('/admin/commissions/summary'),
      api.get('/admin/clients')
    ]);
    window._allCommissions = commissions;
    window._commClients = clients;
    
    const received = commissions.filter(c => c.status === 'received').reduce((s,c) => s + (c.amount||0), 0);
    const pending = commissions.filter(c => c.status === 'pending').reduce((s,c) => s + (c.amount||0), 0);
    const clawback = commissions.filter(c => c.status === 'clawback').reduce((s,c) => s + (c.amount||0), 0);
    const now = new Date();
    const thisMonth = commissions.filter(c => c.status === 'received' && c.received_date && new Date(c.received_date).getMonth() === now.getMonth() && new Date(c.received_date).getFullYear() === now.getFullYear()).reduce((s,c) => s + (c.amount||0), 0);
    
    document.getElementById('mainContent').innerHTML = `
      <div class="metrics-grid" style="margin-bottom:24px">
        <div class="metric"><div class="metric-accent" style="background:var(--success)"></div><div class="metric-label">YTD Received</div><div class="metric-value">${fmt(received)}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--warning)"></div><div class="metric-label">Pending</div><div class="metric-value">${fmt(pending)}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--danger)"></div><div class="metric-label">Clawback Risk</div><div class="metric-value">${fmt(clawback)}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--primary)"></div><div class="metric-label">This Month</div><div class="metric-value">${fmt(thisMonth)}</div></div>
      </div>
      
      <div class="card" style="margin-bottom:20px">
        <div class="card-header"><div class="card-title">📊 Monthly Overview</div></div>
        <div class="card-body"><div class="chart-wrap"><canvas id="chartCommissions"></canvas></div></div>
      </div>
      
      <div class="card">
        <div class="card-header"><div class="card-title">💰 All Commissions</div>
          <div style="display:flex;gap:8px">
            <select id="commFilter" class="btn btn-secondary btn-sm" onchange="filterCommissions()">
              <option value="all">All Status</option>
              <option value="pending">Pending</option>
              <option value="received">Received</option>
              <option value="clawback">Clawback</option>
            </select>
          </div>
        </div>
        <div id="commTable" class="table-wrap">
          ${commissions.length === 0 ? '<div class="empty"><div class="empty-icon">💰</div><div class="empty-title">No commissions yet</div><button class="btn btn-primary" onclick="openCommissionModal()">+ Add First Commission</button></div>' :
          renderCommissionsTable(commissions)}
        </div>
      </div>`;
    
    // Build monthly chart
    const months = Array.from({length:12}, (_,i) => {
      const d = new Date(); d.setMonth(d.getMonth() - (11-i));
      return { label: d.toLocaleDateString('en-SG',{month:'short'}), month: d.getMonth(), year: d.getFullYear() };
    });
    const receivedByMonth = months.map(m => commissions.filter(c => c.status==='received' && c.received_date && new Date(c.received_date).getMonth()===m.month && new Date(c.received_date).getFullYear()===m.year).reduce((s,c)=>s+(c.amount||0),0));
    const pendingByMonth = months.map(m => commissions.filter(c => c.status==='pending' && c.expected_date && new Date(c.expected_date).getMonth()===m.month && new Date(c.expected_date).getFullYear()===m.year).reduce((s,c)=>s+(c.amount||0),0));
    
    mkChart('chartCommissions', {
      type:'bar',
      data:{labels:months.map(m=>m.label),datasets:[
        {label:'Received',data:receivedByMonth,backgroundColor:'rgba(16,185,129,0.7)',borderRadius:4},
        {label:'Pending',data:pendingByMonth,backgroundColor:'rgba(245,158,11,0.5)',borderRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)}`}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}}}}
    });
  } catch(e) {
    document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
}

function renderCommissionsTable(commissions) {
  if (!commissions.length) return '<div style="padding:20px;text-align:center;color:var(--text-3)">No commissions found</div>';
  return `<table>
    <thead><tr><th>Client</th><th>Product</th><th>Insurer</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${commissions.map(c => `<tr>
      <td style="font-weight:600">${esc(c.client_name||c.client_id)}</td>
      <td>${esc(c.product_name||'')}</td>
      <td style="font-size:12px;color:var(--text-3)">${esc(c.insurer||'')}</td>
      <td><span class="badge badge-info" style="font-size:10px">${c.commission_type||'first_year'}</span></td>
      <td style="font-weight:700;color:var(--success)">${fmt(c.amount||0)}</td>
      <td style="font-size:12px">${c.received_date || c.expected_date || '—'}</td>
      <td><span class="badge ${c.status==='received'?'badge-success':c.status==='clawback'?'badge-danger':'badge-warning'}">${c.status||'pending'}</span></td>
      <td>
        <div style="display:flex;gap:4px">
          ${c.status==='pending'?`<button class="btn btn-success btn-sm" onclick="markCommission(${c.id},'received')" title="Mark received">✅</button>
          <button class="btn btn-danger btn-sm" onclick="markCommission(${c.id},'clawback')" title="Mark clawback">↩️</button>`:''}
          <button class="btn btn-ghost btn-sm" onclick="openCommissionModal(${c.id})">✏️</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteCommission(${c.id})">🗑️</button>
        </div>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function filterCommissions() {
  const f = document.getElementById('commFilter')?.value || 'all';
  const all = window._allCommissions || [];
  const filtered = f === 'all' ? all : all.filter(c => c.status === f);
  const el = document.getElementById('commTable');
  if (el) el.innerHTML = renderCommissionsTable(filtered);
}

async function markCommission(id, status) {
  try {
    const body = { status };
    if (status === 'received') body.received_date = new Date().toISOString().split('T')[0];
    await api.put(`/admin/commissions/${id}`, body);
    toast(status === 'received' ? 'Commission marked as received ✅' : 'Marked as clawback');
    renderCommissions();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteCommission(id) {
  if (!confirm('Delete this commission record?')) return;
  try { await api.del(`/admin/commissions/${id}`); toast('Deleted'); renderCommissions(); }
  catch(e) { toast(e.message, 'error'); }
}

async function openCommissionModal(id) {
  const existing = id ? (window._allCommissions||[]).find(c => c.id === id) : null;
  const clients = window._commClients || [];
  
  const html = `<div class="form-grid">
    <div class="field"><label>Client *</label><select id="cm-client">
      <option value="">Select client...</option>
      ${clients.map(c => `<option value="${c.id}" ${existing?.client_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
    </select></div>
    <div class="field"><label>Product Name</label><input id="cm-product" type="text" value="${esc(existing?.product_name||'')}" placeholder="PRULink Life Assure"></div>
    <div class="field"><label>Insurer</label><input id="cm-insurer" type="text" value="${esc(existing?.insurer||'')}" placeholder="Prudential, AIA..."></div>
    <div class="field"><label>Commission Type</label><select id="cm-type">
      <option value="first_year" ${existing?.commission_type==='first_year'?'selected':''}>First Year</option>
      <option value="renewal" ${existing?.commission_type==='renewal'?'selected':''}>Renewal</option>
      <option value="override" ${existing?.commission_type==='override'?'selected':''}>Override</option>
      <option value="bonus" ${existing?.commission_type==='bonus'?'selected':''}>Bonus</option>
    </select></div>
    <div class="field"><label>Amount (S$)</label><input id="cm-amount" type="number" value="${existing?.amount||''}" placeholder="2500" step="0.01"></div>
    <div class="field"><label>Expected Date</label><input id="cm-expected" type="date" value="${existing?.expected_date||''}"></div>
    <div class="field"><label>Received Date</label><input id="cm-received" type="date" value="${existing?.received_date||''}"></div>
    <div class="field"><label>Status</label><select id="cm-status">
      <option value="pending" ${(existing?.status||'pending')==='pending'?'selected':''}>Pending</option>
      <option value="received" ${existing?.status==='received'?'selected':''}>Received</option>
      <option value="clawback" ${existing?.status==='clawback'?'selected':''}>Clawback</option>
    </select></div>
    <div class="field" style="grid-column:1/-1"><label>Notes</label><textarea id="cm-notes" rows="2">${esc(existing?.notes||'')}</textarea></div>
  </div>`;
  
  showModal(existing ? 'Edit Commission' : 'Add Commission', html, async () => {
    const body = {
      client_id: document.getElementById('cm-client')?.value,
      product_name: document.getElementById('cm-product')?.value,
      insurer: document.getElementById('cm-insurer')?.value,
      commission_type: document.getElementById('cm-type')?.value,
      amount: parseFloat(document.getElementById('cm-amount')?.value)||0,
      expected_date: document.getElementById('cm-expected')?.value,
      received_date: document.getElementById('cm-received')?.value,
      status: document.getElementById('cm-status')?.value,
      notes: document.getElementById('cm-notes')?.value,
    };
    if (!body.client_id) { toast('Select a client','error'); return false; }
    try {
      if (existing) { await api.put(`/admin/commissions/${id}`, body); toast('Updated'); }
      else { await api.post('/admin/commissions', body); toast('Commission added ✅'); }
      closeModal();
      renderCommissions();
    } catch(e) { toast(e.message,'error'); return false; }
  });
}

// ── CLIENT NOTES ─────────────────────────────────────────────────────────────
function addNotesSection(clientId) {

  const section = document.createElement('div');
  section.id = 'client-notes-section';
  section.style.marginTop = '20px';
  section.innerHTML = `
    <div style="background:white;border-radius:12px;border:1px solid #E2E8F0;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid #E2E8F0;background:#F8FAFC;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:14px;font-weight:700">📝 Meeting Notes & Next Steps</div>
        <button onclick="saveClientNotes('${clientId}')" class="btn btn-primary btn-sm">💾 Save</button>
      </div>
      <div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div>
          <label style="font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Deal Stage</label>
          <select id="notes-stage" style="width:100%;padding:8px 10px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:13px">
            ${DEAL_STAGES.map(s => `<option>${s}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Last Contact</label>
          <input type="date" id="notes-last-contact" style="width:100%;padding:8px 10px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:13px">
        </div>
        <div style="grid-column:1/-1">
          <label style="font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Next Action</label>
          <input type="text" id="notes-next-action" placeholder="e.g. Follow up on ILP proposal by 15 Apr" style="width:100%;padding:8px 10px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:13px">
        </div>
        <div style="grid-column:1/-1">
          <label style="font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px">Notes</label>
          <textarea id="notes-text" rows="4" placeholder="Meeting notes, client concerns, discussions..." style="width:100%;padding:8px 10px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:13px;resize:vertical"></textarea>
        </div>
      </div>
    </div>`;
  document.getElementById('mainContent')?.appendChild(section);
  api.get('/clients/' + clientId).then(c => {
    const s = document.getElementById('notes-stage'); if (s && c.deal_stage) s.value = c.deal_stage;
    const lc = document.getElementById('notes-last-contact'); if (lc && c.last_contact) lc.value = c.last_contact;
    const na = document.getElementById('notes-next-action'); if (na && c.next_action) na.value = c.next_action;
    const nt = document.getElementById('notes-text'); if (nt && c.notes) nt.value = c.notes;
  }).catch(() => {});
}

async function saveClientNotes(clientId) {
  try {
    await api._req('PATCH', `/clients/${clientId}/notes`, {
      deal_stage: document.getElementById('notes-stage')?.value || '',
      last_contact: document.getElementById('notes-last-contact')?.value || '',
      next_action: document.getElementById('notes-next-action')?.value || '',
      notes: document.getElementById('notes-text')?.value || '',
    });
    toast('Notes saved ✅');

function showStep(id) {
  ['step-info','step-parser','step-review','step-loading'].forEach(s => document.getElementById(s).style.display = s===id ? 'block' : 'none');
}

function goToInfoStep() { showStep('step-info'); }

function handlePolicyFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    window._pFileData = { base64: e.target.result.split(',')[1], type: file.type, name: file.name };
    document.getElementById('file-preview').textContent = `✔ ${file.name} loaded (${(file.size/1024).toFixed(1)} KB)`;
    document.getElementById('p-text').value = '';
  };
  reader.readAsDataURL(file);
}

async function parseProspectPolicies() {
  const text = document.getElementById('p-text').value.trim();
  const fd = window._pFileData;
  if (!text && !fd) { alert('Paste policy text or upload an image/PDF'); return; }
  showStep('step-loading');
  try {
    const body = fd ? { image_base64: fd.base64, media_type: fd.type } : { text };
    const r = await api._req('POST', '/prospect/parse', body);
    _parsedPolicies = r.policies || [];
    renderParsedPreview(_parsedPolicies);
    showStep('step-review');
  } catch(e) { showStep('step-parser'); alert('Parse error: ' + e.message); }
}

function computeLocalGap(income, policies) {
  const active = policies.filter(p => p.status === 'Active' && !p.error);
  const sum = arr => arr.reduce((s,p) => s+(parseFloat(p.sum_assured)||0), 0);
  const deathPols = active.filter(p => p.sub_type==='Death');
  const tpdPols   = active.filter(p => p.sub_type==='TPD');
  const teciPols  = active.filter(p => ['TECI','Early CI'].includes(p.sub_type));
  const multiPols = active.filter(p => p.sub_type==='Multi CI');
  const allCI     = active.filter(p => ['TECI','Early CI','Multi CI'].includes(p.sub_type));
  const hospPols  = active.filter(p => (p.sub_type||'').startsWith('Hospital'));
  const wardRank  = {'Hospital Private':5,'Hospital B1':4,'Hospital B2+':3,'Hospital B2':2,'Hospital C':1};
  const bestWard  = hospPols.reduce((b,p) => (wardRank[p.sub_type]||0)>(wardRank[b]||0)?p.sub_type:b, null);
  const hasMulti  = multiPols.length > 0;
  const multEnd   = hasMulti ? Math.min(...multiPols.map(p=>p.multiplier_end_age||99).filter(x=>x<99)) : null;
  const multTimes = hasMulti ? Math.max(...multiPols.map(p=>p.multiplier_times||0)) : null;
  const flag = (have,need) => need>0?(have>=need?'ok':have>=need*0.5?'partial':'gap'):(have>0?'ok':'gap');
  return {
    income,
    death:    {have:sum(deathPols),need:income*10,  gap:Math.max(0,income*10 -sum(deathPols)),  status:flag(sum(deathPols),income*10)},
    tpd:      {have:sum(tpdPols),  need:income*10,  gap:Math.max(0,income*10 -sum(tpdPols)),    status:flag(sum(tpdPols),income*10)},
    ci:       {have:sum(allCI),    need:income*5,   gap:Math.max(0,income*5  -sum(allCI)),      status:flag(sum(allCI),income*5)},
    early_ci: {have:sum(teciPols), need:income*3,   gap:Math.max(0,income*3  -sum(teciPols)),   status:flag(sum(teciPols),income*3)},
    multi_ci: {has:hasMulti, sum_assured:sum(multiPols), multiplier_end_age:multEnd<99?multEnd:null, multiplier_times:multTimes||null,
               note: hasMulti?`Multi-pay CI ✓${multEnd&&multEnd<99?` — multiplier ends age ${multEnd}`:''}${multTimes?` (${multTimes}x)`:''}`:'No multi-pay CI'},
    hospital: {ward:bestWard, status:bestWard==='Hospital Private'?'ok':bestWard?'partial':'gap',
               note:!bestWard?'No hospitalisation':bestWard==='Hospital Private'?'Private ✓':`${bestWard} — consider upgrading`},
    total_premium: active.reduce((s,p)=>s+(parseFloat(p.annual_premium)||0),0),
  };
}

function renderGapCard(gap) {
  const stColor = {ok:'#22C55E', partial:'#F59E0B', gap:'#EF4444'};

      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${label}</div>
        ${note ? `<div style="font-size:11px;color:var(--text-secondary)">${note}</div>` : ''}
      </div>
      <div style="text-align:right">
        ${have !== undefined ? `<div style="font-size:12px;font-weight:600;color:${stColor[status]}">$${Number(have).toLocaleString()}</div>` : ''}
        ${gapAmt > 0 ? `<div style="font-size:11px;color:var(--danger)">Gap: $${Number(gapAmt).toLocaleString()}</div>` : ''}
        ${need ? `<div style="font-size:10px;color:var(--text-secondary)">Target: $${Number(need).toLocaleString()}</div>` : ''}
      </div>
    </div>`;
  return `
  <div class="card">
    <div style="font-weight:700;font-size:13px;margin-bottom:12px">📊 Coverage Gap Analysis
      <span style="font-size:11px;font-weight:400;color:var(--text-secondary);margin-left:6px">Income: $${Number(gap.income).toLocaleString()}/yr</span>
    </div>
    ${row('Death Cover', gap.death.status, gap.death.have, gap.death.need, gap.death.gap, 'Target: 10x annual income')}
    ${row('TPD Cover', gap.tpd.status, gap.tpd.have, gap.tpd.need, gap.tpd.gap, 'Target: 10x annual income')}
    ${row('Critical Illness', gap.ci.status, gap.ci.have, gap.ci.need, gap.ci.gap, 'Target: 5x annual income')}
    ${row('Early CI', gap.early_ci.status, gap.early_ci.have, gap.early_ci.need, gap.early_ci.gap, 'Target: 3x annual income')}
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:16px;width:24px;text-align:center">${gap.multi_ci.has ? '✅' : '❌'}</span>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">Multi-pay CI</div>
        <div style="font-size:11px;color:${gap.multi_ci.has ? '#22C55E' : '#EF4444'}">${gap.multi_ci.note}</div>
        ${gap.multi_ci.has && gap.multi_ci.multiplier_end_age ? `<div style="font-size:11px;color:#F59E0B">⚠️ Multiplier ends age ${gap.multi_ci.multiplier_end_age} — note for review</div>` : ''}
      </div>
      ${gap.multi_ci.sum_assured ? `<div style="font-size:12px;font-weight:600;color:#22C55E">$${Number(gap.multi_ci.sum_assured).toLocaleString()}</div>` : ''}

async function convertProspect(id, name) {

  try {

    document.getElementById('prospect-detail-modal').style.display = 'none';
    await loadProspectsList();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteProspect(id, name) {
  if (!confirm(`Delete ${name}?`)) return;
  try {
    await api._req('DELETE', `/prospects/${id}`);
    toast(`🗑 ${name} deleted`);
    await loadProspectsList();
  } catch(e) { toast(e.message, 'error'); }
}

async function renderGoals(clientId) {
  if (typeof hideQuickBar === 'function') hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Financial Goals';
  document.getElementById('pageSub').textContent = 'Track progress towards key financial milestones';
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="openGoalModal()">+ Add Goal</button>
  `;
  const cid = clientId || S.viewClientId || S.user?.id;
  let goals;
  try { goals = await api.get(`/clients/${cid}/goals`); } catch(e) { toast('Failed to load goals', 'error'); return; }
  const fmt = v => `$${(v||0).toLocaleString('en-SG', {minimumFractionDigits:0,maximumFractionDigits:0})}`;
  const catEmoji = { retirement:'🏖️', education:'🎓', emergency:'🚨', property:'🏠', investment:'📈', general:'🎯' };
  const now = new Date();

  // Feature 7: average CAGR from investments with start_date
  const _invs = S.investments || [];
  const _cagrs = _invs.filter(i => i.start_date && i.invested > 0 && i.value_now > 0).map(i => {
    const yrs = (Date.now() - new Date(i.start_date).getTime()) / (365.25 * 86400000);
    if (yrs < 0.5) return null;
    const r = Math.pow(i.value_now / i.invested, 1/yrs) - 1;
    return (r > 0 && r < 0.5) ? r : null;
  }).filter(v => v !== null);
  const avgCagr = _cagrs.length ? _cagrs.reduce((a,b) => a+b, 0) / _cagrs.length : 0.05;

  document.getElementById('mainContent').innerHTML = goals.length === 0
    ? `<div class="card" style="text-align:center;padding:40px"><div style="font-size:48px">🎯</div><div style="font-size:16px;font-weight:600;margin:12px 0 6px">No goals yet</div><div style="color:var(--text-3);margin-bottom:16px">Set financial goals to track your progress</div><button class="btn btn-primary" onclick="openGoalModal()">+ Add First Goal</button></div>`
    : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">
      ${goals.map(g => {
        const pct = g.target_amount > 0 ? Math.min(100, (g.current_amount / g.target_amount) * 100) : 0;
        const daysLeft = g.target_date ? Math.ceil((new Date(g.target_date) - now) / 86400000) : null;
        const monthsLeft = daysLeft !== null ? Math.max(1, Math.round(daysLeft / 30.44)) : null;
        const emoji = catEmoji[g.category] || '🎯';
        const barColor = pct >= 100 ? '#22c55e' : pct >= 60 ? '#eab308' : '#3b82f6';
        const gap = Math.max(0, (g.target_amount||0) - (g.current_amount||0));
        const monthlySave = monthsLeft ? Math.ceil(gap / monthsLeft) : null;
        const yearsLeft = monthsLeft ? monthsLeft / 12 : null;
        const projValue = (yearsLeft && avgCagr > 0) ? (g.current_amount||0) * Math.pow(1+avgCagr, yearsLeft) + (monthlySave||0) * ((Math.pow(1+avgCagr, yearsLeft)-1) / (avgCagr/12)) : null;
        const onTrack = projValue !== null ? projValue >= (g.target_amount||0) : null;
        const onTrackColor = onTrack === null ? '#64748B' : onTrack ? '#10B981' : (projValue >= (g.target_amount||0)*0.8 ? '#F59E0B' : '#EF4444');
        return `
          <div class="card" style="padding:16px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
              <div>
                <div style="font-size:18px;margin-bottom:4px">${emoji}</div>
                <div style="font-weight:600;font-size:14px">${g.name}</div>
                <div style="font-size:11px;color:var(--text-3);text-transform:capitalize">${g.category}${daysLeft !== null ? ` · ${daysLeft > 0 ? daysLeft+' days left' : 'Past target date'}` : ''}</div>
              </div>
              <div style="display:flex;gap:6px">
                <button class="btn btn-secondary btn-sm" onclick="openGoalModal(${g.id},'${g.name}',${g.target_amount},${g.current_amount},'${g.target_date||''}','${g.category}','${g.notes||''}')">✏️</button>
                <button class="btn btn-danger btn-sm" onclick="deleteGoal(${g.id})">🗑️</button>
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
              <span style="color:var(--text-2)">${fmt(g.current_amount)} saved</span>
              <span style="color:var(--text-3)">Target: ${fmt(g.target_amount)}</span>
            </div>
            <div style="background:var(--surface-2);border-radius:99px;height:8px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${barColor};border-radius:99px;transition:width 0.4s"></div>
            </div>
            <div style="font-size:11px;color:${barColor};font-weight:600;margin-top:4px;text-align:right">${pct.toFixed(0)}% complete</div>
            ${monthlySave !== null ? `<div style="margin-top:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;font-size:12px">💰 Need <strong>${fmt(monthlySave)}/mo</strong> to hit target by ${g.target_date||'target date'}${projValue !== null ? `<br><span style="color:${onTrackColor};font-weight:600">${onTrack ? '✅ On track' : '⚠️ Off track'}</span> · Projected ${fmt(projValue)} @ ${(avgCagr*100).toFixed(1)}% CAGR` : ''}</div>` : ''}
            ${g.notes ? `<div style="font-size:11px;color:var(--text-3);margin-top:8px;font-style:italic">${g.notes}</div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

async function renderCashflowAnalysis(clientId) {
  const el = document.getElementById('cf-analysis-content');

  if (!analysis) {
    el.innerHTML = `
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:56px;margin-bottom:16px">📂</div>
        <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px">No Cashflow Analysis Yet</div>
        <div style="font-size:13px;color:var(--text-3);margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto">
          Upload a cashflow Excel file to generate this client's personalised financial snapshot — income, expenses, insurance costs, savings breakdown, and net cashflow all in one view.
        </div>
        ${S.role === 'admin' ? `<label class="btn btn-primary" style="cursor:pointer;display:inline-flex;align-items:center;gap:8px">
          📤 Upload Cashflow Excel
          <input type="file" accept=".xlsx,.xls" style="display:none" onchange="uploadCashflowAnalysis(event, '${clientId}')">
        </label>` : '<div style="font-size:13px;color:var(--text-3)">Your consultant will upload your cashflow analysis here.</div>'}
      </div>`;
    return;
  }

  const p = analysis.parsed_data;
  const s = p.summary;
  const fmt  = n => 'S$' + (parseFloat(n)||0).toLocaleString('en-SG', {minimumFractionDigits:0, maximumFractionDigits:0});
  const fmtD = n => 'S$' + (parseFloat(n)||0).toLocaleString('en-SG', {minimumFractionDigits:2, maximumFractionDigits:2});

  const savRate = s.netIncome > 0 ? ((s.totalSavings / s.netIncome) * 100).toFixed(1) : 0;

  const insRate = s.netIncome > 0 ? ((s.totalInsurance / s.netIncome) * 100).toFixed(1) : 0;
  const cfColor = s.netCashflow >= 0 ? 'var(--success)' : 'var(--danger)';
  const cfPct   = s.netIncome > 0 ? ((s.netCashflow / s.netIncome) * 100).toFixed(0) : 0;

  el.innerHTML = `
    <!-- Header strip -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div>
        <div style="font-size:20px;font-weight:800;color:var(--text)">${p.client.name || 'Client'} — Financial Snapshot</div>

          ${p.client.employmentStatus ? p.client.employmentStatus + ' &nbsp;·&nbsp;' : ''}
          Prepared ${analysis.presentation_date || ''}
          ${p.client.consultant ? ' &nbsp;·&nbsp; Consultant: ' + p.client.consultant : ''}
        </div>
      </div>
      ${S.role === 'admin' ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">
          🔄 Replace File
          <input type="file" accept=".xlsx,.xls" style="display:none" onchange="uploadCashflowAnalysis(event, '${clientId}')">
        </label>
        <button class="btn btn-danger btn-sm" onclick="deleteCashflowAnalysis('${clientId}')">🗑️ Remove</button>
      </div>` : ''}
    </div>

    <!-- KPI cards -->
    <div class="metrics-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px">
      <div class="metric" style="border-left:3px solid var(--success)">
        <div class="metric-label">💰 Monthly Income</div>
        <div class="metric-value" style="color:var(--success)">${fmtD(s.netIncome)}</div>

      <div class="metric" style="border-left:3px solid #EF4444">

async function uploadCashflowAnalysis(event, clientId) {
  const file = event.target.files[0];
  if (!file) return;
  const el = document.getElementById('cf-analysis-content');
  if (el) el.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text-3)"><div style="font-size:32px;margin-bottom:8px">⏳</div>Parsing Excel file...</div>`;
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch(`/api/clients/${clientId}/cashflow/upload`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + S.token },
      body: formData
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    toast('✅ Cashflow analysis uploaded!');
    renderCashflowAnalysis(clientId);
  } catch(e) {
    toast('❌ ' + e.message, 'error');
    renderCashflowAnalysis(clientId);
  }
}

async function deleteCashflowAnalysis(clientId) {
  if (!confirm('Remove this cashflow analysis? The manual tracker entries will not be affected.')) return;
  await api.del(`/clients/${clientId}/cashflow/analysis`);
  toast('Analysis removed');
  renderCashflowAnalysis(clientId);
}

// Open the income stream modal from within the cashflow page
function openCfIncomeStreamModal(clientId) {
  // Re-use the profile modal if it exists, otherwise navigate to profile tab
  if (document.getElementById('incomeStreamModal')) {
    openIncomeStreamModal(clientId);
  } else {
    toast('Open the Profile tab to manage income streams', 'info');
  }
}

function switchCfTab(tab, clientId) {
  document.querySelectorAll('.cf-tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('cf-tab-' + tab);
  if (btn) btn.classList.add('active');
  const an = document.getElementById('cf-analysis-content');
  const mn = document.getElementById('cf-manual-content');
  if (an) an.style.display = tab === 'analysis' ? 'block' : 'none';
  if (mn) mn.style.display = tab === 'manual' ? 'block' : 'none';
  if (tab === 'analysis') renderCashflowAnalysis(clientId);
  if (tab === 'manual') loadCashflowData(clientId);
}

let _activeFundTab = 'PruLink';

function switchFundTab(type, btn) {
  _activeFundTab = type;
  document.querySelectorAll('#fundTypeBar .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterFundsTable();
}

async function loadFundPrices(forceRefresh) {
  const wrap = document.getElementById('fundTableWrap');
  if (!wrap) return;
  if (!_fundData || forceRefresh) {
    if (wrap) wrap.innerHTML = `<div class="empty"><div class="loading-spinner"></div><div class="empty-sub" style="margin-top:12px">Fetching live fund prices from Prudential...</div></div>`;
    try {
      const token = S.token;
      const res = await fetch('/api/fund-prices', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
      _fundData = await res.json();
    } catch(e) {
      if (wrap) wrap.innerHTML = `<div class="empty"><div class="empty-title">Failed to load</div><div class="empty-sub">${e.message}</div></div>`;
      return;
    }
  }
  const upEl = document.getElementById('fundUpdatedOn');
  if (upEl && _fundData.updatedOn) upEl.textContent = `Prudential data as of: ${_fundData.updatedOn}${_fundData.stale ? ' (cached)' : ''}`;
  filterFundsTable();
}

function filterFundsTable() {
  const wrap = document.getElementById('fundTableWrap');
  if (!wrap || !_fundData) return;
  const q = (document.getElementById('fundSearchInput')?.value || '').toLowerCase();
  const funds = (_fundData.funds || []).filter(f => f.type === _activeFundTab && (!q || f.name.toLowerCase().includes(q)));
  if (!funds.length) {
    wrap.innerHTML = `<div class="empty"><div class="empty-sub">No funds found</div></div>`;
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>Fund Name</th>
        <th style="text-align:right">Bid</th>
        <th style="text-align:right">Offer</th>
        <th style="text-align:center">CCY</th>
        <th style="text-align:center">Effective Date</th>
      </tr></thead>
      <tbody>
        ${funds.map(f => {
          const bid = parseFloat(f.bidPrice);
          const color = isNaN(bid) ? '' : bid >= 1.0 ? 'color:#10B981;font-weight:600' : 'color:#EF4444;font-weight:600';
          return `<tr>
            <td style="font-size:13px">${esc(f.name)}</td>
            <td style="text-align:right;font-size:13px;${color}">${esc(f.bidPrice)}</td>
            <td style="text-align:right;font-size:13px">${esc(f.offerPrice)}</td>
            <td style="text-align:center;font-size:12px">${esc(f.currency)}</td>
            <td style="text-align:center;font-size:12px">${esc(f.firstEffectiveDate)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

async function runCpfCalc() {
  const age = parseInt(document.getElementById('cpf-age').value) || 30;
  const income = parseInt(document.getElementById('cpf-income').value) || 72000;
  const bonus = parseFloat(document.getElementById('cpf-bonus').value) || 1;
  const growth = parseFloat(document.getElementById('cpf-growth')?.value) || 3;
  const topup = parseInt(document.getElementById('cpf-topup')?.value) || 0;
  const oa = parseInt(document.getElementById('cpf-oa').value) || 0;
  const sa = parseInt(document.getElementById('cpf-sa').value) || 0;
  const ma = parseInt(document.getElementById('cpf-ma').value) || 0;

  try {
    const r = await api._req('GET', `/cpf/calculate?age=${age}&income=${income}&bonus=${bonus}&oa=${oa}&sa=${sa}&ma=${ma}`);
    const el = document.getElementById('cpf-results');
    if (!el) return;

    const { summary, projections } = r;
    const s55 = summary.at55 || {};
    const s60 = summary.at60 || {};
    const s65 = summary.at65 || {};
    const frs = summary.frs || 205800;
    
    // Withdrawal at 55 calculation
    const withdrawAt55 = Math.max(0, (s55.oa||0) + (s55.sa||0) - frs);
    
    // SRS recommendation (5% of income, capped at $15,300 for citizens)
    const srsRec = Math.min(income * 0.05, 15300);
    
    // CPF LIFE payout range (±10%)
    const payoutEst = summary.monthly_payout_estimate || 0;
    const payoutLow = Math.round(payoutEst * 0.9);
    const payoutHigh = Math.round(payoutEst * 1.1);

    el.innerHTML = `
    <div class="card" style="max-width:900px;margin:0 auto">
      <div class="card-header"><div class="card-title">🎯 Projection Summary</div></div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center">
          <div style="padding:20px;background:var(--surface-2);border-radius:12px">
            <div style="font-size:13px;color:var(--text-3);margin-bottom:6px">At Age 55</div>
            <div style="font-size:28px;font-weight:700;color:var(--primary)" class="metric-value">$${(s55.total||0).toLocaleString()}</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:4px">OA $${(s55.oa||0).toLocaleString()} · SA $${(s55.sa||0).toLocaleString()}</div>
          </div>
          <div style="padding:20px;background:var(--surface-2);border-radius:12px">
            <div style="font-size:13px;color:var(--text-3);margin-bottom:6px">At Age 60</div>
            <div style="font-size:28px;font-weight:700;color:var(--primary)" class="metric-value">$${(s60.total||0).toLocaleString()}</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:4px">OA $${(s60.oa||0).toLocaleString()} · SA $${(s60.sa||0).toLocaleString()}</div>
          </div>
          <div style="padding:20px;background:var(--surface-2);border-radius:12px">
            <div style="font-size:13px;color:var(--text-3);margin-bottom:6px">At Age 65</div>
            <div style="font-size:28px;font-weight:700;color:var(--success)" class="metric-value">$${(s65.total||0).toLocaleString()}</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:4px">OA $${(s65.oa||0).toLocaleString()} · SA $${(s65.sa||0).toLocaleString()}</div>
          </div>
        </div>
        
        <!-- CPF LIFE Payout -->
        <div style="margin-top:20px;padding:16px;background:linear-gradient(135deg,#0EA5E9,#6366F1);border-radius:12px;color:#fff">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
            <div>
              <div style="font-size:14px;opacity:0.9">Retirement Sum Status</div>
              <div style="font-size:22px;font-weight:700;margin-top:4px">${summary.retirement_sum_type || 'Basic'}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;opacity:0.9">Est. Monthly CPF LIFE Payout</div>
              <div style="font-size:22px;font-weight:700;margin-top:4px">$${payoutLow.toLocaleString()} – $${payoutHigh.toLocaleString()}/mo</div>
            </div>
          </div>
          <div style="margin-top:12px;font-size:11px;opacity:0.8">FRS $${frs.toLocaleString()} · BRS $${summary.brs?.toLocaleString()} · ERS $${summary.ers?.toLocaleString()}</div>
        </div>
        
        <!-- Withdrawal & SRS -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
          <div style="padding:16px;background:var(--success-light);border-radius:12px;border:1px solid rgba(16,185,129,0.2)">
            <div style="font-size:12px;font-weight:600;color:var(--success)">💰 Est. Withdrawal at 55</div>
            <div style="font-size:24px;font-weight:700;color:var(--success);margin-top:4px">$${withdrawAt55.toLocaleString()}</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:4px">Above FRS (${frs.toLocaleString()}) can be withdrawn</div>
          </div>
          <div style="padding:16px;background:var(--purple-light);border-radius:12px;border:1px solid rgba(139,92,246,0.2)">
            <div style="font-size:12px;font-weight:600;color:var(--purple)">💼 SRS Recommendation</div>
            <div style="font-size:24px;font-weight:700;color:var(--purple);margin-top:4px">$${srsRec.toLocaleString()}/yr</div>
            <div style="font-size:11px;color:var(--text-3);margin-top:4px">Tax deductible · Withdrawal at 62</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Year-by-Year Table -->
    <div class="card" style="max-width:900px;margin:20px auto 0">
      <div class="card-header" style="cursor:pointer" onclick="toggleYearTable()">
        <div class="card-title">📈 Year-by-Year Projection</div>
        <span id="yearTableToggle" style="font-size:12px;color:var(--text-3)">▼ Expand</span>
      </div>
      <div id="yearTableWrap" style="max-height:0;overflow:hidden;transition:max-height 0.3s ease">
        <table style="width:100%;font-size:12px;border-collapse:collapse">
          <thead>
            <tr style="border-bottom:1px solid var(--border);background:var(--surface-2)">
              <th style="text-align:left;padding:10px">Age</th>
              <th style="text-align:right;padding:10px">OA</th>
              <th style="text-align:right;padding:10px">SA</th>
              <th style="text-align:right;padding:10px">MA</th>
              <th style="text-align:right;padding:10px">Total</th>
            </tr>
          </thead>
          <tbody>
            ${projections.map((p,i) => `
              <tr style="border-bottom:1px solid var(--border);${p.age===55||p.age===60||p.age===65?'background:var(--primary-light);font-weight:600':''}">
                <td style="padding:10px">${p.age}${p.age===55?' 🎉':p.age===65?' 🌟':''}</td>
                <td style="text-align:right;padding:10px">$${p.oa.toLocaleString()}</td>
                <td style="text-align:right;padding:10px">$${p.sa.toLocaleString()}</td>
                <td style="text-align:right;padding:10px">$${p.ma.toLocaleString()}</td>
                <td style="text-align:right;padding:10px;font-weight:600">$${p.total.toLocaleString()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
    `;
  } catch(e) { toast(e.message, 'error'); }
}

function toggleYearTable() {
  const wrap = document.getElementById('yearTableWrap');
  const toggle = document.getElementById('yearTableToggle');
  if (!wrap) return;
  if (wrap.style.maxHeight === '0px' || wrap.style.maxHeight === '') {
    wrap.style.maxHeight = '400px';
    if (toggle) toggle.textContent = '▲ Collapse';
  } else {
    wrap.style.maxHeight = '0px';
    if (toggle) toggle.textContent = '▼ Expand';
  }
}

function renderProspectGaps() {
  document.getElementById('pageTitle').textContent = 'Coverage Gap Analysis';
  document.getElementById('pageSub').textContent = 'Based on your profile and existing policies';
  document.getElementById('topbarActions').innerHTML = '';
  const main = document.getElementById('mainContent');
  const p = S.prospectProfile || {};
  const policies = S.prospectPolicies || [];
  const income = p.annual_income || 50000;
  const age = p.age || 30;
  const deps = p.dependents || 0;

  // Simple gap calc
  const yearsToRetire = Math.max(0, 65 - age);
  const recLife = deps > 0 ? income * Math.max(8, yearsToRetire) : income * Math.max(5, yearsToRetire * 0.7);
  const recCI = income * 4;
  const recHosp = 150000;

  const byType = {};
  policies.forEach(pol => {
    const t = (pol.type || 'Other').toLowerCase();
    if (!byType[t]) byType[t] = 0;
    byType[t] += pol.coverage || 0;
  });

  const lifeCov = byType['life'] || byType['term life'] || byType['whole life'] || 0;
  const ciCov = byType['critical illness'] || byType['ci'] || 0;
  const hospCov = byType['hospitalisation'] || byType['health'] || byType['medishield'] || 0;

  const gaps = [
    { name: 'Life Insurance', icon: '❤️', rec: recLife, have: lifeCov },
    { name: 'Critical Illness', icon: '🏥', rec: recCI, have: ciCov },
    { name: 'Hospitalisation', icon: '🚑', rec: recHosp, have: hospCov }
  ];

  main.innerHTML = `
  <div class="card">
    <div class="section-title" style="margin-bottom:16px">📊 Your Coverage vs Recommended</div>
    <div style="display:grid;gap:16px">
      ${gaps.map(g => {
        const pct = Math.min(100, Math.round((g.have / g.rec) * 100));
        const gap = Math.max(0, g.rec - g.have);
        const color = pct >= 80 ? 'var(--success)' : pct >= 50 ? 'var(--warning)' : 'var(--danger)';
        return `
        <div style="padding:16px;background:var(--bg-dark);border-radius:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-weight:600">${g.icon} ${g.name}</span>
            <span style="font-size:13px;color:${color}">${pct}% covered</span>
          </div>
          <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:8px">
            <div style="height:100%;width:${pct}%;background:${color};border-radius:4px"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary)">
            <span>Have: $${g.have.toLocaleString()}</span>
            <span>Recommended: $${g.rec.toLocaleString()}</span>
          </div>
          ${gap > 0 ? `<div style="margin-top:8px;padding:8px 12px;background:${color}22;border-radius:6px;font-size:12px;color:${color}"><strong>Gap:</strong> $${gap.toLocaleString()}</div>` : ''}
        </div>
        `;
      }).join('')}
    </div>
  </div>
  <div class="card" style="margin-top:16px;text-align:center;padding:24px">
    <div style="font-size:16px;margin-bottom:12px">Want to discuss these gaps?</div>
    <a href="${DYLAN_WHATSAPP_LINK}" target="_blank" class="btn btn-primary" style="font-size:15px;padding:12px 24px">💬 WhatsApp Dylan to Book</a>
  </div>
  `;
}

async function runProspectCPF() {
  const age = document.getElementById('prospect-cpf-age')?.value || 30;
  const income = document.getElementById('prospect-cpf-income')?.value || 60000;
  try {
    const r = await api._req('GET', `/cpf/calculate?age=${age}&income=${income}`);
    const el = document.getElementById('prospect-cpf-results');
    if (!el) return;
    const { summary } = r;
    const s55 = summary.at55 || {};
    const s65 = summary.at65 || {};
    el.innerHTML = `
    <div class="card" style="max-width:700px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center">
        <div style="padding:20px;background:var(--bg-dark);border-radius:12px">
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">At Age 55</div>
          <div style="font-size:28px;font-weight:700;color:var(--primary)">$${(s55.total||0).toLocaleString()}</div>

          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">At Age 65</div>
          <div style="font-size:28px;font-weight:700;color:var(--success)">$${(s65.total||0).toLocaleString()}</div>

      </div>

        <div style="font-size:14px;opacity:0.9">Est. Monthly CPF LIFE Payout</div>

function openDependentModal(d) {
  const isEdit = d && d.id;
  openModal(`${isEdit?'Edit':'Add'} Dependent`, `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Name</label><input id="dep-name" type="text" class="input" value="${d?.name||''}" style="margin-top:4px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Relationship</label><input id="dep-rel" type="text" class="input" value="${d?.relationship||''}" placeholder="Spouse, Child, Parent..." style="margin-top:4px"></div>
        <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Age</label><input id="dep-age" type="number" class="input" value="${d?.age||''}" min="0" style="margin-top:4px"></div>
      </div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Coverage Status</label>
        <select id="dep-cov" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;margin-top:4px">
          <option value="0" ${(!d||!d.has_coverage)?'selected':''}>No coverage</option>
          <option value="1" ${d&&d.has_coverage?'selected':''}>Has own coverage</option>
        </select></div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Coverage Notes</label><input id="dep-notes" type="text" class="input" value="${d?.coverage_notes||''}" style="margin-top:4px"></div>
    </div>`, async () => {
    const cid = S.viewClientId || S.user?.id;
    const payload = { name: document.getElementById('dep-name').value, relationship: document.getElementById('dep-rel').value, age: parseInt(document.getElementById('dep-age').value)||0, has_coverage: parseInt(document.getElementById('dep-cov').value)||0, coverage_notes: document.getElementById('dep-notes').value };
    try {
      if (isEdit) await api.put(`/clients/${cid}/dependents/${d.id}`, payload);
      else await api.post(`/clients/${cid}/dependents`, payload);
      toast(isEdit?'Updated!':'Added!'); closeModal(); renderOverview(cid, S.role==='admin');
    } catch(e) { toast(e.message, 'error'); }
  });
}
async function deleteDependent(id) {
  if (!confirm('Delete dependent?')) return;
  const cid = S.viewClientId || S.user?.id;
  await api.del(`/clients/${cid}/dependents/${id}`);
  toast('Deleted'); renderOverview(cid, S.role==='admin');
}

function toggleDarkMode() {
  const isDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}
// Apply saved theme on load
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.body.classList.add('dark-mode');
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = '☀️';
    });
  }
})();
