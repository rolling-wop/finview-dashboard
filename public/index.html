// ── Insurance ──────────────────────────────────────────────────────────────────
function renderInsurance(clientId, isAdmin) {
  const cid = S.viewClientId || S.user?.id;
  document.getElementById('pageTitle').textContent = 'Insurance Policies';
  document.getElementById('pageSub').textContent = `${S.client.name} · ${S.policies.filter(p=>p.status==='Active').length} active policies`;
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-secondary btn-sm no-print" onclick="printClientReport('${cid}')">📄 Export PDF</button>
    <button class="btn btn-primary" onclick="openPolicyModal()">+ Add Policy</button>`;

  const activePolicies = S.policies.filter(p => p.status === 'Active');
  const totalCoverage = Object.values(getCoverageByType(activePolicies)).reduce((s, v) => s + v, 0);
  const totalPremium = S.policies.reduce((s, p) => s + (p.premium||0), 0);
  const byType = {};
  const expandedByType = getCoverageByType(S.policies);
  Object.entries(expandedByType).forEach(([type, curr]) => {
    if (!byType[type]) byType[type] = { curr: 0, rec: 0, policies: [] };
    byType[type].curr = curr;
  });
  S.policies.forEach(p => {
    // For recommended - still attach to the primary type
    const ptype = p.type || 'Other';
    if (!byType[ptype]) byType[ptype] = { curr: 0, rec: 0, policies: [] };
    byType[ptype].rec = Math.max(byType[ptype].rec, p.recommended||0);
    byType[ptype].policies.push(p);
  });
  const totalRec = Object.values(byType).reduce((s, v) => s + v.rec, 0);
  const gap = Math.max(0, totalRec - totalCoverage);
  const expiring = S.policies.filter(p => { const d = daysUntil(p.end_date); return d !== null && d >= 0 && d <= 90; });
  const clientAge = S.client.age || 30;

  document.getElementById('mainContent').innerHTML = `
    <div id="insuranceAlerts"></div>
    <div class="metrics-grid" id="insuranceMetrics"></div>
    <div class="chart-grid">
      <div class="card"><div class="card-header"><div class="card-title">📊 Coverage vs Recommended</div></div><div class="card-body"><div class="chart-wrap"><canvas id="chartCoverageComp"></canvas></div></div></div>
      <div class="card"><div class="card-header"><div class="card-title">📅 Coverage Timeline</div></div><div class="card-body" style="overflow-x:auto"><div id="coverageTimeline" style="min-width:500px"></div></div></div>
    </div>
    <div class="card" id="policySummaryCard"><div class="card-header"><div class="card-title">📊 Policy Summary</div></div><div class="card-body" id="policySummaryBody"></div></div>
    <div class="card"><div class="card-header"><div class="card-title">🛡️ All Policies</div></div><div id="policyList" class="card-body"></div></div>
    <div class="card" style="margin-top:20px"><div class="card-header"><div class="card-title">📋 Needs Analysis</div><div class="card-sub">Coverage gaps vs recommended - SG benchmarks</div></div><div id="needsAnalysisSection" class="card-body"><div class="empty"><div class="empty-icon">⏳</div><div class="empty-sub">Loading needs analysis...</div></div></div></div>
  `;

  document.getElementById('insuranceAlerts').innerHTML = [
    ...expiring.map(p => { const d = daysUntil(p.end_date); return `<div class="alert alert-${d<=30?'danger':'warning'}"><div class="alert-icon">⚠️</div><div class="alert-body"><strong>${esc(p.product_name)} expires ${d<=0?'today':`in ${d} days`}</strong>End date: ${fmtDate(p.end_date)}</div></div>`; }),
    ...Object.entries(byType).filter(([,d]) => d.rec > 0 && d.curr < d.rec * 0.6).map(([type, d]) => `<div class="alert alert-warning"><div class="alert-icon">⚠️</div><div class="alert-body"><strong>${esc(type)} coverage is below 60% of recommended</strong>Current: ${fmt(d.curr)} · Recommended: ${fmt(d.rec)} · Gap: ${fmt(d.rec-d.curr)}</div></div>`)
  ].join('');

  document.getElementById('insuranceMetrics').innerHTML = `
    <div class="metric"><div class="metric-accent" style="background:var(--primary)"></div><div class="metric-label">Total Coverage</div><div class="metric-value">${fmt(totalCoverage)}</div></div>
    <div class="metric"><div class="metric-accent" style="background:var(--success)"></div><div class="metric-label">Active Policies</div><div class="metric-value">${activePolicies.length}</div></div>
    <div class="metric"><div class="metric-accent" style="background:var(--warning)"></div><div class="metric-label">Annual Premium</div><div class="metric-value">${fmt(totalPremium)}</div><span class="metric-change neutral">${fmt(totalPremium/12)}/mo</span></div>
    <div class="metric"><div class="metric-accent" style="background:${gap>0?'var(--danger)':'var(--success)'}"></div><div class="metric-label">Coverage Gap</div><div class="metric-value">${fmt(gap)}</div><span class="metric-change ${gap>0?'down':'up'}">${gap>0?'⚠ Underinsured':'✓ Well covered'}</span></div>
  `;

  const types = Object.keys(byType);
  requestAnimationFrame(() => {
    if (types.length) mkChart('chartCoverageComp', {
      type: 'bar',
      data: {
        labels: types.map(t => t.length > 18 ? t.slice(0,16)+'…' : t),
        datasets: [
          { label: 'Current', data: types.map(t => byType[t].curr), backgroundColor: 'rgba(14,165,233,0.85)', borderRadius: 6, borderSkipped: false },
          { label: 'Recommended', data: types.map(t => byType[t].rec), backgroundColor: 'rgba(245,158,11,0.55)', borderRadius: 6, borderSkipped: false }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 400 },
        plugins: {
          legend: { position: 'top', labels: { font: { size: 11 }, padding: 12 } },
          tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 30 } },
          y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => v >= 1000000 ? `$${(v/1000000).toFixed(1)}M` : v >= 1000 ? `$${(v/1000).toFixed(0)}K` : `$${v}` } }
        }
      }
    });
  });

  const currentYear = new Date().getFullYear();
  const minAge = 20, maxAge = 100;
  const timedPolicies = S.policies.filter(p => p.start_date && p.end_date);
  document.getElementById('coverageTimeline').innerHTML = timedPolicies.length ? timedPolicies.map((p, i) => {
    const startAge = clientAge + (new Date(p.start_date).getFullYear() - currentYear);
    const endAge = clientAge + (new Date(p.end_date).getFullYear() - currentYear);
    const dur = endAge - startAge;
    const startPct = Math.max(0, ((startAge - minAge) / (maxAge - minAge)) * 100);
    const widthPct = Math.min(100 - startPct, (dur / (maxAge - minAge)) * 100);
    const nowPct = ((clientAge - minAge) / (maxAge - minAge)) * 100;
    const color = COLORS[i % COLORS.length];
    const barLabel = widthPct > 8 ? fmt(p.coverage) : '';
    return `<div class="timeline-row"><div class="timeline-meta"><span class="timeline-label" title="${esc(p.product_name||p.type)}">${esc(p.product_name||p.type)}</span><span class="timeline-dates">Age ${startAge}→${endAge} · ${fmt(p.coverage)}</span></div><div class="timeline-track"><div class="timeline-fill" style="left:${startPct}%;width:${widthPct}%;background:${color}">${barLabel}</div><div class="timeline-now" style="left:${nowPct}%"></div></div><div class="timeline-ages"><span>${minAge}</span><span style="font-weight:600;color:var(--danger)">Now (${clientAge})</span><span>${maxAge}</span></div></div>`;
  }).join('') : '<div class="empty"><div class="empty-sub">Add policies with start and end dates to see the coverage timeline</div></div>';

  // ── Policy Summary Card ──────────────────────────────────────────────────────
  const expiredCount = S.policies.filter(p => p.status !== 'Active').length;
  const totalAnnualPremium = S.policies.reduce((s, p) => s + (p.premium || 0), 0);
  document.getElementById('policySummaryBody').innerHTML = S.policies.length ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px">
      <div style="text-align:center;padding:12px;background:var(--surface-2);border-radius:var(--radius)">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Total Coverage</div>
        <div style="font-size:22px;font-weight:800;color:var(--primary);margin-top:4px">${fmt(totalCoverage)}</div>
      </div>
      <div style="text-align:center;padding:12px;background:var(--surface-2);border-radius:var(--radius)">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Annual Premium</div>
        <div style="font-size:22px;font-weight:800;color:var(--success);margin-top:4px">${fmt(totalAnnualPremium)}<span style="font-size:12px;font-weight:500">/yr</span></div>
      </div>
      <div style="text-align:center;padding:12px;background:var(--surface-2);border-radius:var(--radius)">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Active Policies</div>
        <div style="font-size:22px;font-weight:800;color:var(--text);margin-top:4px">${activePolicies.length}</div>
      </div>
      <div style="text-align:center;padding:12px;background:var(--surface-2);border-radius:var(--radius)">
        <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px">Expired / Lapsed</div>
        <div style="font-size:22px;font-weight:800;color:${expiredCount>0?'var(--danger)':'var(--text-3)'};margin-top:4px">${expiredCount}</div>
      </div>
    </div>` : '<div class="empty"><div class="empty-sub">No policies yet</div></div>';

  if (!S.policies.length) {
    document.getElementById('policyList').innerHTML = `<div class="empty"><div class="empty-icon">🛡️</div><div class="empty-title">No policies yet</div><div class="empty-sub">Add your first insurance policy</div><button class="btn btn-primary" onclick="openPolicyModal()">+ Add Policy</button></div>`;
    return;
  }
  const grouped = {};
  S.policies.forEach(p => { if (!grouped[p.type]) grouped[p.type] = []; grouped[p.type].push(p); });
  document.getElementById('policyList').innerHTML = Object.entries(grouped).map(([type, policies]) => {
    const total = policies.reduce((s, p) => s + (p.coverage||0), 0);
    const rec = Math.max(...policies.map(p => p.recommended||0));
    const gapAmt = Math.max(0, rec - total);
    const hasExpiring = policies.some(p => { const d = daysUntil(p.end_date); return d !== null && d >= 0 && d <= 90; });
    return `
      <div class="policy-group">
        <div class="policy-group-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
          <div><div class="policy-group-title">${esc(type)} ${hasExpiring ? '⚠️' : ''}</div><div style="font-size:12px;color:var(--text-3);margin-top:2px">${policies.length} ${policies.length===1?'policy':'policies'}</div></div>
          <div class="policy-group-meta">
            <div style="text-align:right"><div style="font-size:15px;font-weight:700">${fmt(total)}</div>${rec > 0 ? `<div style="font-size:11px;margin-top:2px;color:${gapAmt>0?'var(--warning)':'var(--success)'}">${gapAmt>0?`⚠ Gap: ${fmt(gapAmt)}`:'✓ Covered'}</div>` : ''}</div>
            <span style="color:var(--text-3);font-size:18px">›</span>
          </div>
        </div>
        <div class="policy-group-body">
          ${policies.map(p => {
            const exd = daysUntil(p.end_date);
            const expiringSoon = exd !== null && exd >= 0 && exd <= 90;
            return `
            <div class="policy-row" id="pr-${p.id}">
              <div class="policy-row-header">
                <div style="min-width:0;flex:1">
                  <div class="policy-row-name">${esc(p.product_name||p.type)}</div>
                  <div class="policy-row-meta">${esc(p.insurer)} · ${esc(p.product_type)}</div>
                  ${expiringSoon ? `<div style="font-size:11px;color:var(--danger);margin-top:2px;font-weight:500">⚠ Expires in ${exd} days (${fmtDate(p.end_date)})</div>` : ''}
                </div>
                <div class="policy-actions">
                  <span class="badge badge-${p.status==='Active'?'active':p.status==='Lapsed'?'lapsed':'gray'}">${esc(p.status)}</span>
                  <button class="btn btn-ghost btn-sm" onclick="openPolicyModal(${p.id})">✏️</button>
                  <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deletePolicy(${p.id})">🗑️</button>
                </div>
              </div>
              <div style="padding:12px 14px;background:var(--surface-2);border-radius:var(--radius);display:flex;flex-direction:column;gap:10px">
                ${(() => {
                  const items = Array.isArray(p.coverage_items) && p.coverage_items.length > 0 ? p.coverage_items : (p.coverage > 0 ? [{ type: p.type || 'Coverage', coverage: p.coverage }] : []);
                  const coverageHTML = items.length > 0
                    ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">Coverage Types</div><div style="display:flex;flex-wrap:wrap;gap:6px">${items.map(ci => `<div style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 10px"><span style="font-size:12px;color:var(--text-2)">${esc(ci.type)}</span><span style="font-size:13px;font-weight:700;color:var(--text-1)">${fmt(ci.coverage)}</span></div>`).join('')}</div><div style="margin-top:6px;font-size:12px;color:var(--text-3)">Total: <strong style="color:var(--text-1)">${fmt(p.coverage)}</strong></div></div>`
                    : '';
                  return coverageHTML;
                })()}
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px">
                  <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px">Annual Premium</div><div style="font-size:16px;font-weight:700">${fmt(p.premium)}</div><div style="font-size:11px;color:var(--text-3)">${fmt((p.premium||0)/12)}/mo · <strong>${p.payment_frequency||'annual'}</strong></div>${(p.cpf_medisave_amount||0)>0||((p.cash_amount||0)>0)?`<div style="margin-top:4px;font-size:11px;color:var(--text-3)">CPF Medisave: <strong>${fmt(p.cpf_medisave_amount||0)}</strong> · Cash: <strong>${fmt(p.cash_amount||0)}</strong></div>`:''}</div>
                  <div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px">Period</div><div style="font-size:13px;font-weight:500">${fmtDate(p.start_date)}</div><div style="font-size:11px;color:var(--text-3)">→ ${fmtDate(p.end_date)}</div></div>
                  ${p.recommended > 0 ? `<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:4px">Recommended</div><div style="font-size:16px;font-weight:700">${fmt(p.recommended)}</div></div>` : ''}
                </div>
              </div>
              ${p.recommended > 0 ? `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-bottom:4px"><span>Coverage vs recommended</span><span>${Math.min(100,Math.round((p.coverage||0)/(p.recommended)*100))}%</span></div><div class="progress"><div class="progress-bar" style="width:${Math.min(100,Math.round((p.coverage||0)/p.recommended*100))}%;background:${(p.coverage||0)>=p.recommended?'var(--success)':(p.coverage||0)>=p.recommended*0.6?'var(--warning)':'var(--danger)'}"></div></div></div>` : ''}
              ${p.notes ? `<div style="margin-top:10px;font-size:12px;color:var(--text-3);font-style:italic">${esc(p.notes)}</div>` : ''}
              ${coverageChecklistHTML(p)}
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
  // Load needs analysis section
  const _cid = S.viewClientId || S.user?.id;
  loadNeedsAnalysis(_cid);
}

// ── Needs Analysis Section ───────────────────────────────────────────────────
const NEEDS_COVERAGE_TYPES = ['Death / Life','Early CI','Late Stage CI','TPD','Hospital / IP','Disability Income','Personal Accident'];
const NEEDS_SOURCES = [
  { label: 'MAS Insurance', url: 'https://www.mas.gov.sg/regulation/insurance' },
  { label: 'CPF Retirement', url: 'https://www.cpf.gov.sg/member/retirement-income' },
  { label: 'MOH Cost & Financing', url: 'https://www.moh.gov.sg/cost-financing' },
  { label: 'LIA Singapore', url: 'https://www.lia.org.sg/media/' },
  { label: 'MoneySense', url: 'https://www.moneysense.gov.sg/' },
];

async function loadNeedsAnalysis(clientId) {
  try {
    const [needsData] = await Promise.all([
      api.get(`/clients/${clientId}/needs-analysis`)
    ]);
    const naMap = {};
    needsData.forEach(n => { naMap[n.coverage_type] = n; });

    // Auto-compute current coverage from policies
    const covByType = getCoverageByType(S.policies);
    const covMap = {
      'Death / Life': (covByType['Death / Life']||0) + (covByType['Term Life']||0) + (covByType['Whole Life']||0),
      'Early CI': (covByType['Early Critical Illness']||0) + (covByType['Early CI']||0),
      'Late Stage CI': (covByType['Late Stage Critical Illness']||0) + (covByType['Standalone CI']||0),
      'TPD': covByType['TPD']||0,
      'Hospital / IP': (covByType['Hospitalization']||0) + (covByType['Hospital / IP']||0) + (covByType['Medical']||0),
      'Disability Income': covByType['Disability Income']||0,
      'Personal Accident': (covByType['Accident']||0) + (covByType['Personal Accident']||0),
    };

    const el = document.getElementById('needsAnalysisSection');
    if (!el) return;

    el.innerHTML = `
      <div class="alert alert-info" style="margin-bottom:16px"><div class="alert-icon">i️</div><div class="alert-body"><strong>Needs Analysis</strong>Set recommended coverage amounts, track current coverage, and document gaps with rationale. Saves automatically per coverage type.</div></div>
      <div style="display:flex;flex-direction:column;gap:12px" id="needs-rows">
        ${NEEDS_COVERAGE_TYPES.map(ct => {
          const existing = naMap[ct] || {};
          const current = covMap[ct] || (existing.current_amount || 0);
          const rec = existing.recommended_amount || 0;
          const gap = Math.max(0, rec - current);
          const priority = existing.priority || 'medium';
          const pColors = { critical: '#EF4444', high: '#F97316', medium: '#F59E0B', low: '#10B981' };
          return `
          <div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;background:var(--surface)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
              <div style="font-size:14px;font-weight:600">${esc(ct)}</div>
              <select id="na-priority-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" style="padding:4px 8px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:12px;color:${pColors[priority]}">
                <option value="critical" ${priority==='critical'?'selected':''} style="color:#EF4444">🔴 Critical</option>
                <option value="high" ${priority==='high'?'selected':''} style="color:#F97316">🟠 High</option>
                <option value="medium" ${priority==='medium'?'selected':''} style="color:#F59E0B">🟡 Medium</option>
                <option value="low" ${priority==='low'?'selected':''} style="color:#10B981">🟢 Low</option>
              </select>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">
              <div class="field" style="margin:0">
                <label>Recommended (S$)</label>
                <input type="number" id="na-rec-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" value="${rec||''}" placeholder="0" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:13px;width:100%" oninput="updateNeedsGap('${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}','${esc(ct)}')">
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">Current (from policies)</div>
                <div style="font-size:18px;font-weight:700;padding:8px 12px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border)">${fmt(current)}</div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">Gap</div>
                <div id="na-gap-display-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" style="font-size:18px;font-weight:700;padding:8px 12px;background:${gap>0?'var(--danger-light)':'var(--success-light)'};border-radius:var(--radius);border:1px solid ${gap>0?'rgba(239,68,68,0.3)':'rgba(16,185,129,0.3)'};color:${gap>0?'var(--danger)':'var(--success)'}">${gap>0?fmt(gap):'✓ Covered'}</div>
              </div>
            </div>
            <div class="field" style="margin-bottom:10px">
              <label>Rationale / Notes</label>
              <textarea id="na-rationale-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" rows="2" style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:13px;resize:vertical" placeholder="e.g. Client has 2 dependents, income replacement 10x recommended...">${esc(existing.rationale||'')}</textarea>
            </div>
            <div style="margin-bottom:12px">
              <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:6px">📚 Reference Sources</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${NEEDS_SOURCES.map(s => `<a href="${s.url}" target="_blank" rel="noopener" style="font-size:11px;padding:3px 8px;border-radius:99px;background:var(--primary-light);color:var(--primary);text-decoration:none;border:1px solid rgba(14,165,233,0.3)">${esc(s.label)} ↗</a>`).join('')}
              </div>
            </div>
            <input type="hidden" id="na-current-${esc(ct.replace(/ \//g,'').replace(/ /g,'-'))}" value="${current}">
            <button class="btn btn-primary btn-sm" onclick="saveNeedsAnalysis('${clientId}','${esc(ct)}')">💾 Save ${esc(ct)}</button>
          </div>`;
        }).join('')}
      </div>`;
  } catch(e) { console.warn('Needs analysis load failed:', e); }
}

function updateNeedsGap(key, ct) {
  const recEl = document.getElementById(`na-rec-${key}`);
  const curEl = document.getElementById(`na-current-${key}`);
  const gapEl = document.getElementById(`na-gap-display-${key}`);
  if (!recEl || !curEl || !gapEl) return;
  const rec = parseFloat(recEl.value) || 0;
  const cur = parseFloat(curEl.value) || 0;
  const gap = Math.max(0, rec - cur);
  gapEl.textContent = gap > 0 ? 'S$' + gap.toLocaleString('en-SG') : '✓ Covered';
  gapEl.style.background = gap > 0 ? 'var(--danger-light)' : 'var(--success-light)';
  gapEl.style.color = gap > 0 ? 'var(--danger)' : 'var(--success)';
  gapEl.style.borderColor = gap > 0 ? 'rgba(239,68,68,0.3)' : 'rgba(16,185,129,0.3)';
}

async function saveNeedsAnalysis(clientId, ct) {
  const key = ct.replace(/ \//g,'').replace(/ /g,'-');
  const rec = parseFloat(document.getElementById(`na-rec-${key}`)?.value) || 0;
  const cur = parseFloat(document.getElementById(`na-current-${key}`)?.value) || 0;
  const gap = Math.max(0, rec - cur);
  const rationale = document.getElementById(`na-rationale-${key}`)?.value || '';
  const priority = document.getElementById(`na-priority-${key}`)?.value || 'medium';
  try {
    await api.post(`/clients/${clientId}/needs-analysis`, {
      coverage_type: ct, recommended_amount: rec, current_amount: cur,
      gap, rationale, priority, sources: NEEDS_SOURCES.map(s => s.url)
    });
    toast(`${ct} saved ✅`);
  } catch(e) { toast(e.message, 'error'); }
}

// ── Investments ────────────────────────────────────────────────────────────────
// DCA entries state: { [investmentId]: [entries] }
const _dcaCache = {};

async function loadDcaEntries(invId) {
  const cid = S.viewClientId || S.user?.id;
  try {
    const entries = await api.get(`/clients/${cid}/investments/${invId}/dca`);
    _dcaCache[invId] = entries;
  } catch(e) {
    _dcaCache[invId] = [];
  }
}

function toggleDcaHistory(invId) {
  const el = document.getElementById(`dca-history-${invId}`);
  const btn = document.getElementById(`dca-toggle-${invId}`);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  if (isHidden) {
    el.style.display = 'block';
    renderDcaHistory(invId);
    if (btn) btn.textContent = '📋 Hide History';
  } else {
    el.style.display = 'none';
    if (btn) btn.textContent = '📋 DCA History';
  }
}

function renderDcaHistory(invId) {
  const el = document.getElementById(`dca-history-${invId}`);
  if (!el) return;
  const entries = _dcaCache[invId] || [];
  
  if (!entries.length) {
    el.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">No DCA entries yet. Click "+ Add DCA Entry" to start tracking.</div>`;
    return;
  }
  
  const sorted = [...entries].sort((a, b) => a.entry_date.localeCompare(b.entry_date));
  let runTotal = 0, runUnits = 0;
  
  const rows = sorted.map((e, idx) => {
    runTotal += (e.amount || 0);
    runUnits += (e.units || 0);
    const runAvg = runUnits > 0 ? runTotal / runUnits : 0;
    return `<tr>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border)">${fmtDate(e.entry_date)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;font-weight:600">${fmt(e.amount)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right">${e.units > 0 ? e.units.toFixed(4) : '—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right">${e.nav > 0 ? 'S$'+e.nav.toFixed(4) : '—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--text-3)">${runAvg > 0 ? 'S$'+runAvg.toFixed(4) : '—'}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;font-weight:600">${fmt(runTotal)}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:center">
        <button class="btn btn-ghost btn-sm" onclick="openDcaEntryModal(${invId}, ${e.id})" style="padding:3px 8px">✏️</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);padding:3px 8px" onclick="deleteDcaEntry(${invId}, ${e.id})">🗑️</button>
      </td>
    </tr>`;
  }).join('');
  
  el.innerHTML = `<div style="overflow-x:auto;margin-bottom:8px">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--surface-2)">
        <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Date</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Amount</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Units</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">NAV</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Avg Cost</th>
        <th style="padding:8px 10px;text-align:right;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Running Total</th>
        <th style="padding:8px 10px;text-align:center;font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px">Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr style="background:var(--surface-2);font-weight:700">
        <td style="padding:8px 10px">Total (${entries.length} entries)</td>
        <td style="padding:8px 10px;text-align:right">${fmt(runTotal)}</td>
        <td style="padding:8px 10px;text-align:right">${runUnits > 0 ? runUnits.toFixed(4) : '—'}</td>
        <td></td>
        <td style="padding:8px 10px;text-align:right">${runUnits > 0 && runTotal > 0 ? 'S$'+(runTotal/runUnits).toFixed(4) : '—'}</td>
        <td></td><td></td>
      </tr></tfoot>
    </table>
  </div>`;
}

function openDcaEntryModal(invId, entryId) {
  const existing = entryId ? (_dcaCache[invId] || []).find(e => e.id === entryId) : null;
  const today = new Date().toISOString().split('T')[0];
  const html = `<div class="form-grid">
    <div class="field"><label>Entry Date *</label><input id="dca-date" type="date" value="${existing?.entry_date || today}"></div>
    <div class="field"><label>Amount Invested (S$)</label><input id="dca-amount" type="number" value="${existing?.amount || ''}" placeholder="500" step="0.01"></div>
    <div class="field"><label>Units Purchased</label><input id="dca-units" type="number" value="${existing?.units || ''}" placeholder="312.50" step="0.0001"></div>
    <div class="field"><label>NAV at Purchase (S$)</label><input id="dca-nav" type="number" value="${existing?.nav || ''}" placeholder="1.600" step="0.0001"></div>
    <div class="field" style="grid-column:1/-1"><label>Notes</label><input id="dca-notes" type="text" value="${esc(existing?.notes || '')}" placeholder="Jan 2024 monthly RSP"></div>
  </div>`;
  
  showModal(existing ? 'Edit DCA Entry' : 'Add DCA Entry', html, async () => {
    const body = {
      entry_date: document.getElementById('dca-date')?.value || today,
      amount: parseFloat(document.getElementById('dca-amount')?.value) || 0,
      units: parseFloat(document.getElementById('dca-units')?.value) || 0,
      nav: parseFloat(document.getElementById('dca-nav')?.value) || 0,
      notes: document.getElementById('dca-notes')?.value || '',
    };
    const cid = S.viewClientId || S.user?.id;
    try {
      if (existing) {
        await api.put(`/clients/${cid}/investments/${invId}/dca/${entryId}`, body);
        toast('Entry updated');
      } else {
        await api.post(`/clients/${cid}/investments/${invId}/dca`, body);
        toast('DCA entry added ✅');
      }
      await loadDcaEntries(invId);
      const updatedInv = await api.get(`/clients/${cid}/investments`);
      S.investments = updatedInv;
      renderDcaHistory(invId);
      closeModal();
    } catch(e) { toast(e.message, 'error'); return false; }
  });
}

async function deleteDcaEntry(invId, entryId) {
  if (!confirm('Delete this DCA entry?')) return;
  const cid = S.viewClientId || S.user?.id;
  try {
    await api.del(`/clients/${cid}/investments/${invId}/dca/${entryId}`);
    await loadDcaEntries(invId);
    const updatedInv = await api.get(`/clients/${cid}/investments`);
    S.investments = updatedInv;
    renderDcaHistory(invId);
    toast('Entry deleted');
  } catch(e) { toast(e.message, 'error'); }
}

function renderGrowthChart() {
  const rate = parseFloat(document.getElementById('growthRateSelect')?.value || '0.06');
  const totalYears = parseInt(document.getElementById('growthYearsSelect')?.value || '15');
  const yr = new Date().getFullYear();
  const labels = Array.from({ length: totalYears + 1 }, (_, i) => yr + i);
  
  mkChart('chartGrowth', {
    type: 'line',
    data: { labels, datasets: S.investments.map((inv, idx) => ({
      label: inv.name,
      borderColor: COLORS[idx % COLORS.length],
      backgroundColor: COLORS[idx % COLORS.length] + '18',
      fill: false, tension: 0.4, borderWidth: 2.5, pointRadius: 3,
      data: labels.map((_, y) => {
        const r = rate;
        const p = inv.value_now || 0;
        if (inv.premium_type === 'single') {
          return Math.round(p * Math.pow(1 + r, y));
        } else {
          const freq = inv.payment_frequency || 'monthly';
          const perYear = FREQ_PER_YEAR[freq] || 12;
          const monthlyEquiv = (inv.contribution || 0) * perYear / 12;
          const monthlyR = r / 12;
          const months = y * 12;
          if (monthlyR === 0) return Math.round(p + monthlyEquiv * months);
          const pFinal = p * Math.pow(1 + monthlyR, months);
          const cFinal = monthlyEquiv * (Math.pow(1 + monthlyR, months) - 1) / monthlyR;
          return Math.round(pFinal + cFinal);
        }
      })
    })) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { callback: v => fmt(v) } } }
    }
  });
}

function calcInterest(id, type) {
  const p = parseFloat(document.getElementById(`cp-${id}`)?.value)||0;
  const r = (parseFloat(document.getElementById(`cr-${id}`)?.value)||0)/100;
  const y = parseFloat(document.getElementById(`cy-${id}`)?.value)||0;
  const c = parseFloat(document.getElementById(`cc-${id}`)?.value)||0;
  const contributed = p + c * y;
  let final, interest;
  if (type === 'simple') {
    interest = p*r*y + c*y*r*(y/2);
    final = contributed + interest;
  } else {
    const pFinal = p * Math.pow(1+r, y);
    const cFinal = r > 0 ? c * (Math.pow(1+r, y) - 1) / r : c * y;
    final = pFinal + cFinal;
    interest = final - contributed;
  }
  const res = document.getElementById(`cres-${id}`);
  if (!res) return;
  res.classList.remove('hidden');
  document.getElementById(`ct-${id}`).textContent = type === 'simple' ? 'Simple Interest' : 'Compound (Annual)';
  document.getElementById(`cti-${id}`).textContent = fmt(contributed);
  document.getElementById(`ci-${id}`).textContent = fmt(interest);
  document.getElementById(`cf-${id}`).textContent = fmt(final);
}

function calcDcaCompound(id, freq) {
  const p = parseFloat(document.getElementById(`cp-${id}`)?.value)||0;
  const r = (parseFloat(document.getElementById(`cr-${id}`)?.value)||0)/100;
  const y = parseFloat(document.getElementById(`cy-${id}`)?.value)||0;
  const c = parseFloat(document.getElementById(`cc-${id}`)?.value)||0;
  const perYear = FREQ_PER_YEAR[freq] || 12;
  const monthlyEquiv = c * perYear / 12;
  const monthlyR = r / 12;
  const months = y * 12;
  
  let final;
  if (monthlyR === 0) {
    final = p + monthlyEquiv * months;
  } else {
    const pFinal = p * Math.pow(1 + monthlyR, months);
    const cFinal = monthlyEquiv * (Math.pow(1 + monthlyR, months) - 1) / monthlyR;
    final = pFinal + cFinal;
  }
  const totalContributed = p + c * perYear * y;
  const interest = final - totalContributed;
  
  const res = document.getElementById(`cres-${id}`);
  if (!res) return;
  res.classList.remove('hidden');
  document.getElementById(`cti-${id}`).textContent = fmt(totalContributed);
  document.getElementById(`ci-${id}`).textContent = fmt(interest);
  document.getElementById(`cf-${id}`).textContent = fmt(final);
  document.getElementById(`ct-${id}`).textContent = fmt(monthlyEquiv) + '/mo equiv';
}

async function loadInvestmentProjection(invId) {

// Render the coverage checklist HTML for a policy row (view mode)
function coverageChecklistHTML(policy) {
  const opts = getCoverageOptions(policy.product_type);
  if (!opts.length) return '';
  // Feature flags live in localStorage; never touch coverage_items (which holds {type,coverage} amounts)
  const flags = _getFlags(policy.id);
  const checkedSet = new Set(flags);
  const total = opts.length;
  const checkedCount = opts.filter(o => checkedSet.has(o.id)).length;
  const badgeColor = checkedCount === 0 ? 'var(--text-3)' : checkedCount === total ? 'var(--success)' : 'var(--primary)';

  return `
    <div class="coverage-checklist">
      <div class="coverage-checklist-header" onclick="toggleChecklist('cl-${policy.id}')">
        <div class="coverage-checklist-title">
          🛡️ Coverage Breakdown
          <span class="coverage-checklist-badge" style="background:${checkedColor(checkedCount,total)};color:#fff">${checkedCount}/${total} covered</span>
        </div>
        <span style="color:var(--text-3);font-size:12px">▾</span>
      </div>
      <div id="cl-${policy.id}" class="coverage-checklist-body hidden">
        ${opts.map(opt => `
          <label class="coverage-item" onclick="saveCoverageItem(${policy.id}, '${opt.id}', this)">
            <input type="checkbox" ${checkedSet.has(opt.id) ? 'checked' : ''} onclick="event.stopPropagation();saveCoverageItem(${policy.id}, '${opt.id}', this.closest('.coverage-item'))">
            <span class="coverage-item-label ${checkedSet.has(opt.id) ? 'checked' : ''}">${esc(opt.label)}</span>
            <span class="coverage-item-tag" style="background:${tagColor(opt.tag)}">${opt.tag}</span>
          </label>`).join('')}
      </div>
    </div>`;
}

function checkedColor(n, total) {
  if (n === 0) return '#94A3B8';
  if (n === total) return '#10B981';
  return '#0EA5E9';
}

function tagColor(tag) {
  if (tag === 'core') return 'rgba(239,68,68,0.12)';
  if (tag === 'add-on') return 'rgba(245,158,11,0.12)';
  return 'rgba(139,92,246,0.12)';
}

function toggleChecklist(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden');
}

// Feature-flag checklist stored in localStorage (never touches coverage_items amounts)
function _featureKey(policyId) { return `pf_${policyId}`; }
function _getFlags(policyId) {
  try { return JSON.parse(localStorage.getItem(_featureKey(policyId)) || '[]'); } catch { return []; }
}
function _setFlags(policyId, flags) {
  localStorage.setItem(_featureKey(policyId), JSON.stringify(flags));
}

function saveCoverageItem(policyId, itemId, labelEl) {
  const checkbox = labelEl.querySelector('input[type=checkbox]');
  const textEl = labelEl.querySelector('.coverage-item-label');
  const isChecked = checkbox.checked;

  // Update UI instantly
  if (textEl) { if (isChecked) textEl.classList.add('checked'); else textEl.classList.remove('checked'); }

  // Persist feature flags to localStorage only — never overwrite coverage_items amounts
  let flags = _getFlags(policyId);
  if (isChecked) { if (!flags.includes(itemId)) flags.push(itemId); }
  else { flags = flags.filter(i => i !== itemId); }
  _setFlags(policyId, flags);

  // Update badge
  const policy = S.policies.find(p => p.id === policyId);
  const opts = policy ? getCoverageOptions(policy.product_type) : [];
  const checkedSet = new Set(flags);
  const n = opts.filter(o => checkedSet.has(o.id)).length;
  const badge = labelEl.closest('.coverage-checklist')?.querySelector('.coverage-checklist-badge');
  if (badge) { badge.textContent = `${n}/${opts.length} covered`; badge.style.background = checkedColor(n, opts.length); }
}

        }).join('')}

    </div>`;
}

function bindCoverageChecklist() {
  document.querySelectorAll('.cov-chk').forEach(chk => {
    chk.addEventListener('change', () => {
      const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
      if (amt) {
        amt.disabled = !chk.checked;
        amt.style.background = chk.checked ? 'var(--surface-2)' : 'var(--surface-3)';
        if (!chk.checked) amt.value = '';
      }
      updateCoverageTotal();
    });
  });
  document.querySelectorAll('.cov-amt').forEach(amt => {
    amt.addEventListener('input', updateCoverageTotal);
  });
}

function updateCoverageTotal() {
  let total = 0;
  document.querySelectorAll('.cov-chk:checked').forEach(chk => {
    const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
    total += parseFloat(amt?.value) || 0;
  });
  const el = document.getElementById('coverage-total');
  if (el) el.textContent = 'S$ ' + total.toLocaleString();
}

function getCoverageItems() {
  const items = [];
  document.querySelectorAll('.cov-chk:checked').forEach(chk => {
    const amt = document.querySelector(`.cov-amt[data-type="${chk.dataset.type}"]`);
    items.push({ type: chk.dataset.type, coverage: parseFloat(amt?.value) || 0 });
  });
  return items;
}

// INVESTOR PROFILE - Equal Weight Risk Scoring (20% each factor)
// Data: MAS 2024 · CPF Board 2025 · SingStat HES 2024 · MOH 2024
// ══════════════════════════════════════════════════════════════════════
function classifyInvestor(client, policies, investments) {
  const age=client.age||30, inc=client.annual_income||50000, deps=client.dependents||0;
  const occ=(client.occupation||"").toLowerCase();
  const invValue=investments.reduce((s,i)=>s+(i.value_now||0),0);
  const totalPremium=policies.filter(p=>p.status==='Active').reduce((s,p)=>s+(p.premium||0),0);
  const ytr=Math.max(0,65-age);

  // Factor 1: Time horizon (years to retire / 5, capped 1-5)
  const time_sc=Math.min(5,Math.max(1,Math.floor(ytr/5)));
  // Factor 2: Income stability (stable profession = 4, else 3)
  const stable=/engineer|doctor|lawyer|accountant|civil|teacher|manager|analyst|director|vp/.test(occ);
  const inc_sc=stable?4:3;
  // Factor 3: Dependents (more deps = more conservative)
  const dep_sc=Math.max(1,4-deps);
  // Factor 4: Investment maturity
  const inv_sc=Math.min(5,1+(invValue>50000?1:0)+(invValue>150000?1:0)+(investments.length>2?1:0));
  // Factor 5: Coverage adequacy (from health score)
  const hs=calcHealthScore(policies,investments,client);
  const cov_sc=hs.score>=80?5:hs.score>=60?4:hs.score>=40?3:hs.score>=20?2:1;

  // EQUAL WEIGHT: each factor = 20%
  const risk_score=(time_sc+inc_sc+dep_sc+inv_sc+cov_sc)/5;
  const risk_level=Math.max(1,Math.min(5,Math.round(risk_score)));
  const rl_names={1:'Very Conservative',2:'Conservative',3:'Moderate',4:'Growth',5:'Aggressive'};
  const rl_colors={1:'#10B981',2:'#0EA5E9',3:'#F59E0B',4:'#8B5CF6',5:'#EF4444'};

  // Life stage classification (SingStat age brackets)
  const ls=age<28?{l:1,n:'Early Career',c:'#10B981',tip:'⚡ Maximum compounding window - start now'}
         :age<35?{l:2,n:'Young Professional',c:'#0EA5E9',tip:'📈 Aggressive growth phase'}
         :age<45?{l:3,n:'Family Builder',c:'#F59E0B',tip:'⚖️ Balance growth and protection'}
         :age<55?{l:4,n:'Wealth Accumulator',c:'#8B5CF6',tip:'🎯 Peak earning years - maximise contributions'}
                :{l:5,n:'Pre-Retiree / Legacy',c:'#EF4444',tip:'🏖️ Shift to income focus'};

  // Income tier (MAS income bands)
  const it=inc<48000?{l:1,n:'Entry (<$4K/mo)',c:'#94A3B8',tip:'Start $12-18K/yr · scale up over time'}
          :inc<72000?{l:2,n:'Mid ($4-6K/mo)',c:'#10B981',tip:'$18-24K/yr is your sweet spot'}
          :inc<108000?{l:3,n:'Senior ($6-9K/mo)',c:'#F59E0B',tip:'$24-36K/yr + max SRS $15,300'}
          :inc<150000?{l:4,n:'High ($9-12.5K/mo)',c:'#8B5CF6',tip:'$36K+/yr + SRS + consider hybrid strategy'}
                    :{l:5,n:'HNW ($12.5K+/mo)',c:'#F59E0B',tip:'SP lump sum + RP hybrid recommended'};

  const protLbls={1:'Critical Gaps',2:'Underinsured',3:'Partially Covered',4:'Well Protected',5:'Fully Optimised'};
  const protColors={1:'#EF4444',2:'#EA580C',3:'#F59E0B',4:'#0EA5E9',5:'#10B981'};
  const invLbls=[null,'Not Started','Getting Started (<$50K)','Building ($50-150K)','Growing ($150-500K)','Established ($500K+)'];
  const invColors=[null,'#EF4444','#EA580C','#F59E0B','#0EA5E9','#10B981'];

  // Scenario matching (8 investor types)
  const SCENARIOS=[
    {e:'👨‍💼',n:'Young Professional',c:age<=35&&deps===0,t:'$500-800/mo by age 50',a:'PVW II · $12-18K/yr × 10yr · Global Tech + SG Growth'},
    {e:'👨‍👩‍👧',n:'Family Protector',c:deps>0&&age<45,t:'$1.5-2.5K/mo by age 50',a:'PVW II · $24K/yr × 10yr · SG Managed + US Dividend'},
    {e:'💎',n:'HNW Lump Sum',c:invValue>150000||inc>150000,t:'Deploy lump sum → $2-5K/mo',a:'PVA SP · $200-500K · SG Managed + Multi-Asset'},
    {e:'🏖️',n:'Retirement Planner',c:age>=45&&ytr<=20,t:'$2-4K/mo by age 65',a:'PVA II · $36K/yr × 5yr · Conservative'},
    {e:'⛵',n:'Semi-Retirement',c:age>=30&&age<50&&inc>=80000,t:'$2K/mo by age 55',a:'PVW II · $30K/yr × 10yr · Balanced'},
    {e:'🏢',n:'Business Owner',c:inc>120000,t:'$3K/mo + tax relief',a:'PVW II via SRS · $15,300/yr × 10yr'},
    {e:'🔗',n:'Hybrid Strategist',c:invValue>100000&&inc>=80000,t:'Self-funding by Year 8',a:'PVA SP $200K + PVW II $24K/yr'},
    {e:'🛡️',n:'Conservative Saver',c:true,t:'$700-1K/mo low risk',a:'PVA II · $18K/yr × 10yr · Multi-Asset'},
  ];
  const matched=SCENARIOS.filter(s=>s.c);
  const primary=matched[0]||SCENARIOS[7], secondary=matched.slice(1,3);

  // Goal readiness (reverse-engineered from SG data)
  const goals=[
    {g:'🏖️ Retire at 65 · $3K/mo',n:47412},
    {g:'🔓 Financial Freedom · $5K/mo',n:71986},
    {g:'⛵ Semi-Retire at 55 · $2K/mo',n:30393},
    {g:'💰 CPF Top-Up · $1.5K/mo',n:53353},
    {g:'🎓 University Fund · $2K/mo',n:70716},
  ].map(g=>{
    const pct=Math.min(100,Math.round(totalPremium/g.n*100));
    const lvl=totalPremium>=g.n?5:totalPremium>=g.n*.7?4:totalPremium>=g.n*.4?3:totalPremium>0?2:1;
    return{...g,pct,lvl};
  });

  return{risk_score:Math.round(risk_score*100)/100,risk_level,risk_label:rl_names[risk_level],risk_color:rl_colors[risk_level],
    rc:{time_sc,inc_sc,dep_sc,inv_sc,cov_sc},ls,it,
    protLevel:cov_sc,protLabel:protLbls[cov_sc],protColor:protColors[cov_sc],
    invLevel:inv_sc,invLabel:invLbls[inv_sc],invColor:invColors[inv_sc],
    healthScore:hs.score,primary,secondary,goals,totalPremium};
}

function _bar(level,color,max=5){
  return `<div style="height:6px;background:#E2E8F0;border-radius:99px;margin-top:5px"><div style="height:100%;width:${level/max*100}%;background:${color};border-radius:99px;transition:width .6s ease"></div></div>`;
}

async function saveProfileEdits(clientId) {
  const btn = document.getElementById('saveProfileBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
  const body = {
    name: S.client.name,
    age: parseInt(document.getElementById('pe-age').value) || 0,
    gender: document.getElementById('pe-gender').value,

    annual_income: parseFloat(document.getElementById('pe-income').value) || 0,
    dependents: parseInt(document.getElementById('pe-dependents').value) || 0,

  try {
    await api.put(`/admin/clients/${clientId}`, body);

    if (btn) { btn.disabled = false; btn.textContent = '💾 Save Changes'; }

const DEAL_STAGES = ['Prospect','Contacted','Proposal Sent','Negotiation','Closed Won','Closed Lost'];
const STAGE_COLORS = {'Prospect':'#94A3B8','Contacted':'#0EA5E9','Proposal Sent':'#F59E0B','Negotiation':'#8B5CF6','Closed Won':'#10B981','Closed Lost':'#EF4444'};

async function renderAdminPipeline() {
  hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Deal Pipeline';
  document.getElementById('pageSub').textContent = 'Track prospects from first contact to closed';

    const data = await api.get('/pipeline');
    const board = document.getElementById('pipeline-board');
    DEAL_STAGES.forEach(stage => {

      const color = STAGE_COLORS[stage];
      const col = document.createElement('div');
      col.style.cssText = 'min-width:220px;flex-shrink:0';
      const cards = clients.map(c => `
        <div onclick="openClientView('${c.id}','${esc(c.name)}')" style="background:white;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:1px solid #E2E8F0" onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.1)'" onmouseout="this.style.boxShadow='none'">
          <div style="font-size:13px;font-weight:600;color:#0F172A;margin-bottom:3px">${esc(c.name)}</div>
          <div style="font-size:11px;color:#64748B">${fmt(c.annual_income||0)}/yr · Age ${c.age||'-'}</div>
          ${c.next_action ? `<div style="font-size:10px;color:#0EA5E9;margin-top:4px;font-weight:500">→ ${esc(c.next_action)}</div>` : ''}
          ${c.last_contact ? `<div style="font-size:10px;color:#94A3B8;margin-top:2px">Last: ${esc(c.last_contact)}</div>` : ''}
          <div onclick="event.stopPropagation()" style="margin-top:8px">
            <select onchange="updateDealStage('${c.id}',this.value)" style="font-size:11px;padding:3px 6px;border:1px solid #E2E8F0;border-radius:5px;width:100%;cursor:pointer">
              ${DEAL_STAGES.map(s => `<option ${s===stage?'selected':''}>${s}</option>`).join('')}

          </div>
        </div>`).join('');
      col.innerHTML = `<div style="background:${color}18;border:1px solid ${color}40;border-radius:10px;overflow:hidden">

      </div>`;
      board.appendChild(col);
    });
  } catch(e) { toast(e.message, 'error'); }
}

async function updateDealStage(clientId, stage) {
  try {
    await api._req('PATCH', `/clients/${clientId}/notes`, { deal_stage: stage });
    toast('Moved to ' + stage);
    navTo('adminPipeline');
  } catch(e) { toast(e.message, 'error'); }
}

// ── ADMIN PROSPECTS ──────────────────────────────────────────────────────────
async function renderAdminProspects() {
  hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Prospects';
  document.getElementById('pageSub').textContent = 'Pipeline management & conversion tracking';
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-primary" onclick="openProspectModal()">➕ Add Prospect</button>`;
  document.getElementById('mainContent').innerHTML = '<div class="skeleton" style="height:200px"></div>';
  try {
    const clients = await api.get('/admin/clients');
    const prospects = clients.filter(c => c.role === 'prospect');
    const thirtyDaysAgo = new Date(Date.now() - 30*24*3600*1000);
    const converted = clients.filter(c => c.role === 'client' && c.converted_at && new Date(c.converted_at) > thirtyDaysAgo);
    const convRate = prospects.length > 0 ? Math.round(converted.length / (prospects.length + converted.length) * 100) : 0;
    const badge = document.getElementById('prospectsCount');
    if (badge && prospects.length) { badge.textContent = prospects.length; badge.classList.remove('hidden'); }
    const stages = ['New','Contacted','Meeting Set','Proposal Sent','Cold'];
    const stageCounts = {};
    stages.forEach(s => stageCounts[s] = 0);
    prospects.forEach(p => {
      const st = p.deal_stage || 'New';
      if (stageCounts[st] !== undefined) stageCounts[st]++;
      else if (st === 'Prospect') stageCounts['New']++;
    });
    document.getElementById('mainContent').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px">
        <div class="metric"><div class="metric-accent" style="background:var(--primary)"></div><div class="metric-label">Total Prospects</div><div class="metric-value">${prospects.length}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--success)"></div><div class="metric-label">Converted (30d)</div><div class="metric-value">${converted.length}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--purple)"></div><div class="metric-label">Conversion Rate</div><div class="metric-value">${convRate}%</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px">
        ${stages.map(st => `<div class="card" style="padding:14px;text-align:center"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:8px">${st}</div><div style="font-size:24px;font-weight:800;color:var(--text)">${stageCounts[st]}</div></div>`).join('')}
      </div>
      <div class="card"><div class="card-header"><div class="card-title">💼 All Prospects</div></div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Contact</th><th>Stage</th><th>Added</th><th>Actions</th></tr></thead>
          <tbody>${prospects.length === 0 ? '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--text-3)">No prospects yet</td></tr>' :
            prospects.map(p => {
              const sb = p.deal_stage==='Closed Won'?'badge-success':p.deal_stage==='Cold'?'badge-gray':'badge-info';
              return `<tr><td><div style="font-weight:600">${esc(p.name)}</div><div style="font-size:11px;color:var(--text-3)">${esc(p.occupation||'')}</div></td><td><div style="font-size:12px">${esc(p.email||'')}</div><div style="font-size:12px;color:var(--text-3)">${esc(p.phone||'')}</div></td><td><span class="badge ${sb}" style="font-size:10px">${p.deal_stage||'New'}</span></td><td style="font-size:12px;color:var(--text-3)">${p.created_at ? new Date(p.created_at).toLocaleDateString('en-SG') : '-'}</td><td><div style="display:flex;gap:6px">${p.phone ? `<a href="https://wa.me/65${(p.phone||'').replace(/\D/g,'')}" target="_blank" class="btn btn-ghost btn-sm">💬</a>` : ''}<button class="btn btn-success btn-sm" onclick="convertProspect('${p.id}','${esc(p.name)}')"✅</button><button class="btn btn-ghost btn-sm" onclick="showInviteLink('${p.id}','${esc(p.name)}')">🔗</button></div></td></tr>`;
            }).join('')}</tbody></table></div></div>`;
  } catch(e) { document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
}

async function convertProspect(id, name) {
  if (!confirm(`Convert ${name} to client?`)) return;
  try {
    await api.put(`/admin/clients/${id}`, { role: 'client' });
    toast(`${name} converted ✅`);
    renderAdminProspects();
  } catch(e) { toast(e.message, 'error'); }
}

// ── COMMISSIONS TRACKER ──────────────────────────────────────────────────────
async function renderCommissions() {
  document.getElementById('pageTitle').textContent = 'Commissions';
  document.getElementById('pageSub').textContent = 'Track your earnings';
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-primary" onclick="openCommissionModal()">+ Add Commission</button>`;
  
  try {
    const [commissions, summary, clients] = await Promise.all([
      api.get('/admin/commissions'),
      api.get('/admin/commissions/summary'),
      api.get('/admin/clients')
    ]);
    window._allCommissions = commissions;
    window._commClients = clients;
    
    const received = commissions.filter(c => c.status === 'received').reduce((s,c) => s + (c.amount||0), 0);
    const pending = commissions.filter(c => c.status === 'pending').reduce((s,c) => s + (c.amount||0), 0);
    const clawback = commissions.filter(c => c.status === 'clawback').reduce((s,c) => s + (c.amount||0), 0);
    const now = new Date();
    const thisMonth = commissions.filter(c => c.status === 'received' && c.received_date && new Date(c.received_date).getMonth() === now.getMonth() && new Date(c.received_date).getFullYear() === now.getFullYear()).reduce((s,c) => s + (c.amount||0), 0);
    
    document.getElementById('mainContent').innerHTML = `
      <div class="metrics-grid" style="margin-bottom:24px">
        <div class="metric"><div class="metric-accent" style="background:var(--success)"></div><div class="metric-label">YTD Received</div><div class="metric-value">${fmt(received)}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--warning)"></div><div class="metric-label">Pending</div><div class="metric-value">${fmt(pending)}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--danger)"></div><div class="metric-label">Clawback Risk</div><div class="metric-value">${fmt(clawback)}</div></div>
        <div class="metric"><div class="metric-accent" style="background:var(--primary)"></div><div class="metric-label">This Month</div><div class="metric-value">${fmt(thisMonth)}</div></div>
      </div>
      
      <div class="card" style="margin-bottom:20px">
        <div class="card-header"><div class="card-title">📊 Monthly Overview</div></div>
        <div class="card-body"><div class="chart-wrap"><canvas id="chartCommissions"></canvas></div></div>
      </div>
      
      <div class="card">
        <div class="card-header"><div class="card-title">💰 All Commissions</div>
          <div style="display:flex;gap:8px">
            <select id="commFilter" class="btn btn-secondary btn-sm" onchange="filterCommissions()">
              <option value="all">All Status</option>
              <option value="pending">Pending</option>
              <option value="received">Received</option>
              <option value="clawback">Clawback</option>
            </select>
          </div>
        </div>
        <div id="commTable" class="table-wrap">
          ${commissions.length === 0 ? '<div class="empty"><div class="empty-icon">💰</div><div class="empty-title">No commissions yet</div><button class="btn btn-primary" onclick="openCommissionModal()">+ Add First Commission</button></div>' :
          renderCommissionsTable(commissions)}
        </div>
      </div>`;
    
    // Build monthly chart
    const months = Array.from({length:12}, (_,i) => {
      const d = new Date(); d.setMonth(d.getMonth() - (11-i));
      return { label: d.toLocaleDateString('en-SG',{month:'short'}), month: d.getMonth(), year: d.getFullYear() };
    });
    const receivedByMonth = months.map(m => commissions.filter(c => c.status==='received' && c.received_date && new Date(c.received_date).getMonth()===m.month && new Date(c.received_date).getFullYear()===m.year).reduce((s,c)=>s+(c.amount||0),0));
    const pendingByMonth = months.map(m => commissions.filter(c => c.status==='pending' && c.expected_date && new Date(c.expected_date).getMonth()===m.month && new Date(c.expected_date).getFullYear()===m.year).reduce((s,c)=>s+(c.amount||0),0));
    
    mkChart('chartCommissions', {
      type:'bar',
      data:{labels:months.map(m=>m.label),datasets:[
        {label:'Received',data:receivedByMonth,backgroundColor:'rgba(16,185,129,0.7)',borderRadius:4},
        {label:'Pending',data:pendingByMonth,backgroundColor:'rgba(245,158,11,0.5)',borderRadius:4}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)}`}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}}}}
    });
  } catch(e) {
    document.getElementById('mainContent').innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
}

function renderCommissionsTable(commissions) {
  if (!commissions.length) return '<div style="padding:20px;text-align:center;color:var(--text-3)">No commissions found</div>';
  return `<table>
    <thead><tr><th>Client</th><th>Product</th><th>Insurer</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${commissions.map(c => `<tr>
      <td style="font-weight:600">${esc(c.client_name||c.client_id)}</td>
      <td>${esc(c.product_name||'')}</td>
      <td style="font-size:12px;color:var(--text-3)">${esc(c.insurer||'')}</td>
      <td><span class="badge badge-info" style="font-size:10px">${c.commission_type||'first_year'}</span></td>
      <td style="font-weight:700;color:var(--success)">${fmt(c.amount||0)}</td>
      <td style="font-size:12px">${c.received_date || c.expected_date || '—'}</td>
      <td><span class="badge ${c.status==='received'?'badge-success':c.status==='clawback'?'badge-danger':'badge-warning'}">${c.status||'pending'}</span></td>
      <td>
        <div style="display:flex;gap:4px">
          ${c.status==='pending'?`<button class="btn btn-success btn-sm" onclick="markCommission(${c.id},'received')" title="Mark received">✅</button>
          <button class="btn btn-danger btn-sm" onclick="markCommission(${c.id},'clawback')" title="Mark clawback">↩️</button>`:''}
          <button class="btn btn-ghost btn-sm" onclick="openCommissionModal(${c.id})">✏️</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="deleteCommission(${c.id})">🗑️</button>
        </div>
      </td>
    </tr>`).join('')}</tbody>
  </table>`;
}

function filterCommissions() {
  const f = document.getElementById('commFilter')?.value || 'all';
  const all = window._allCommissions || [];
  const filtered = f === 'all' ? all : all.filter(c => c.status === f);
  const el = document.getElementById('commTable');
  if (el) el.innerHTML = renderCommissionsTable(filtered);
}

async function markCommission(id, status) {
  try {
    const body = { status };
    if (status === 'received') body.received_date = new Date().toISOString().split('T')[0];
    await api.put(`/admin/commissions/${id}`, body);
    toast(status === 'received' ? 'Commission marked as received ✅' : 'Marked as clawback');
    renderCommissions();

function openNewProspectModal() {
  _parsedPolicies = [];
  document.getElementById('prospect-modal').style.display = 'flex';
  showStep('step-info');
  // clear fields
  ['p-name','p-dob','p-gender','p-occ','p-income','p-phone','p-email','p-source','p-text'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('file-preview').textContent = '';
  window._pFileData = null;
}

function closeProspectModal() { document.getElementById('prospect-modal').style.display = 'none'; }

function showStep(id) {
  ['step-info','step-parser','step-review','step-loading'].forEach(s => document.getElementById(s).style.display = s===id ? 'block' : 'none');
}

function goToInfoStep() { showStep('step-info'); }
function goToParserStep() {
  if (!document.getElementById('p-name').value.trim()) { alert('Please enter a name first'); return; }
  showStep('step-parser');
}

function handlePolicyFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    window._pFileData = { base64: e.target.result.split(',')[1], type: file.type, name: file.name };
    document.getElementById('file-preview').textContent = `✔ ${file.name} loaded (${(file.size/1024).toFixed(1)} KB)`;
    document.getElementById('p-text').value = '';
  };
  reader.readAsDataURL(file);
}

async function parseProspectPolicies() {
  const text = document.getElementById('p-text').value.trim();
  const fd = window._pFileData;
  if (!text && !fd) { alert('Paste policy text or upload an image/PDF'); return; }
  showStep('step-loading');
  try {
    const body = fd ? { image_base64: fd.base64, media_type: fd.type } : { text };
    const r = await api._req('POST', '/prospect/parse', body);
    _parsedPolicies = r.policies || [];
    renderParsedPreview(_parsedPolicies);
    showStep('step-review');
  } catch(e) { showStep('step-parser'); alert('Parse error: ' + e.message); }
}

    <div class="card" style="border-left:3px solid var(--danger)">

    </div>` : `
    <div class="card" style="border-left:3px solid ${catColors[p.category]||'#475569'};padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <div style="font-weight:600;font-size:13px">${p.product_name||'Unknown'}</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">${p.insurer||''} · ${p.sub_type||p.category||''}</div>

        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700;color:var(--primary)">$${Number(p.sum_assured||0).toLocaleString()}</div>
          <div style="font-size:11px;color:var(--text-secondary)">$${Number(p.annual_premium||0).toLocaleString()}/yr</div>
        </div>
      </div>
      ${p.sub_type==='Multi CI' && (p.multiplier_end_age||p.multiplier_times) ? `
      <div style="margin-top:8px;padding:6px 10px;background:#8B5CF622;border-radius:6px;font-size:12px">

  } else {

function computeLocalGap(income, policies) {
  const active = policies.filter(p => p.status === 'Active' && !p.error);
  const sum = arr => arr.reduce((s,p) => s+(parseFloat(p.sum_assured)||0), 0);
  const deathPols = active.filter(p => p.sub_type==='Death');
  const tpdPols   = active.filter(p => p.sub_type==='TPD');
  const teciPols  = active.filter(p => ['TECI','Early CI'].includes(p.sub_type));
  const multiPols = active.filter(p => p.sub_type==='Multi CI');
  const allCI     = active.filter(p => ['TECI','Early CI','Multi CI'].includes(p.sub_type));
  const hospPols  = active.filter(p => (p.sub_type||'').startsWith('Hospital'));
  const wardRank  = {'Hospital Private':5,'Hospital B1':4,'Hospital B2+':3,'Hospital B2':2,'Hospital C':1};
  const bestWard  = hospPols.reduce((b,p) => (wardRank[p.sub_type]||0)>(wardRank[b]||0)?p.sub_type:b, null);
  const hasMulti  = multiPols.length > 0;
  const multEnd   = hasMulti ? Math.min(...multiPols.map(p=>p.multiplier_end_age||99).filter(x=>x<99)) : null;
  const multTimes = hasMulti ? Math.max(...multiPols.map(p=>p.multiplier_times||0)) : null;
  const flag = (have,need) => need>0?(have>=need?'ok':have>=need*0.5?'partial':'gap'):(have>0?'ok':'gap');
  return {
    income,
    death:    {have:sum(deathPols),need:income*10,  gap:Math.max(0,income*10 -sum(deathPols)),  status:flag(sum(deathPols),income*10)},
    tpd:      {have:sum(tpdPols),  need:income*10,  gap:Math.max(0,income*10 -sum(tpdPols)),    status:flag(sum(tpdPols),income*10)},
    ci:       {have:sum(allCI),    need:income*5,   gap:Math.max(0,income*5  -sum(allCI)),      status:flag(sum(allCI),income*5)},
    early_ci: {have:sum(teciPols), need:income*3,   gap:Math.max(0,income*3  -sum(teciPols)),   status:flag(sum(teciPols),income*3)},
    multi_ci: {has:hasMulti, sum_assured:sum(multiPols), multiplier_end_age:multEnd<99?multEnd:null, multiplier_times:multTimes||null,
               note: hasMulti?`Multi-pay CI ✓${multEnd&&multEnd<99?` — multiplier ends age ${multEnd}`:''}${multTimes?` (${multTimes}x)`:''}`:'No multi-pay CI'},
    hospital: {ward:bestWard, status:bestWard==='Hospital Private'?'ok':bestWard?'partial':'gap',
               note:!bestWard?'No hospitalisation':bestWard==='Hospital Private'?'Private ✓':`${bestWard} — consider upgrading`},
    total_premium: active.reduce((s,p)=>s+(parseFloat(p.annual_premium)||0),0),
  };
}

            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
    `;
  } catch(e) { toast(e.message, 'error'); }
}

function toggleYearTable() {
  const wrap = document.getElementById('yearTableWrap');
  const toggle = document.getElementById('yearTableToggle');
  if (!wrap) return;
  if (wrap.style.maxHeight === '0px' || wrap.style.maxHeight === '') {
    wrap.style.maxHeight = '400px';
    if (toggle) toggle.textContent = '▲ Collapse';
  } else {
    wrap.style.maxHeight = '0px';
    if (toggle) toggle.textContent = '▼ Expand';
  }
}

function renderProspectGaps() {
  document.getElementById('pageTitle').textContent = 'Coverage Gap Analysis';
  document.getElementById('pageSub').textContent = 'Based on your profile and existing policies';
  document.getElementById('topbarActions').innerHTML = '';
  const main = document.getElementById('mainContent');
  const p = S.prospectProfile || {};
  const policies = S.prospectPolicies || [];
  const income = p.annual_income || 50000;
  const age = p.age || 30;
  const deps = p.dependents || 0;

  // Simple gap calc
  const yearsToRetire = Math.max(0, 65 - age);
  const recLife = deps > 0 ? income * Math.max(8, yearsToRetire) : income * Math.max(5, yearsToRetire * 0.7);
  const recCI = income * 4;
  const recHosp = 150000;

  const byType = {};
  policies.forEach(pol => {
    const t = (pol.type || 'Other').toLowerCase();
    if (!byType[t]) byType[t] = 0;
    byType[t] += pol.coverage || 0;
  });

  const lifeCov = byType['life'] || byType['term life'] || byType['whole life'] || 0;
  const ciCov = byType['critical illness'] || byType['ci'] || 0;
  const hospCov = byType['hospitalisation'] || byType['health'] || byType['medishield'] || 0;

  const gaps = [
    { name: 'Life Insurance', icon: '❤️', rec: recLife, have: lifeCov },
    { name: 'Critical Illness', icon: '🏥', rec: recCI, have: ciCov },
    { name: 'Hospitalisation', icon: '🚑', rec: recHosp, have: hospCov }
  ];

  main.innerHTML = `
  <div class="card">
    <div class="section-title" style="margin-bottom:16px">📊 Your Coverage vs Recommended</div>
    <div style="display:grid;gap:16px">
      ${gaps.map(g => {
        const pct = Math.min(100, Math.round((g.have / g.rec) * 100));
        const gap = Math.max(0, g.rec - g.have);
        const color = pct >= 80 ? 'var(--success)' : pct >= 50 ? 'var(--warning)' : 'var(--danger)';
        return `
        <div style="padding:16px;background:var(--bg-dark);border-radius:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-weight:600">${g.icon} ${g.name}</span>
            <span style="font-size:13px;color:${color}">${pct}% covered</span>
          </div>
          <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:8px">
            <div style="height:100%;width:${pct}%;background:${color};border-radius:4px"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary)">
            <span>Have: $${g.have.toLocaleString()}</span>
            <span>Recommended: $${g.rec.toLocaleString()}</span>
          </div>
          ${gap > 0 ? `<div style="margin-top:8px;padding:8px 12px;background:${color}22;border-radius:6px;font-size:12px;color:${color}"><strong>Gap:</strong> $${gap.toLocaleString()}</div>` : ''}
        </div>
        `;
      }).join('')}
    </div>
  </div>
  <div class="card" style="margin-top:16px;text-align:center;padding:24px">
    <div style="font-size:16px;margin-bottom:12px">Want to discuss these gaps?</div>
    <a href="${DYLAN_WHATSAPP_LINK}" target="_blank" class="btn btn-primary" style="font-size:15px;padding:12px 24px">💬 WhatsApp Dylan to Book</a>
  </div>
  `;
}

// Mobile bottom tab navigation
function mobileNav(page) {
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
  const pages = { dashboard: 'adminDashboard', clients: 'adminClients', alerts: 'adminAlerts', cpf: 'cpfCalc', profile: 'adminProfile' };
  if (S.role === 'admin') navTo(pages[page] || page);
  else if (S.role === 'prospect') navProspectPage(page === 'dashboard' ? 'home' : page === 'profile' ? 'profile' : page === 'cpf' ? 'cpf' : 'home');
  else navClientPage(page === 'dashboard' ? 'overview' : page === 'cpf' ? 'cpf' : page === 'profile' ? 'profile' : 'overview');
  event.currentTarget.classList.add('active');
}

</script>

<!-- Mobile Bottom Tabs -->
<div class="bottom-tabs" id="bottomTabs">
  <button class="bottom-tab" onclick="mobileNav('dashboard')"><span class="bottom-tab-icon">📊</span>Dashboard</button>
  <button class="bottom-tab" onclick="mobileNav('clients')"><span class="bottom-tab-icon">👥</span>Clients</button>
  <button class="bottom-tab" onclick="mobileNav('alerts')"><span class="bottom-tab-icon">🔔</span>Alerts</button>
  <button class="bottom-tab" onclick="mobileNav('cpf')"><span class="bottom-tab-icon">🧮</span>CPF</button>
  <button class="bottom-tab" onclick="mobileNav('profile')"><span class="bottom-tab-icon">👤</span>Profile</button>
</div>
