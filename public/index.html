async function renderReviews(clientId, isAdmin) {
  if (typeof hideQuickBar === 'function') hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Meeting Reviews';
  document.getElementById('pageSub').textContent = 'Annual reviews and meeting notes';
  document.getElementById('topbarActions').innerHTML = isAdmin
    ? `<button class="btn btn-primary btn-sm" onclick="openReviewModal()">+ Log Review</button>`
    : '';
  const cid = clientId || S.viewClientId || S.user?.id;
  let reviews;
  try { reviews = await api.get(`/clients/${cid}/reviews`); } catch(e) { toast('Failed to load reviews','error'); return; }

  // Next review banner
  const nextRev = reviews.find(r => r.next_review_date);
  const today = new Date();
  let bannerHtml = '';
  if (nextRev && nextRev.next_review_date) {
    const daysTo = Math.ceil((new Date(nextRev.next_review_date) - today) / 86400000);
    if (daysTo >= 0 && daysTo <= 30) {
      bannerHtml = `<div class="alert alert-${daysTo <= 7 ? 'danger' : 'warning'}"><div class="alert-icon">🔔</div><div class="alert-body"><strong>Next Review Due in ${daysTo} days</strong> — ${nextRev.next_review_date}</div></div>`;
    }
  }

  const typeColors = { annual_review:'#0EA5E9', policy_review:'#8B5CF6', claims_support:'#EF4444', ad_hoc:'#F59E0B' };
  const typeLabels = { annual_review:'Annual Review', policy_review:'Policy Review', claims_support:'Claims Support', ad_hoc:'Ad Hoc' };

  document.getElementById('mainContent').innerHTML = bannerHtml + (reviews.length === 0
    ? `<div class="card" style="text-align:center;padding:40px"><div style="font-size:48px">📋</div><div style="font-size:16px;font-weight:600;margin:12px 0 6px">No reviews logged yet</div><div style="color:var(--text-3);margin-bottom:16px">Schedule the first meeting to start tracking</div>${isAdmin ? `<button class="btn btn-primary" onclick="openReviewModal()">+ Log First Review</button>` : ''}</div>`
    : `<div style="display:flex;flex-direction:column;gap:14px">${reviews.map(r => `
      <div class="card" style="padding:16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <span style="background:${typeColors[r.meeting_type]||'#64748B'}22;color:${typeColors[r.meeting_type]||'#64748B'};padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700">${typeLabels[r.meeting_type]||r.meeting_type}</span>
            <div style="font-weight:600;font-size:15px;margin:8px 0 2px">${r.review_date}</div>
            ${r.next_review_date ? `<div style="font-size:12px;color:var(--text-3)">Next review: ${r.next_review_date}</div>` : ''}
          </div>
          ${isAdmin ? `<div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-sm" onclick='openReviewModal(${JSON.stringify(r)})'>✏️</button>
            <button class="btn btn-danger btn-sm" onclick="deleteReview(${r.id})">🗑️</button>

function updateRiskScore() {
  const scores = ['ff-risk1','ff-risk2','ff-risk3','ff-risk4','ff-risk5'].map(id => {
    const checked = document.querySelector(`input[name="${id}"]:checked`);
    return checked ? parseInt(checked.value) : 0;
  });
  const total = scores.reduce((s,v)=>s+v,0);
  const count = scores.filter(v=>v>0).length;
  if (count < 5) return;
  const avg = Math.round(total/5);
  const labels = ['','Conservative','Moderately Conservative','Balanced','Moderately Aggressive','Aggressive'];
  const el = document.getElementById('ff-risk-result');
  if (el) {
    el.style.display = '';
    el.textContent = `Risk Profile: ${labels[avg] || avg} (${avg}/5)`;
  }
}

async function renderClaims(clientId, isAdmin) {
  if (typeof hideQuickBar === 'function') hideQuickBar();
  document.getElementById('pageTitle').textContent = 'Claims History';
  document.getElementById('pageSub').textContent = 'Insurance claims and settlements';
  document.getElementById('topbarActions').innerHTML = isAdmin
    ? `<button class="btn btn-primary btn-sm" onclick="openClaimModal()">+ Log Claim</button>`
    : '';
  const cid = clientId || S.viewClientId || S.user?.id;
  let claims;
  try { claims = await api.get(`/clients/${cid}/claims`); } catch(e) { toast('Failed to load claims','error'); return; }

  const totalClaimed = claims.reduce((s,c) => s+(parseFloat(c.amount_claimed)||0), 0);
  const totalApproved = claims.reduce((s,c) => s+(parseFloat(c.amount_approved)||0), 0);
  const approvedCnt = claims.filter(c => ['approved','settled'].includes(c.status)).length;
  const approvalRate = claims.length ? Math.round(approvedCnt/claims.length*100) : 0;
  const fmt = v => `$${(v||0).toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  const statusBadge = s => { const m = {pending:'#F59E0B',approved:'#10B981',partial:'#F59E0B',rejected:'#EF4444',settled:'#06B6D4'}; return `<span style="background:${m[s]||'#64748B'}22;color:${m[s]||'#64748B'};padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700">${s}</span>`; };

  const approvedMsg = approvedCnt > 0 && !isAdmin ? `<div class="alert alert-info" style="background:var(--success-light);border-color:rgba(16,185,129,.3)"><div class="alert-icon">✅</div><div class="alert-body"><strong>Proof your coverage works</strong> — ${approvedCnt} claim${approvedCnt>1?'s':''} successfully paid out</div></div>` : '';

  document.getElementById('mainContent').innerHTML = `
    ${approvedMsg}
    <div class="metrics-grid" style="margin-bottom:20px">
      <div class="metric"><div class="metric-label">Total Claimed</div><div class="metric-value">${fmt(totalClaimed)}</div></div>
      <div class="metric"><div class="metric-label">Total Approved</div><div class="metric-value">${fmt(totalApproved)}</div></div>
      <div class="metric"><div class="metric-label">Approval Rate</div><div class="metric-value">${approvalRate}%</div></div>
    </div>
    ${claims.length === 0
      ? `<div class="card" style="text-align:center;padding:40px"><div style="font-size:48px">📝</div><div style="font-size:16px;font-weight:600;margin:12px 0 6px">No claims recorded</div>${isAdmin ? `<button class="btn btn-primary" onclick="openClaimModal()">+ Log First Claim</button>` : ''}</div>`
      : `<div class="card"><table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="border-bottom:2px solid var(--border)">${['Date','Type','Claimed','Approved','Status','Notes'].map(h=>`<th style="text-align:left;padding:10px 12px;color:var(--text-3);font-size:11px;text-transform:uppercase">${h}</th>`).join('')}${isAdmin?'<th></th>':''}</tr></thead>
          <tbody>${claims.map(c => `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:10px 12px;color:var(--text-2)">${c.claim_date}</td>
            <td style="padding:10px 12px">${c.claim_type||'—'}</td>
            <td style="padding:10px 12px;font-weight:600">${fmt(c.amount_claimed)}</td>
            <td style="padding:10px 12px;font-weight:600;color:var(--success)">${fmt(c.amount_approved)}</td>
            <td style="padding:10px 12px">${statusBadge(c.status)}</td>
            <td style="padding:10px 12px;color:var(--text-3);font-size:12px">${c.notes||'—'}</td>
            ${isAdmin ? `<td style="padding:10px 12px"><div style="display:flex;gap:4px">
              <button class="btn btn-secondary btn-sm" onclick='openClaimModal(${JSON.stringify(c)})'>✏️</button>
              <button class="btn btn-danger btn-sm" onclick="deleteClaim(${c.id})">🗑️</button>
            </div></td>` : ''}
          </tr>`).join('')}</tbody>
        </table></div>`
    }`;
}

function openClaimModal(c) {
  const isEdit = c && c.id;
  const polOptions = (S.policies||[]).map(p => `<option value="${p.id}" ${c&&c.policy_id==p.id?'selected':''}>${p.product_name}</option>`).join('');
  openModal(`${isEdit ? 'Edit' : 'Log'} Claim`, `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Claim Date</label><input id="cl-date" type="date" class="input" value="${c?.claim_date||new Date().toISOString().slice(0,10)}" style="margin-top:4px"></div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Claim Type</label><input id="cl-type" type="text" class="input" value="${c?.claim_type||''}" placeholder="Hospitalization, CI, Death..." style="margin-top:4px"></div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Linked Policy</label>
        <select id="cl-pol" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;margin-top:4px"><option value="">None</option>${polOptions}</select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Amount Claimed ($)</label><input id="cl-claimed" type="number" class="input" value="${c?.amount_claimed||''}" style="margin-top:4px"></div>
        <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Amount Approved ($)</label><input id="cl-approved" type="number" class="input" value="${c?.amount_approved||''}" style="margin-top:4px"></div>
      </div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Status</label>
        <select id="cl-status" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;margin-top:4px">
          ${['pending','approved','partial','rejected','settled'].map(s=>`<option value="${s}" ${c&&c.status===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Settled Date</label><input id="cl-settled" type="date" class="input" value="${c?.settled_date||''}" style="margin-top:4px"></div>
      <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Notes</label><textarea id="cl-notes" rows="2" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;margin-top:4px">${c?.notes||''}</textarea></div>
    </div>`, async () => {
    const cid = S.viewClientId || S.user?.id;
    const payload = { claim_date: document.getElementById('cl-date').value, claim_type: document.getElementById('cl-type').value, policy_id: document.getElementById('cl-pol').value||null, amount_claimed: parseFloat(document.getElementById('cl-claimed').value)||0, amount_approved: parseFloat(document.getElementById('cl-approved').value)||0, status: document.getElementById('cl-status').value, settled_date: document.getElementById('cl-settled').value||null, notes: document.getElementById('cl-notes').value };
    try {
      if (isEdit) await api.put(`/clients/${cid}/claims/${c.id}`, payload);
      else await api.post(`/clients/${cid}/claims`, payload);
      toast(isEdit ? 'Claim updated!' : 'Claim logged!'); closeModal(); renderClaims(cid, S.role==='admin');
    } catch(e) { toast(e.message, 'error'); }
  });
}
async function deleteClaim(id) {
  if (!confirm('Delete this claim?')) return;
  const cid = S.viewClientId || S.user?.id;
  await api.del(`/clients/${cid}/claims/${id}`);
  toast('Claim deleted'); renderClaims(cid, S.role==='admin');
}

// ── SRS Optimizer Tab (Feature 9) ────────────────────────────────────────────
function renderSrsOptimizer(clientId) {
  const c = S.client || {};
  const income = c.annual_income || 60000;
  const age = c.age || 30;
  document.getElementById('mainContent').innerHTML = `
    <div class="card" style="max-width:600px">
      <div class="card-header"><div class="card-title">🏦 SRS Tax Optimizer</div><div class="card-sub">Supplementary Retirement Scheme (Singapore)</div></div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
          <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Age</label><input id="srs-age" type="number" value="${age}" min="18" max="70" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);margin-top:4px"></div>
          <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Annual Income ($)</label><input id="srs-income" type="number" value="${income}" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);margin-top:4px"></div>
          <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Current SRS Balance ($)</label><input id="srs-balance" type="number" value="0" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);margin-top:4px"></div>
          <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Annual SRS Contribution ($)</label><input id="srs-contrib" type="number" value="0" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);margin-top:4px"></div>
          <div><label style="font-size:12px;font-weight:600;color:var(--text-2)">Residency Status</label>
            <select id="srs-res" style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:var(--radius);margin-top:4px">
              <option value="sg">Singaporean / PR</option><option value="ep">Foreigner (EP)</option>
            </select></div>
        </div>
        <button class="btn btn-primary" onclick="calcSrs()">Calculate 🧠</button>
        <div id="srs-result" style="margin-top:20px"></div>
      </div>
    </div>`;
}
function calcSrs() {
  const age = parseInt(document.getElementById('srs-age').value)||30;
  const income = parseFloat(document.getElementById('srs-income').value)||0;
  const balance = parseFloat(document.getElementById('srs-balance').value)||0;
  const contrib = parseFloat(document.getElementById('srs-contrib').value)||0;
  const res = document.getElementById('srs-res').value;
  const maxContrib = res === 'ep' ? 35700 : 15300;
  const additionalNeeded = Math.max(0, maxContrib - contrib);
  // SG tax brackets 2024
  const brackets = [[20000,0],[30000,0.02],[40000,0.035],[80000,0.07],[120000,0.115],[160000,0.15],[200000,0.18],[240000,0.19],[280000,0.195],[320000,0.20],[Infinity,0.22]];
  function taxOn(inc) {
    let tax = 0, prev = 0;
    for (const [lim, rate] of brackets) {
      if (inc <= prev) break;
      const band = Math.min(inc, lim) - prev;
      tax += band * rate;
      prev = lim;
    }
    return tax;
  }
  const taxBefore = taxOn(income);
  const taxAfterFull = taxOn(Math.max(0, income - maxContrib));
  const taxAfterCurrent = taxOn(Math.max(0, income - contrib));
  const taxSavedIfMax = taxBefore - taxAfterFull;
  const taxSavedCurrent = taxBefore - taxAfterCurrent;
  const taxSavedAdditional = taxAfterCurrent - taxAfterFull;
  // Projection to age 62
  const yearsTo62 = Math.max(0, 62 - age);
  const cagr = 0.05;
  const projBalance = balance * Math.pow(1+cagr, yearsTo62) + maxContrib * (Math.pow(1+cagr, yearsTo62)-1)/cagr;
  const monthlyDrawdown = projBalance / 120; // 10-year withdrawal window
  const effTax = taxOn(monthlyDrawdown*12*0.5); // 50% of withdrawal is taxable
  const fmt = v => `$${v.toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  document.getElementById('srs-result').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="metric"><div class="metric-label">SRS Limit</div><div class="metric-value">${fmt(maxContrib)}</div></div>
      <div class="metric"><div class="metric-label">Tax Saved (current)</div><div class="metric-value" style="color:var(--success)">${fmt(taxSavedCurrent)}</div></div>
      <div class="metric"><div class="metric-label">Additional Tax Savings if Maxed</div><div class="metric-value" style="color:var(--warning)">${fmt(taxSavedAdditional)}</div></div>
      <div class="metric"><div class="metric-label">Projected SRS at 62</div><div class="metric-value" style="color:var(--primary)">${fmt(projBalance)}</div></div>
    </div>
    ${additionalNeeded > 0 ? `<div class="alert alert-info"><div class="alert-icon">💡</div><div class="alert-body"><strong>Contribute ${fmt(additionalNeeded)} more</strong> to max out SRS and save an additional ${fmt(taxSavedAdditional)} in taxes this year</div></div>` : `<div class="alert alert-info" style="background:var(--success-light);border-color:rgba(16,185,129,.3)"><div class="alert-icon">✅</div><div class="alert-body"><strong>SRS maxed out!</strong> You're saving ${fmt(taxSavedIfMax)} in taxes this year.</div></div>`}
    <div style="margin-top:12px;padding:12px;background:var(--surface-2);border-radius:8px;font-size:13px">
      <strong>Estimated monthly drawdown at 62:</strong> ${fmt(monthlyDrawdown)}/mo (over 10 years)<br>
      <span style="color:var(--text-3);font-size:12px">Effective tax rate on withdrawal at 50% taxable: ~${fmt(effTax)}/yr</span>
    </div>`;
}

// Mobile bottom tab navigation
function mobileNav(page) {
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
  const pages = { dashboard: 'adminDashboard', clients: 'adminClients', alerts: 'adminAlerts', cpf: 'cpfCalc', profile: 'adminProfile' };
  if (S.role === 'admin') navTo(pages[page] || page);
  else if (S.role === 'prospect') navProspectPage(page === 'dashboard' ? 'home' : page === 'profile' ? 'profile' : page === 'cpf' ? 'cpf' : 'home');
  else navClientPage(page === 'dashboard' ? 'overview' : page === 'cpf' ? 'cpf' : page === 'profile' ? 'profile' : 'overview');
  event.currentTarget.classList.add('active');
}
